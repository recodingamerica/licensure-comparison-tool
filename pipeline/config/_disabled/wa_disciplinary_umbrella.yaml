# DISABLED — recovered verbatim from state_structure.yaml on 2026-06-30.
#
# This was a SECOND `WA:` top-level block. YAML last-wins silently dropped it,
# so this disciplinary-umbrella config was NEVER actually applied. It merges WA's
# Uniform Disciplinary Act umbrella (Title 18 Ch 18.130 + 18.122 admin procedure +
# 18.235 biz-reg) into every WA health profession via per-section Justia URLs.
#
# It CANNOT be merged as-is into the live `source: wa_official` WA block:
#  - section_url_list entries are Justia URLs, and chapter_url_template only
#    rewrites a node's `url` (not section_url_list items), so they'd be fetched
#    from Justia, which is now Cloudflare-blocked.
#  - the override mechanism adds ONE node per profession; the umbrella is 3 extra
#    whole chapters per profession.
#
# JUL-1 TODO: re-express these 3 chapters under wa_official (cite=18.130 / 18.122 /
# 18.235 &full=true) as additive supplementary nodes, then re-pull + re-extract the
# 6 WA health professions. See memory reference_wa_duplicate_key_bug.

WA:
  source: justia
  layout: chapter
  notes: |
    WA centralizes disciplinary grounds in Title 18 Ch 18.130 (Uniform Disciplinary Act).
    Each health profession's own chapter (18.71 Physicians, 18.79 Nursing, etc.) has its own
    scope-and-licensure provisions but defers to Ch 18.130 for grounds, complaints, sanctions.
    Ch 18.122 covers administrative procedure and 18.235 the Uniform Regulation of Business
    and Professions Act. We pull all three as umbrella context for every WA health profession,
    merged with the label-matched profession-specific chapter.
  professions:
    medicine:
      url: "https://law.justia.com/codes/washington/title-18/"
      label: "WA Ch 18.130 (Uniform Disciplinary Act) + 18.122 (Admin Procedure) + 18.235 (Biz Reg) — universal discipline framework, added alongside profession-specific chapter via merge"
