  patterns: ["physician assistant", "physician's assistant", "physicians' assistant"]

anesthesiologist_assistant:
  display: Anesthesiologist Assistant
  family: [health]
  patterns: ["anesthesiologist assist"]

dentistry:
  display: Dentistry & Dental Hygiene
  abbrev: DEN
  family: [health]
  patterns: [dentist, "dental hygien", "dental practice", "dental assist"]

optometry:
  display: Optometry
  abbrev: OPT
  family: [health]
