# Estimated USD cost per unit for each paid stage. Tied to the models in models.yaml
# and current API prices — so the numbers live here (a config edit), not in code.
#
# trim / extract are per (profession, state) CELL; schema is per profession, ONE-TIME
# (one call reads all a profession's states at once). The runner and dashboard both
# read these via config.loaders.cost_for so they always quote the same figure.
trim: 0.05      # trim_state (Haiku)
extract: 0.15   # extract_state_batch (Sonnet)
verify: 0.10    # verify_negatives, per profession (Sonnet; audits only the excluded cells)
schema: 1.00    # discover_schema, one-time per profession (Sonnet)
