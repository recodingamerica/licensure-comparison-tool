# Arkansas umbrella-scope manifest.
# Title 17 (Professions and Occupations) has several genuinely cross-cutting
# chapters that apply to "any state board, commission, or bureau" examining
# licensure applicants.

chapter_universal:
  - chapter-80   # GENERAL PROVISIONS (§§ 17-80-101+) — filing of licensing
                 # info applies to "the Director of [any Arkansas board]"
  - chapter-1    # GENERAL PROVISIONS (§§ 17-1-101+) — US veteran exam credit,
                 # applies "in all examinations held by any and all state
                 # boards, commissions, or bureaus"
  - chapter-2    # KEEP ARKANSANS WORKING ACT OF 2019 — universal worker
                 # licensing reform
  - chapter-3    # OCCUPATIONAL CRIMINAL BACKGROUND CHECKS — universal
                 # criminal-records policy across all occupational licenses
  - chapter-4    # OCCUPATIONAL LICENSING OF UNIFORMED SERVICE MEMBERS,
                 # VETERANS — universal military portability
