# North Carolina umbrella-scope manifest.

umbrella_chapters_drop:
  - chapter-150b   # Administrative Procedure Act — NC GS Ch 150B, state-wide
                   # rulemaking/declaratory-ruling/contested-case procedure. 48
                   # sections, applies to every agency not just licensing.

# Chapters that genuinely apply to every licensed profession in the state.
# Walker can't infer this from in-text enumeration because the chapter
# title is the only place it says "Occupational Licensing Boards."
chapter_universal:
  - chapter-93b    # Occupational Licensing Boards — NC GS Ch 93B. Sections
                   # cover annual reports, audits, member compensation,
                   # examination procedures, etc., across every NC licensing
                   # board. 20 sections.
