# Ohio umbrella-scope manifest.
# Title XLVII (47) "Occupations - Professions" has several chapters that
# apply broadly across "each board, commission, or agency created under or
# by virtue of Title XLVII."

chapter_universal:
  - chapter-4796   # Occupational Licenses for Out-of-State Applicants —
                   # universal portability
  - chapter-4743   # Occupational Licensing Boards, Commissions, and Agencies
                   # Generally — "each board, commission, or agency created
                   # under or by virtue of Title XLVII"
  - chapter-4776   # Criminal Records Checks — universal across Title XLVII
  - chapter-4798   # Occupational Regulations — cross-cutting definitions and
                   # cert/license distinctions across Title XLVII
  - chapter-4745   # Standard License Renewal Procedure — universal renewal
                   # procedure across Title XLVII boards
