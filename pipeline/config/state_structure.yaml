# ---- Centralized-discipline states (umbrella chapter added to every profession's corpus) ----

WA:
  source: justia
  layout: chapter
  notes: |
    WA centralizes disciplinary grounds in Title 18 Ch 18.130 (Uniform Disciplinary Act).
    Each health profession's own chapter (18.71 Physicians, 18.79 Nursing, etc.) has its own
    scope-and-licensure provisions but defers to Ch 18.130 for grounds, complaints, sanctions.
    Ch 18.122 covers administrative procedure and 18.235 the Uniform Regulation of Business
    and Professions Act. We pull all three as umbrella context for every WA health profession,
    merged with the label-matched profession-specific chapter.
  professions:
    medicine:
      url: "https://law.justia.com/codes/washington/title-18/"
      label: "WA Ch 18.130 (Uniform Disciplinary Act) + 18.122 (Admin Procedure) + 18.235 (Biz Reg) — universal discipline framework, added alongside profession-specific chapter via merge"
