MN:
  # FLIPPED TO JUSTIA 2026-07-02 (everything-except-PA directive). Was source: revisor_mn.
  # Justia MN is RANGE-GROUPED, not year-versioned: /codes/minnesota/chapters-{LO}-{HI}/
  # chapter-{N}/section-{N}-{sub}/ (the dot in 147.01 -> hyphen: section-147-01; lettered
  # chapters lowercase: 150A -> chapter-150a). Chapters 147/147A/148/150A/153 are in range
  # 144-159; 326A is in 324-342. Leaf-verified real statute text before flipping.
