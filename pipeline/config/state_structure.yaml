# State-keyed structural metadata.
#
# Each state tells the pipeline three things:
#   source        which cleaner / fetch strategy to use (justia, revisor_mn, mi_legis, …)
#   layout        how the source's hierarchy is organized
#                   chapter             — title page lists chapters; default for most Justia states
#                   section_fallback    — title page returns flat sections (AZ, OK, MI, WI, LA on Justia)
#                   subtitled           — title is split into subtitles/divisions; profession chapters live one level deeper (AR, CA, CO)
#                   inline_chapter_blob — the whole chapter is served inline on ONE page with no per-section links (ND); the walker splits it on line-anchored "title-chapter-section." markers instead of drilling
#                   external            — non-Justia source (revisor_mn, mi_legis, etc.)
#                   broken              — source coverage is bad; needs custom scraper or accepts gap
#   professions   per-profession URL or section pattern within this state
#                   url:                  direct chapter URL (most cases)
#                   section_slug_pattern: regex on section URL slug (section_fallback states)
#                   section_url_list:     explicit list of section URLs (non-Justia sources)
#
# Match-time precedence (highest first):
#   1. state_structure.yaml   (this file — preferred long-term home)
#   2. manual_overrides.yaml  (legacy; keeps working until migrated in)
#   3. label-substring match  (default if neither file has an entry)
#
# A state with no entry here defaults to source=justia, layout=chapter, and
# falls through to label match. Most states never need a state_structure entry.
#
# A COMMENTED-OUT `# source: xyz_official  — FLIPPED TO JUSTIA <date>` line means
# exactly the same thing as no source key at all (justia) — it's kept purely as
# history (what this state used to use, and when it changed), not as inactive
# config waiting to be re-enabled. ONLY an uncommented `source:` line is active.
# (2026-07-07: an uncommented-but-actually-retired source: tag on 8 states —
# CT/ID/ME/RI/SD/VA/VT/WA — caused a real bug: corpus_drift trusted the
# uncommented key and silently skipped drift-checks on all 8. If you ever
# retire a source, comment the whole line out — don't just note it elsewhere.)

# ---- Citation patterns: how a state's section LABEL encodes its citation ----
#
# `short_citation()` turns a section label ("50-6,100 Arbitration of disputes.") into the
# citation the evidence will cite ("50-6,100"). One regex cannot be right for every state,
# and trying to make one produced silent, state-shaped damage: the default's separator
# class had no comma, so every KS/NE comma-numbered section collapsed to a common prefix
# — all 65 of Kansas's 50-6,1xx sections became the single citation "50-6". They were
# therefore unaddressable AND colliding with each other, so no quote citing them could
# highlight.
#
# So the patterns live here, per state, INCLUDING the default — one place to look rather
# than a default buried in code with overrides in config. Rules:
#   * first capture group is the citation
#   * anchored (^) unless the state genuinely needs a mid-label search
#   * a state with no `citation_pattern` uses `_default`
#   * `citation_pattern: null` means "labels here carry no citation" — don't guess
#
# Changing a pattern does NOT require re-fetching: text/ keeps the full `label`, so
# citations can be recomputed from the committed corpus.
_citation_patterns:
  # The DEFAULT is the long-standing unanchored pattern, unchanged. It must stay
  # unanchored: many states prefix the number ("Sec. 4.5." in IL, "NRS 577.010" in NV),
  # and anchoring it re-cited 15,138 sections across 363 cells with the whole label.
  # Override per state ONLY where the default is demonstrably wrong there.
  _default: '(?:section\s+|§\s*)?([0-9]+[A-Za-z]?(?:[-:.][0-9A-Za-z]+)+)'
  # KS/NE embed a comma IN the section number: 50-6,100 / 38-1,125. Under the default's
  # comma-free separator class the match stopped at the comma, so all 65 of Kansas's
  # 50-6,1xx sections collapsed to the single citation "50-6" -- unaddressable, and
  # colliding with each other. Anchored as well, so a "$27,500" later in a prose label
  # can't be picked up as a citation now that commas are allowed.
  KS: '^\s*(?:section\s+|§\s*)?([0-9]+[A-Za-z]?(?:[-:.,][0-9A-Za-z]+)+)'
  NE: '^\s*(?:section\s+|§\s*)?([0-9]+[A-Za-z]?(?:[-:.,][0-9A-Za-z]+)+)'

# ---- States with real layout/source quirks worth recording ----

AZ:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/arizona/title-32/"
  notes: "Title 32 has no chapter level on Justia — title page returns 1500+ flat sections; each profession is a section number range"
  professions:
    podiatry:
      section_slug_pattern: '^section-32-8(0[0-9]|[1-5][0-9])(-version-\d+)?$'
      label: "AZ Title 32 §§32-801..32-859 — Podiatry"
    # Trades: FLIPPED TO JUSTIA 2026-07-02 (everything-except-PA directive). Justia
    # Title 32 has no chapter level (flat sections), so contractors (Title 32 Ch 10
    # = §§32-1101..32-1188) are scoped by section_slug_pattern against the title-32
    # section list — same mechanism as podiatry above. Leaf-verified LIVE before flip.
    construction_trades:
      section_slug_pattern: '^section-32-11(0[1-9]|[1-8][0-9])(-version-\d+)?$'
      authoritative: true
      label: "AZ Title 32 §§32-1101..32-1188 — Contractors (Construction Industry Licensing)"
    # #53: AZ HVAC is licensed as a contractor classification (R-39/C-39) inside the
    # same Ch 10 Contractors chapter — not a standalone license. Same section scope so
    # extraction records it as license-via-contractor-classification (not a blank).
    hvac:
      section_slug_pattern: '^section-32-11(0[1-9]|[1-8][0-9])(-version-\d+)?$'
      authoritative: true
      label: "AZ Title 32 Ch 10 — Contractors (HVAC = R-39/C-39 classification)"
    # electrician/plumbing are AZ contractor specialty classifications inside the
    # same Ch 10 (no standalone license), so they ride the same section pattern.
    # Added 2026-07-02 (were label-matched to the old azleg.gov pull, missed in
    # the trades flip). Flip to Justia to clear the azleg dependency.
    electrician:
      section_slug_pattern: '^section-32-11(0[1-9]|[1-8][0-9])(-version-\d+)?$'
      authoritative: true
      label: "AZ Title 32 Ch 10 — Contractors (electrical specialty classification)"
    plumbing:
      section_slug_pattern: '^section-32-11(0[1-9]|[1-8][0-9])(-version-\d+)?$'
      authoritative: true
      label: "AZ Title 32 Ch 10 — Contractors (plumbing specialty classification)"

OK:
