    Provisions). §6509 defines professional misconduct; §6510 sets procedure; §6511 lists
    penalties. Without this, every NY profession returns 0 disciplinary_grounds because
    Article 131 (Medicine), 133 (Dentistry), etc. don't repeat the universal grounds.
