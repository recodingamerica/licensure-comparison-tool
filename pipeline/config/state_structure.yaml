PA:
  # PA isn't on Justia; the legacy static endpoint serves each act's full text on
  # one HTML page that the existing curl_cffi chrome fetch reads cleanly. pull_text
  # detects the legis.state.pa.us host and splits the page into per-section records
  # (div.Comment markers). URL form: /WU01/LI/LI/US/HTM/{year}/{sessInd}/{act:04d}..HTM
  # — use the static page, NOT the modern uconsCheck.cfm?act=NN (301s to the JS site).
  source: pa_legis
  layout: external
  notes: "Per-profession url points at the act's WU01 static page. Validated 2026-06-17 (optometry act 57/1980, 19 sections)."
  professions:
    optometry:
      url: "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1980/0/0057..HTM"
      label: "Optometric Practice and Licensure Act (Act 57 of 1980)"
      note: "Standalone optometry act; 63 P.S. § 244.x. Pilot for the pa_legis puller (#26)."
    dietetics:
      url: "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1951/0/0069..HTM"
      label: "Professional Nursing Law (Act 69 of 1951) — LDN sections"
      note: "LDN licensure is embedded in the Nursing Law (#25). pa_keep_sections scopes the corpus to the dietitian-nutritionist + act-wide administrative sections, dropping the nursing-scope blocks (§3 RN/CNS, §4 unauthorized practice, §8.1-8.9 CRNP/CNS/CRNA, §6.1/6.2 nursing education, §12.1 nursing CE) and repealed stubs."
      # Sections kept: 3.1 (LDN license required), 5/6/8 (exam, qualifications,
      # entitlement), 2/2.1/2.2 (defs, board, communication), 7 (out-of-state
      # endorsement), 11/11.1/11.2/11.3 (license duration/renewal/fees/reports),
      # 13/14/14.1 (penalties, discipline, impaired), 15-15.5 (suspension/
      # revocation/reinstatement/injunction/subpoena — act-wide procedure).
      pa_keep_sections: ["2", "2.1", "2.2", "3.1", "5", "6", "7", "8", "11", "11.1", "11.2", "11.3", "13", "14", "14.1", "15", "15.1", "15.2", "15.3", "15.4", "15.5"]
