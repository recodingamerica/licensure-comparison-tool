# State-keyed structural metadata.
#
# Each state tells the pipeline three things:
#   source        which cleaner / fetch strategy to use (justia, revisor_mn, mi_legis, …)
#   layout        how the source's hierarchy is organized
#                   chapter             — title page lists chapters; default for most Justia states
#                   section_fallback    — title page returns flat sections (AZ, OK, MI, WI, LA on Justia)
#                   subtitled           — title is split into subtitles/divisions; profession chapters live one level deeper (AR, CA, CO)
#                   external            — non-Justia source (revisor_mn, mi_legis, etc.)
#                   broken              — source coverage is bad; needs custom scraper or accepts gap
#   professions   per-profession URL or section pattern within this state
#                   url:                  direct chapter URL (most cases)
#                   section_slug_pattern: regex on section URL slug (section_fallback states)
#                   section_url_list:     explicit list of section URLs (non-Justia sources)
#
# Match-time precedence (highest first):
#   1. state_structure.yaml   (this file — preferred long-term home)
#   2. manual_overrides.yaml  (legacy; keeps working until migrated in)
#   3. label-substring match  (default if neither file has an entry)
#
# A state with no entry here defaults to source=justia, layout=chapter, and
# falls through to label match. Most states never need a state_structure entry.

# ---- States with real layout/source quirks worth recording ----

AZ:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/arizona/title-32/"
  notes: "Title 32 has no chapter level on Justia — title page returns 1500+ flat sections; each profession is a section number range"
  professions:
    podiatry:
      section_slug_pattern: '^section-32-8(0[0-9]|[1-5][0-9])(-version-\d+)?$'
      label: "AZ Title 32 §§32-801..32-859 — Podiatry"

OK:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/oklahoma/title-59/"
  notes: "Title 59 returns flat sections; each profession is a section range (e.g. CPA §§59-15.1..59-15.36, podiatry §§59-135..59-160.1)"
  professions:
    podiatry:
      section_slug_pattern: '^section-59-1(3[5-9]|[4-5][0-9]|60(-1)?)$'
      label: "OK Title 59 §§59-135..59-160.1 — Podiatry Practice Act"
    medicine:
      # Allopathic Medical and Surgical Licensure Act, 59 O.S. §§480–518.1
      # (55 sections). Label-match previously grabbed a stray §59-650.
      section_slug_pattern: '^section-59-(4[89][0-9]|5[01][0-9]|518)(-.*)?$'
      label: "OK Title 59 §§480–518.1 — Allopathic Medical & Surgical Licensure Act"
    public_accountancy:
      # Oklahoma Accountancy Act, 59 O.S. §§15.1+ (the §59-15.x range).
      section_slug_pattern: '^section-59-15-[0-9]'
      label: "OK Title 59 §§15.1+ — Oklahoma Accountancy Act"

KY:
  source: justia
  layout: chapter
  title_url: "https://law.justia.com/codes/kentucky/"
  notes: "Justia organizes KY by year (/codes/kentucky/2024/ etc.); build_hierarchy auto-redirects to latest year. Chapter 311 (Medicine) is huge — podiatry is sections 380-440 within it; other professions live in their own KRS chapters."
  professions:
    podiatry:
      url: "https://law.justia.com/codes/kentucky/chapter-311/"
      # Podiatry act runs §§311.380–311.500; the old 380–440 pattern cut off
      # renewal (450), reciprocity (475), and the discipline sections 480
      # (grounds) + 490 (hearing). 510/520 are repealed; 530+ is the separate
      # physicians' Board of Medical Licensure, not podiatry.
      section_slug_pattern: '^section-311-(3[89][0-9]|4[0-9][0-9]|500)$'
      label: "KY KRS 311.380..311.500 — Podiatry within Chapter 311"

LA:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/louisiana/revised-statutes/title-37/"
  notes: "RS Title 37 returns flat sections; profession-specific section ranges identifiable by RS:NN:NNN slug pattern"
  professions:
    podiatry:
      section_slug_pattern: '^rs-37-61[1-9]$|^rs-37-62[0-9]$'
      label: "LA RS 37:611..37:629 — Podiatry within Title 37"

WI:
  source: justia
  layout: chapter
  title_url: "https://law.justia.com/codes/wisconsin/"
  notes: "Justia WI is year-versioned (/codes/wisconsin/2024/); build_hierarchy auto-redirects. Chapter 449 = Optometry, Chapter 447 = Dentistry, etc. Chapter 448 (Medical Practices) holds podiatry as a section range §§448.60-448.69."
  professions:
    podiatry:
      url: "https://law.justia.com/codes/wisconsin/chapter-448/"
      section_slug_pattern: '^section-448-6[0-9](-\d+)?$'
      label: "WI Chapter 448 §§448.60..448.69 — Podiatrists subchapter"
    dietetics:
      # 448.9887/448.9888 (dietitian licensure compact, 2025 Act 20) live under
      # their own heading after the PA compact, outside the 70-94 subchapter.
      url: "https://law.justia.com/codes/wisconsin/chapter-448/"
      section_slug_pattern: '^section-448-(7[0-9]|8[0-9]|9[0-4]|988[78])(-\d+)?$'
      label: "WI Chapter 448 §§448.70..448.94 — Dietitians subchapter, plus §§448.9887-448.9888 dietitian licensure compact (2025 Act 20)"

NV:
  source: justia
  layout: chapter
  title_url: "https://law.justia.com/codes/nevada/"
  notes: "Justia NV is year-versioned (/codes/nevada/2025/) and shows a single flat list of every NRS chapter — title-54 root returns nothing useful. build_hierarchy auto-redirects to latest year so chapter labels (e.g. 'Chapter 635 - Podiatric Physicians and Podiatry Hygienists') become reachable for label-match."

WV:
  source: justia
  layout: chapter
  notes: "WV recodified — old podiatry chapter §30-11 was repealed in 1980; current law is in Medicine §30-3"
  professions:
    podiatry:
      url: "https://law.justia.com/codes/west-virginia/chapter-30/article-3/"
      label: "Chapter 30 Article 3 — Medicine and Surgery"

FL:
  source: justia
  layout: chapter
  notes: "Chapter 468 (Miscellaneous Professions) is split into Parts I-XVI on Justia, each with its own part page; dietetics is Part X. Section 468.510's slug is 'section-468-51' (Justia drops the trailing zero)."
  professions:
    dietetics:
      url: "https://law.justia.com/codes/florida/title-xxxii/chapter-468/part-x/"
      section_slug_pattern: '^section-468-5(0[1-9]|1[1-8]?)$'
      label: "FL Ch. 468 Part X §§468.501..468.518 — Dietetics and Nutrition Practice"

MO:
  source: justia
  layout: chapter
  notes: "Chapter 324 is a flat multi-profession chapter (general provisions, perfusionists, dietitians, massage therapy as section ranges). Dietitian Practice Act = §§324.200..324.225; adjacent §324.228 is the act's rulemaking-authority section (excluded from the range per the act's own short title)."
  professions:
    dietetics:
      url: "https://law.justia.com/codes/missouri/title-xxii/chapter-324/"
      section_slug_pattern: '^section-324-2(0[0-9]|1[0-9]|2[0-5])$'
      label: "MO RSMo 324.200..324.225 — Dietitian Practice Act within Chapter 324"

SC:
  source: justia
  layout: chapter
  notes: "Justia's title-40 index lists 'Chapter 20 - South Carolina Dietetics Licensure Act' as plain text with NO hyperlink, so hierarchy build misses it. Chapter page exists; year-less URL redirects to /codes/south-carolina/2024/. Entire chapter (14 sections, 40-20-5..40-20-130) is dietetics."
  professions:
    dietetics:
      url: "https://law.justia.com/codes/south-carolina/title-40/chapter-20/"
      label: "Title 40 Chapter 20 — South Carolina Dietetics Licensure Act"

