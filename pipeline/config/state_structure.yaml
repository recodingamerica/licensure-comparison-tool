WA:
  # FLIPPED TO JUSTIA 2026-07-01 (Justia-only decision); the app.leg.wa.gov
  # official-source parser code was removed 2026-07-08 (unverified/unused).
  # WA centralizes disciplinary grounds in Ch 18.130 (Uniform Disciplinary Act);
  # each health profession's own chapter defers to it for grounds/complaints/
  # sanctions. Appended as an additive umbrella node, fetched from Justia (the
  # url below). See docs/runbooks/wa_umbrella_mechanism.md.
  # NOTE (2026-06-30): mechanism live; the 6 WA health professions still need a
  # re-pull + re-extract to actually ingest 18.130 — do it in the Jul-1 refresh.
  umbrella:
    professions: [medicine, nursing, optometry, podiatry, dentistry, public_accountancy]
    chapters:
      - url: "https://law.justia.com/codes/washington/title-18/chapter-18-130/"
        label: "WA Ch 18.130 — Uniform Disciplinary Act (grounds, complaints, sanctions)"
  professions:
    # WA has no standalone HVAC/mechanical license — mechanical work is performed
    # under general contractor registration (Ch 18.27). Pin it: the 'refrigeration'
    # pattern otherwise mis-matches RCW 9.03 (abandoned-refrigerator criminal statute).
    # authoritative drops that noise. (Example of #53's "folded into contractor
    # licensing" regulatory model.)
    hvac:
      url: "https://law.justia.com/codes/washington/title-18/chapter-18-27/"
      authoritative: true
      label: "WA Ch 18.27 — Registration of Contractors (HVAC via contractor registration)"
    # WA nursing practice is RCW 18.79 (RN/LPN/ARNP). Unpinned, label-match dragged
    # in nursing HOMES (Ch 18.51) + Title 74 long-term-care resident law (74.42/.46/.48)
    # + nursing assistants (18.88a) — ~340 irrelevant sections that poisoned trim and
    # would pollute scope extraction. authoritative drops all of that. Disciplinary
    # grounds still arrive via the 18.130 umbrella node above.
    nursing:
      url: "https://law.justia.com/codes/washington/title-18/chapter-18-79/"
      authoritative: true
      label: "WA Ch 18.79 — Nursing Care (RN / LPN / ARNP practice)"

