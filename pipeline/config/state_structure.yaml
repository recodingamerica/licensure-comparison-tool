UT:
  # FLIPPED TO JUSTIA 2026-07-02 (everything-except-PA directive). Justia serves
  # Title 58 Ch 55 as Parts (part-1..part-7); the section walk
  # (collect_section_targets, max_depth 6) recurses parts -> section leaves.
  # Leaf-verified LIVE via pipeline.eval.verify_urls before flipping. (The
  # le.utah.gov XML-parser code was removed 2026-07-08 — unverified/unused.)
  notes: >
    Utah co-regulates the building trades in ONE statute — Title 58 Ch. 55,
    the Utah Construction Trades Licensing Act — covering contractors,
    electricians, plumbers and HVAC under one board (DOPL / Construction
    Services Commission). There is no separate electrician/plumber/HVAC
    chapter. To surface them as distinct professions we wire the SAME chapter
    url under each trade (the engineering/surveying/geology + social_work/MHC
    shared-act pattern); per-trade scoping happens at trim_state, which drops
    the other trades' sections from each corpus. Source is le.utah.gov (the
    official site serves structured chapter XML to plain requests) rather than
    Justia, which now Cloudflare-blocks all our IPs. Every other UT profession
    still resolves by label-match against the Justia hierarchy — this block
    only overrides the four trades.
  # UT umbrella: Title 58 Ch 1 (Division of Professional Licensing Act — DOPL
  # powers, discipline, fees) is general provisions for ALL Title 58 trades.
  # Declared via the state-level umbrella mechanism so it attaches to all 4 trades
  # consistently (was a construction_trades-only mapping_overrides one-off, which
  # silently left electrician/plumbing/hvac without it — caught by corpus_drift).
  umbrella:
    professions: [construction_trades, electrician, plumbing, hvac]
    chapters:
      - url: "https://law.justia.com/codes/utah/title-58/chapter-1/"
        label: "Chapter 1 - Division of Professional Licensing Act (umbrella)"
  professions:
    construction_trades:
      url: "https://law.justia.com/codes/utah/title-58/chapter-55/"
      authoritative: true  # the shared chapter IS the complete source; drop label siblings
      label: "Chapter 55 - Utah Construction Trades Licensing Act (contractor scope)"
      note: "SHARED ACT — same chapter feeds electrician/plumbing/hvac. construction_trades = general/specialty CONTRACTOR license."
    electrician:
      url: "https://law.justia.com/codes/utah/title-58/chapter-55/"
      authoritative: true
      label: "Chapter 55 - Utah Construction Trades Licensing Act (electrician scope)"
      note: "SHARED ACT with construction_trades — scope to journeyman/master/residential electrician licensing within Ch. 55."
    plumbing:
      url: "https://law.justia.com/codes/utah/title-58/chapter-55/"
      authoritative: true
      label: "Chapter 55 - Utah Construction Trades Licensing Act (plumbing scope)"
      note: "SHARED ACT with construction_trades — scope to journeyman/master/residential plumber licensing within Ch. 55."
    hvac:
      url: "https://law.justia.com/codes/utah/title-58/chapter-55/"
      authoritative: true
      label: "Chapter 55 - Utah Construction Trades Licensing Act (HVAC scope)"
      note: "SHARED ACT with construction_trades — HVAC is a contractor classification within Ch. 55, not a standalone journeyman license."

