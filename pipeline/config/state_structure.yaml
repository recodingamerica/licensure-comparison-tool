TX:
  source: justia
  layout: subtitled
  title_url: "https://law.justia.com/codes/texas/2023/occupations-code/title-3/"
  notes: "Occupations Code Title 3 splits by subtitle; podiatry is Subtitle C / Chapter 202"
  professions:
    podiatry:
      url: "https://law.justia.com/codes/texas/2023/occupations-code/title-3/subtitle-c/chapter-202/"
      label: "Texas Occupations Code Chapter 202 — Podiatrists"
    architecture:
      # Label-matching landed on the whole of Title 6, "Regulation of Engineering,
      # Architecture, Land Surveying, and Related Practices". The pull drilled one level
      # to its six chapters and stopped, so architecture/TX shipped 6 chapter INDEX pages
      # and no statute at all. Five of those six are other professions we track
      # separately (Engineers 1001, Geoscientists 1002, Landscape Architects 1052,
      # Interior Designers 1053, Land Surveyors 1071) — pulling the title would have
      # mixed all of them into architecture.
      url: "https://law.justia.com/codes/texas/occupations-code/title-6/subtitle-b/chapter-1051/"
      label: "Texas Occupations Code Chapter 1051 — Texas Board of Architectural Examiners"
      # REPLACES the label match rather than supplementing it: chapter 1051 IS the whole
      # of Texas architecture law, and the label-matched Title 6 node would otherwise
      # still be pulled alongside it (330 leaf sections of engineers, geoscientists,
      # landscape architects, interior designers and land surveyors).
      authoritative: true

OR:
  source: justia
  layout: subtitled
  title_url: "https://law.justia.com/codes/oregon/"
  notes: "Justia OR is year-versioned (/codes/oregon/2025/) then split into 19 volumes. build_hierarchy auto-redirects to latest year, then drills each volume so chapter labels are reachable to label-match. ORS Chapter 677 (Regulation of Medicine) holds podiatry interleaved with general medicine — trim drops irrelevant sections."
  professions:
    # hvac/OR: CCB's Ch701 contractor endorsement is already correctly auto-matched by
    # label (kept, additive by default). Per issue #53's findings doc, BCD ALSO licenses
    # individual limited-energy HVAC-R technicians (LE-A heating/air conditioning, LE-B
    # residential HVAC) -- filed under Ch479 "Protection of Buildings From Fire;
    # Electrical Safety Law" because Oregon classifies limited-energy HVAC/R work under
    # its electrical licensing umbrella. Confirmed real (ORS 479.540/.550/.730 cited by
    # name for the HVAC/R limited-maintenance license; 479.910/.915/.945 for the
    # technician license itself) -- not the chapter's general fire-safety sections.
    # Scoped to SS479.510-945, the statute's own self-declared "Electrical Safety Law"
    # sub-part (SS479.510: "may be cited as the Electrical Safety Law"), not the whole
    # chapter (avoids repeating the KY over-broad mistake: 145 sections vs a ~40-need).
    hvac:
      url: "https://law.justia.com/codes/oregon/volume-14/chapter-479/"
      section_slug_pattern: '^section-479-(5[1-9][0-9]|[6-8][0-9][0-9]|9[0-4][0-9])(-\d+)?$'
      label: "OR ORS 479.510-945 — Electrical Safety Law (BCD limited-energy HVAC-R technician license, SS479.910/.915/.945)"

