AR:
  source: justia
  layout: subtitled
  title_url: "https://law.justia.com/codes/arkansas/title-17/"
  notes: "Title 17 splits into Subtitle 2 (Nonmedical), Subtitle 3 (Medical); profession chapters live one level deeper"
  professions:
    podiatry:
      url: "https://law.justia.com/codes/arkansas/title-17/subtitle-3/chapter-96/"
      label: "Title 17 Subtitle 3 Chapter 96 — Podiatric Medicine Practice Act"

CO:
  source: justia
  layout: subtitled
  title_url: "https://law.justia.com/codes/colorado/title-12/"
  notes: "Title 12 was reorganized in 2019; podiatry recodified from Article 32 to Article 290"
  professions:
    podiatry:
      url: "https://law.justia.com/codes/colorado/title-12/article-290/"
      label: "Title 12 Article 290 — Podiatrists"
    dietetics:
      # CO has no dietitian licensing act (HB25-1220 vetoed May 2025). The only
      # statutory provision addressing dietitians is the title-misuse clause in
      # the consumer-protection code (Title 6), so the "no state credential"
      # reading is derived from the statute, not hard-coded.
      url: "https://law.justia.com/codes/colorado/title-6/fair-trade-and-restraint-of-trade/article-1/part-7/section-6-1-707/"
      label: "CO C.R.S. §6-1-707 — dietitian title-misuse (deceptive trade practice); no licensing act"

