  layout: section_fallback
  title_url: "https://law.justia.com/codes/oklahoma/title-59/"
  notes: "Title 59 returns flat sections; each profession is a section range (e.g. CPA §§59-15.1..59-15.36, podiatry §§59-135..59-160.1)"
  professions:
    podiatry:
      section_slug_pattern: '^section-59-1(3[5-9]|[4-5][0-9]|60(-1)?)$'
      label: "OK Title 59 §§59-135..59-160.1 — Podiatry Practice Act"
    medicine:
      # Allopathic Medical and Surgical Licensure Act, 59 O.S. §§480–518.1
      # (55 sections). Label-match previously grabbed a stray §59-650.
      section_slug_pattern: '^section-59-(4[89][0-9]|5[01][0-9]|518)(-.*)?$'
      label: "OK Title 59 §§480–518.1 — Allopathic Medical & Surgical Licensure Act"
    public_accountancy:
      # Oklahoma Accountancy Act, 59 O.S. §§15.1+ (the §59-15.x range).
      section_slug_pattern: '^section-59-15-[0-9]'
      label: "OK Title 59 §§15.1+ — Oklahoma Accountancy Act"
    plumbing:
      # Oklahoma Plumbing License Law, 59 O.S. §§1000–1023. Label-match grabbed a
      # single stray section; scope to the act's section range.
      section_slug_pattern: '^section-59-10(0[0-9]|1[0-9]|2[0-3])(-.*)?$'
      label: "OK Title 59 §§1000–1023 — Oklahoma Plumbing License Law"
    electrician:
      # Oklahoma Electrical License Act, 59 O.S. §§1680–1699.
      section_slug_pattern: '^section-59-16(8[0-9]|9[0-9])(-.*)?$'
      label: "OK Title 59 §§1680–1699 — Oklahoma Electrical License Act"
    hvac:
      # Oklahoma Mechanical Licensing Act, 59 O.S. §1850.x (all §1850 sub-sections).
      section_slug_pattern: '^section-59-1850(-.*)?$'
      label: "OK Title 59 §1850.x — Oklahoma Mechanical Licensing Act"
    # emergency_medical_technician was wrongly pointed at the whole Title 63 Ch1
    # "Public Health and Safety" (hundreds of unrelated sections) -- caught by
    # narrow.py --detect-labels. Real target is the narrower Oklahoma Emergency
    # Response Systems Development Act, 63 O.S. §§1-2501..1-2512.1, a DIFFERENT
    # title than this block's default (Title 59), so it needs its own url.
    emergency_medical_technician:
      url: "https://law.justia.com/codes/oklahoma/title-63/"
      section_slug_pattern: '^section-63-1-25(0[1-9]|1[0-2])(-.*)?$'
      label: "OK Title 63 §§1-2501..1-2512.1 — Emergency Response Systems Development Act"

