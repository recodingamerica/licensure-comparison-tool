# ---- Section-flat hierarchies (Justia exposes no chapter granularity) ----

NC:
  source: justia
  layout: chapter
  title_url: "https://law.justia.com/codes/north-carolina/chapter-90/"
  notes: "Without an explicit entry, label-match grabbed Chapter 90 Article 1C (3 sections) instead of the Medical Practice Act in Article 1 (Practice of Medicine, 63 sections), leaving medicine near-empty."
  professions:
    medicine:
      url: "https://law.justia.com/codes/north-carolina/chapter-90/article-1/"
      label: "NC Ch.90 Art.1 — Practice of Medicine"
      # Article 1 IS the Medicine practice act; drop the label-matched siblings
      # (Article 1C reports, 1P compact, and the whole Chapter 90 node).
      authoritative: true

NJ:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/new-jersey/title-45/"
  notes: |
    NJ Title 45 = Professions and Occupations. Justia exposes only flat sections (no chapter-
    level nodes), so label-matching collects scattered section hits from anywhere in the title
    that happens to mention a profession. Per-profession section-number ranges keep the matcher
    honest: 45:5 = podiatry; 45:6 = dentistry; 45:9 = medicine; 45:11 = nursing; 45:12 = optometry;
    45:2B = public accountancy.
    Title 45 Ch 1 (45:1-*) is the UNIFORM ENFORCEMENT ACT — universal disciplinary grounds,
    board powers, complaint and adjudication procedure that applies to every Title-45 profession.
    NJ optometry (45:12) returned 1 ground without 45:1 because its own chapter doesn't repeat
    those grounds. Every health profession's pattern includes 45:1 as a result.
  professions:
    podiatry:
      section_slug_pattern: '^section-45-(1|5)-\d'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 5 (Chiropody and Podiatry)"
    dentistry:
      section_slug_pattern: '^section-45-(1|6)-\d'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 6 (Dentistry)"
    medicine:
      section_slug_pattern: '^section-45-(1|9)-\d'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 9 (Medicine and Surgery)"
    nursing:
      section_slug_pattern: '^section-45-(1-\d|11[a-c]?-\d)'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 11 (incl. 11A) Nursing"
    optometry:
      section_slug_pattern: '^section-45-(1-\d|12[a-c]?-\d)'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 12 (incl. 12A) Optometry"
    dietetics:
      section_slug_pattern: '^section-45-(1-\d|16b-\d)'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 16B (Dietitians/Nutritionists)"
    public_accountancy:
      section_slug_pattern: '^section-45-(1-\d|2b-\d)'
      label: "NJ Title 45 Ch 1 (Uniform Enforcement Act) + Ch 2B (Public Accountancy)"

MA:
  source: justia
  layout: section_fallback
  notes: "MA G.L. Ch 112 (REGISTRATION OF CERTAIN PROFESSIONS AND OCCUPATIONS) is an umbrella holding many regulated professions as section ranges within one chapter. The chapter label itself carries no profession name, so label-matching collects scattered section-level hits. Per-profession section ranges within Ch 112 (read from the statute's own 'Application of Secs. X to Y' signposts): §§13-23 = Podiatry; §§43-53 = Dentistry; §§66-73 = Optometry; §§74-81c = Nursing; §§87a-87e = Public Accountancy; §§1-9D = Physicians and Surgeons."
  professions:
    podiatry:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-(1[3-9][a-z]?|2[0-3][a-z]?)(-\d+-\d+)?$'
      label: "MA G.L. Ch 112 §§13-23 — Podiatry"
    dentistry:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-(4[3-9][a-z]?|5[0-3][a-z]?)(-\d+-\d+)?$'
      label: "MA G.L. Ch 112 §§43-53 — Dentistry"
    medicine:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-([1-8][a-z]?(-\d+(-\d+)?)?|9[a-d]?)$'
      label: "MA G.L. Ch 112 §§1-9D — Physicians and Surgeons"
    nursing:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-(7[4-9][a-z]?|80[a-z]?|81[a-c]?)(-\d+-\d+)?$'
      label: "MA G.L. Ch 112 §§74-81c — Nursing"
    optometry:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-(6[6-9][a-z]?|7[0-2][a-z]?|73)(-\d+-\d+)?$'
      label: "MA G.L. Ch 112 §§66-73 — Optometry"
    public_accountancy:
      url: "https://law.justia.com/codes/massachusetts/part-i/title-xvi/chapter-112/"
      section_slug_pattern: '^section-87[a-e](-\d+-\d+)?$'
      label: "MA G.L. Ch 112 §§87a-87e — Public Accountancy"

NE:
  source: justia
  layout: section_fallback
  title_url: "https://law.justia.com/codes/nebraska/chapter-38/"
  notes: |
    NE Uniform Credentialing Act (Title 38) is exposed by Justia as ~1,400 flat statute nodes
    (slug prefix `statute-`). Per-profession section ranges within Title 38 keep the matcher
    honest. The Title 38 general provisions §§38-101..38-180 (definitions, board structure,
    complaint/disciplinary procedure, sanctions) apply to EVERY credentialed profession in
    NE, so each profession's pattern also includes §§38-101..38-180. Without this, MI-style
    centralized-discipline states would return 0 disciplinary_grounds because the grounds
    live outside the profession-specific range. NOTE: Public Accountancy is OUTSIDE Title 38 —
    it lives in NE Chapter 1 (Accountants), self-contained.
  professions:
    podiatry:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|30(0[4-9]|1[0-4]))(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + §§38-3004..3014 (Podiatry)"
    medicine:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|20(0[4-9]|1\d|2\d|3[0-6])|36(0[2-9]|1\d|2[0-3]))(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + §§38-2004..2036 (Medicine and Surgery) + §§38-3602..3623 (Interstate Compact)"
    nursing:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|7(0[4-9]|1[01])|90[56]|22(1[0-9]|2\d|3[0-8])|23(0[5-9]|1\d|2[0-4]))(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + Nursing clusters (CRNA / CNS / Practice Act / NP)"
    dentistry:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|1(10[2-9]|1[1-4]\d|15[0-3])|4801)(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + §§38-1102..1153 (Dentistry) + Compact §38-4801"
    optometry:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|26(0[5-9]|1\d|20))(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + §§38-2605..2620 (Optometry)"
    dietetics:
      section_slug_pattern: '^statute-38-(1(0[1-9]|[1-7]\d|80)|180[7-9]|181\d|182[0-2]|4701)(-\d+)?$'
      label: "NE Title 38 §§38-101..180 (general provisions) + §§38-1807..1822 (Medical Nutrition Therapy) + Compact §38-4701"
    public_accountancy:
      url: "https://law.justia.com/codes/nebraska/chapter-1/"
      label: "NE Ch 1 — Accountants"

