# pipeline/config/limits.yaml
#
# SINGLE HOME for every number that decides what data is fetched, kept, or
# shown to an LLM.  Changing a value here changes behavior everywhere it is
# wired.  Caps that DROP data must also record a marker in their artifact
# (see the silent-caps audit in tests/test_silent_caps_audit.py).

trim:
  # pipeline/ingest/trim_state.py — SECTION_TEXT_CAP
  # Truncates each section's text before feeding to the LLM trim classifier.
  # Sections over this limit are kept unconditionally (see rule A1 in trim_state).
  section_text_cap: 6000

pull:
  # pipeline/ingest/pull_text.py — collect_section_targets max_depth default
  # Maximum recursion depth when walking a chapter page down to leaf sections.
  # Old value was 2; raised to 6 so chapters nested deeper than 2 levels
  # (chapter→subchapter→sub-subchapter→sections) are fully collected instead of
  # silently truncated.  The walk still terminates naturally when a level yields
  # leaf sections or nothing.  A depth_capped error is recorded when the cap bites.
  section_walk_max_depth: 6

  # pipeline/ingest/pull_text.py — --limit-sections CLI default
  # Per-state section cap (runaway guard).  A whole-title over-match (a profession
  # mapped to a 2500-section state-government title) is capped + flagged instead of
  # silently pulling thousands of sections.  Pass 0 to disable.
  # Real profession chapters rarely exceed 500.
  default_limit_sections: 500

expand_containers:
  # pipeline/discover/expand_containers.py — --max-depth CLI default
  # How deep expand_containers recurses: 1 = chapters→parts only;
  # 2 (default) = also expand generic grouping parts to sections.
  max_depth: 2

audit_corpus:
  # pipeline/discover/audit_corpus.py — MAX_CHARS
  # Character budget for the per-state corpus audit snapshot shown to the operator.
  sample_max_chars: 30000

gen_semantics:
  # pipeline/analyze/gen_semantics.py — inline cap of 12 (no named constant)
  # Maximum distinct field values sent to the LLM for semantic-label generation.
  # Tail values beyond this limit are dropped (logged as WARNING; not data loss
  # for the final output, only for label-generation input quality).
  max_values: 12

discover_schema:
  # pipeline/extract/discover_schema.py — --max-states CLI default
  # Maximum number of states whose corpora are sampled when discovering the
  # extraction schema.  Extra states are excluded (logged).
  max_states: 10

scope_rules:
  # pipeline/scope/suggest_scope_rules.py — MAX_TEXT_PER_SECTION
  # Characters of each section's text sent to the LLM scope-rules proposer.
  max_text_per_section: 2000

  # pipeline/scope/suggest_scope_rules.py — MAX_TEXT_PER_UNDET
  # Characters of each undetermined section's text sent in the refinement pass.
  max_text_per_undetermined: 500

  # pipeline/scope/suggest_scope_rules.py — MAX_UNDET_IN_REFINEMENT
  # Maximum undetermined sections included in the refinement message.
  # Sections beyond this limit are skipped (recorded in the result artifact).
  max_undetermined_in_refinement: 10

umbrella:
  # pipeline/ingest/pull_umbrella_text.py — the > 100 LARGE-chapter warning
  # When a chapter walk returns more than this many section targets, a WARNING
  # is emitted so the operator can judge whether the chapter is genuine umbrella
  # law before committing to a long pull.  Not a cap — all sections are pulled.
  large_chapter_warn_threshold: 100

umbrella_from_citations:
  # pipeline/discover/umbrella_from_citations.py — --min-refs CLI default
  # A chapter must be cited at least this many times across corpora to be
  # considered a candidate umbrella chapter.
  min_refs: 5

  # pipeline/discover/umbrella_from_citations.py — --min-profs CLI default
  # A chapter must be cited by at least this many distinct professions to pass
  # the two-factor umbrella filter (cited AND umbrella-labeled).
  min_profs: 3

fetch:
  # Seconds to pause between section fetches against Justia (one host), plus up
  # to 60% random jitter. This is a BLOCK-RISK knob, not just mechanics: too low
  # and Cloudflare rate-blocks the fetch session mid-run. Env PULL_HOST_DELAY
  # overrides this. Governs pull_text.py AND pull_umbrella_text.py (both route
  # through polite_sleep). _fetch_config.PER_HOST_DELAY default also reads this.
  per_host_delay_seconds: 1.0

  # pipeline/ingest/pull_text.py — TIMEOUT: per-request wall-clock (seconds) for a
  # single curl_cffi fetch (the PA static endpoint; Justia goes through Scrapling,
  # which carries its own internal timeout). Too low and a slow PA page reads as a
  # fetch error.
  request_timeout_seconds: 25

refresh:
  # pipeline/ingest/refresh_corpus.py — the annual re-pull loop's tuning knobs.
  # Each is the DEFAULT; the matching CLI flag still overrides per-run.

  # --item-timeout: per-item wall-clock (seconds). A pull that exceeds this is a
  # genuine hang and aborts the run (--until-done then relaunches, skipping it).
  # Raised from the old annual-run 900 so the largest legit corpora (medicine,
  # mental_health_counseling, osteopathic_medicine) finish instead of false-
  # TIMEOUTing every year; a true hang just costs more before the abort.
  item_timeout_seconds: 1800

  # --breaker: consecutive genuine fetch-failures (empty/dead) that mean the
  # fetcher is wedged → abort the run. NOCHANGE / held cells do NOT count.
  breaker_consecutive_failures: 6

  # --max-passes: with --until-done, the max relaunch passes before giving up
  # (a no-progress pass also stops it earlier).
  until_done_max_passes: 120

  # refresh_item re-pulls a DEFICIENT (fetch-error / empty / short) result this
  # many EXTRA times before believing the shortfall is real and letting the
  # content-aware regression gate judge it. Absorbs transient Cloudflare flakiness.
  pull_retries: 2

  # --until-done only: a pass can abort on the startup Justia liveness check (a
  # transient network/Cloudflare blip — it attempts nothing). Retry that many
  # consecutive times, sleeping between, before giving up — so one hiccup doesn't
  # end an unattended multi-day crawl. (A pass that DID work but settled nothing
  # still stops via the separate no-progress guard.)
  startup_retry_limit: 10
  startup_retry_seconds: 60

# ---------------------------------------------------------------------------
# Intentionally NOT here (pure mechanics, don't shape data):
#   LLM retry counts (MAX_RETRIES in trim_state.py, fetch retry in _fetch.py)
#   chunk/batch sizes (LLM batch page sizes in _batch.py, _llm.py)
#   pagination limits (hierarchy page walk in build_hierarchy.py)
#   LLM output token budgets (MAX_TOKENS in suggest_scope_rules.py, gen_semantics.py)
#   display-only estimates (_estimate_seconds / _fmt_eta coefficients in refresh_corpus.py)
# These are operational/mechanical constants that don't determine what data
# survives or is seen by an LLM; they live at their respective call sites.
# (The refresh loop's timeout/breaker/retry knobs ARE here — under `refresh:` —
# because a timeout or breaker abort decides whether a cell's data lands at all.)
# ---------------------------------------------------------------------------
