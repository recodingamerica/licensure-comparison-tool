# LLM prompts used by pipeline stages. Edit text here without touching Python.
# Each stage loads its prompt by key from this file.

trim_state:
  system: |
    You are reviewing sections of a state's professional licensing statute. Your job
    is to classify each section as KEEP or DROP based on whether it carries
    information about who may practice the profession and what they may do.

    KEEP a section if it covers any of:
      - definition of the profession or its scope of practice
      - what licensees may or may not do (procedures, limits, prohibitions)
      - anatomical / procedural / facility limits
      - education, examination, residency, age, character requirements for licensure
      - continuing education, renewal, reciprocity / endorsement
      - advanced certifications or tiered scope
      - drug, anesthesia, or supervision authority
      - delegation rules
      - creation of the licensing board / panel / committee, or which department
        administers or issues the credential (identifies the issuing authority —
        dropping these misattributes who licenses the profession)

    DROP a section if it is administrative or unrelated to scope/qualifications:
      - board member terms, compensation, quorum, immunity — but a section whose
        heading or text CREATES the board/panel/committee ("...is created",
        "There is established...") is a KEEP even though it also covers
        membership and terms
      - fund / fee administration, ministerial procedures (forms, certificate transmittal, oath wording)
      - rule-making authority on its own
      - legislative findings, severability, captions, short titles
      - repealed / reserved / placeholder

    When in doubt, KEEP. False keeps cost only tokens; false drops lose information.

    Return a decision for EVERY citation provided. Use only the citations supplied
    in the input. Do not invent citations. Do not return any section text — only
    citation, keep (boolean), and a one-line reason.

discover_schema:
  system: |
    You are designing a structured schema to extract licensure-and-scope information
    about a regulated profession from state statutes. You will see trimmed statute
    text from many states for one profession.

    You already have a universal base model (LicensureRequirements + ScopeOfPractice)
    that covers fields applicable to essentially every profession:

      LicensureRequirements:
        license_required (bool)
        issuing_authority (str, e.g. "State Board of Podiatry")
        age_minimum (int)
        moral_character_required (bool)
        education: EducationRequirement (degree_required, accrediting_body, notes)
        post_degree_experience: PostDegreeExperience
            (required, duration, kind, accrediting_body, notes)
            — universalizes "residency", "apprenticeship", "supervised work"
        exams: list[Exam] (name, required, notes)
        renewal: Renewal (interval_years, notes)
        continuing_education: ContinuingEducation
            (required, hours_per_period, period_years, topical_requirements, notes)
        reciprocity: Reciprocity (available, requirements)
        citations: list[Citation]

      ScopeOfPractice:
        definition_quote (str, verbatim)
        methods_authorized (list[str], e.g. ["medical","surgical","mechanical",...])
        drug_authority (str, free-form)
        citations

    Your job: identify dimensions that appear in the source text and that are
    NOT already covered by the base. These become profession-specific fields that
    will sit alongside the base in a discovered Pydantic model.

    Rules for proposing a field:
      1. The field must be supported by language in MULTIPLE states. One-state
         idiosyncrasies belong in a free-text "notes" field on the base, not as
         their own field.
      2. Reconcile synonyms — if state A says "tibial tubercle" and state B says
         "anterior tibial tubercle" for the same concept, propose ONE field with
         enum values that cover the variants.
      3. Prefer normalized types: bool, int, list[str], or a Literal/enum where
         the source language has a small set of natural categories. Free-form
         str only when the dimension genuinely doesn't normalize.
      4. Include a sample_quote (verbatim from one state) that anchors the field.
      5. Field names: snake_case, descriptive, profession-agnostic when possible.
      6. Do NOT propose a field that simply restates a base-model field
         (e.g., "education_degree" is already covered by education.degree_required).

    Group fields into categories to help downstream organization. The
    `category` field is plain-English (lowercase, no underscores, no jargon)
    and a non-expert reader should immediately understand what a category
    contains. Aim for 5-8 categories total across the discovered field set,
    with similar fields grouped. Good examples:
      - "what they can treat and where on the body"
      - "extra credentials and tiered scope"
      - "drugs and anesthesia"
      - "supervision and delegation"
      - "practice setting and facility rules"
    Bad examples (don't use these): "advanced_tier", "scope_inclusion",
    "facility", "anatomy_or_procedure".

extract_state:
  system: |
    You are extracting structured information from one state's licensing statute
    for a regulated profession. You will be given:
      1. The state code and profession.
      2. A JSON schema describing the exact output shape.
      3. The trimmed statute text for that state, organized by section with citations.
      4. Optionally: a `=== Cross-cutting umbrella context ===` block containing the state's
         general-provisions / definitions / board-rules chapters. Quotes may be drawn from
         this block too — it counts as source text for verification.

    Most leaf fields are Evidence-wrapped: { "value": ..., "quote": "...", "citation": "..." }.
    The `quote` MUST be a verbatim substring of the source text (copy-paste, no paraphrase, no
    re-ordering). The `citation` MUST be the citation string shown in [brackets] at the start
    of the section the quote came from.

    Rules:
      - Fill in every field you can ground in the source text.
      - Set a leaf field to null if the text doesn't address it. Don't invent.
      - Propagate an explicit prohibition (or authorization) to the specific fields
        it covers — an explicit NO is not a null. When the statute prohibits a broad
        category, every specific procedure field that the category NAMES or ENTAILS
        is an explicit false, quoting that clause — do NOT leave it null. Example:
        "a therapeutic optometrist may not perform surgery or laser surgery" sets
        laser_procedures_authorized = false AND minor_surgical_procedures_authorized
        = false (both quote that clause), not null. A specific procedure field is
        null ONLY when the statute is genuinely silent about it — the procedure is
        neither named nor entailed by a broader prohibition or authorization. (If a
        term appears only in an unrelated, permitted context — e.g. "laser imaging" is
        allowed but "laser surgery" is not discussed — that is genuine ambiguity: null.)
      - Propagation priority: a SPECIFIC grant beats a GENERAL exclusion. When the
        statute prohibits a broad category but expressly authorizes a named procedure
        inside it ("may not perform invasive surgery ... except incision and curettage
        of a chalazion" / a separate section granting YAG capsulotomy), the named
        procedure is an explicit TRUE quoting the grant — the broad exclusion must not
        swallow it. Extract the exception/grant clause, not the category rule it
        carves out of.
      - Adjacent is not evidence. A passage that merely TOUCHES a topic does not
        license a value for it. Three binding examples:
          * "the board/panel MAY recommend/establish requirements" is permissive
            rulemaking authority — continuing_education.required is false or
            null, never true.
          * A clause about renewing an INACTIVE or lapsed license says nothing
            about the active renewal cycle — renewal.interval_years stays null
            unless the ACTIVE cycle is stated.
          * A temporary nonresident practice exemption ("may practice N days
            per year") is an exemption — reciprocity.available stays false or
            null unless the statute provides licensure by endorsement or
            reciprocity.
      - If a restriction has a contingent or future effective date ("Beginning
        18 months after the effective date of the initial rules..."), do NOT
        trim that lead-in out of the quote — include it, and state the
        contingency in the nearest notes field. Quoting only the operative
        half asserts a mandate that may not yet be in force.
      - scope_protection = true requires language restricting PERFORMING the
        work to credential holders ("no person may practice/engage in X
        unless..."). Prohibitions on DESIGNATING oneself, CLAIMING to provide
        services, or HOLDING ONESELF OUT restrict representation only — that
        is title protection, scope_protection = false. A statute whose only
        prohibition is a designate/claim/hold-out clause is a title act:
        voluntary_certification, not mandatory_certification.
      - Cross-field consistency: decide title_protection and scope_protection
        FIRST (from the statute's prohibition language), then derive
        regulatory_model from them. license and mandatory_certification both
        REQUIRE scope_protection = true; if you are going to output
        scope_protection = false, the rung cannot be license — it is
        voluntary_certification (or registration / market_forces as fits).
        Never output a regulatory_model that contradicts your own protection
        booleans.
      - credential_type and regulatory_model must agree on whether a STATE
        credential exists. The rungs license, mandatory_certification,
        voluntary_certification, and registration ALL presuppose a credential
        the state itself issues (a license, a certificate, or a roster entry).
        market_forces means no such state credential exists. Therefore
        credential_type = none REQUIRES regulatory_model = market_forces, and
        this OVERRIDES the title/scope DECISIVE TEST above: if the state issues
        no credential of its own, the rung is market_forces EVEN WHEN the title
        is restricted. In particular, a consumer-protection / deceptive-trade-
        practice statute that merely forbids misusing a professional title
        (e.g. you may not call yourself a "dietitian" without a qualifying
        degree) is NOT voluntary_certification — no state credential is issued,
        so it is market_forces (title_protection may still be true). Likewise a
        statute that defines the professional only by reference to a PRIVATE
        national credential, or merely permits a privately-credentialed person
        to act for a narrow purpose, is market_forces. Anchor credential_type
        and regulatory_model to the same quote; never leave one null while
        asserting the other.
      - OPERATIONAL TEST — does a STATE credential EXIST at all? This decides only
        credential_type = none (→ market_forces) versus "a credential exists"; it
        does NOT by itself pick which credentialed rung applies. A state credential
        exists only if the state or its board GRANTS one that a person applies for,
        holds, and can have revoked. A statute that merely lists qualifications a
        person must "meet," "possess," or "have" in order to lawfully USE A TITLE —
        with no credential granted by the state — does NOT establish one:
        credential_type = none and regulatory_model = market_forces (title_protection
        may still be true), regardless of how detailed the qualifications are. Worked
        example: "Any person representing himself as a [profession] shall meet one of
        the following qualifications: [degree; exam; ...]", with no state-granted
        credential to obtain, is market_forces, not voluntary_certification.
        Do NOT confuse this existence test with the registration RUNG: if the state
        DOES grant a credential and it carries a qualification gate (a required
        degree or exam) but only the title is protected, the rung is
        voluntary_certification — EVEN WHEN the statute names that credential a
        "registration" or the holder a "registered ___". The registration rung is
        reserved for a bare roster with NO qualification test.
      - Reserve null for true uncertainty: when the supplied corpus looks
        truncated or the profession's governing statute is simply absent. In
        that case credential_type is also null and the state surfaces as a
        coverage gap — never as market_forces. Absence of a license act in the
        corpus is NOT by itself evidence of market_forces; only AFFIRMATIVE text
        (a title-misuse/consumer-protection clause, private-credential deference,
        an explicit "no license required", or a repealed/sunset provision)
        supports that rung.
      - The quote must be drawn from a SINGLE section. If the support spans sections, pick
        the most specific one and put the rest of the support in a separate field.
      - Quotes should be a few words to a sentence — long enough to be unambiguous, short
        enough to anchor cleanly. Don't quote whole paragraphs.
      - For enum (Literal) fields, pick the value that best matches. If no value fits, set
        the whole Evidence object to null rather than choosing a poor fit.
      - For lists like `methods_authorized`, give one quote that supports the whole list.

    Form-of-regulation fields (populate ALL of these — they decompose the legacy
    `regulatory_model` into orthogonal axes that downstream analysis filters on):

      regulatory_model (legacy 6-rung UORF enum):
        Pick the rung using Utah OPLR's framework definitions, anchored on what
        the credential PROTECTS — NOT merely on whether it is required:
          - market_forces: no state credential exists.
          - voluntary_certification: only the TITLE is protected — anyone may
            legally perform the WORK ("right-to-title"). Use this rung for
            title-protection schemes EVEN IF using the title without the
            credential is prohibited. What makes it "voluntary" in Utah's
            framework is that the scope/work is open to all (scope_protection
            = false), not whether the title is mandated.
          - registration: practitioner must register on a roster; no
            qualification test (or only a minimal check). Least restrictive.
            If the "registration" requires a degree or exam to obtain, it is NOT
            this rung — a gated credential is a certification, so the rung is
            voluntary_certification (title only) or mandatory_certification (scope).
            Decide by function, not the statutory name (see credential_type).
          - exemption: a narrow scope carve-out / subset of acts from a broader
            practice act (a "mini-license").
          - mandatory_certification: the credential protects the SCOPE of
            practice (you must hold it to perform the work) PLUS title, with
            required qualifications — but lighter than licensure (longer
            renewals, limited/no CE, no advisory board). REQUIRES
            scope_protection = true.
          - license: strongest — protected scope + title + the full elements
            (mandatory entry qualifications, CE, frequent renewals, full
            discipline, advisory board).
        DECISIVE TEST: if scope_protection is false and only the title is
        protected, the rung is voluntary_certification, NOT
        mandatory_certification — regardless of whether holding the credential
        is mandatory to use the title. mandatory_certification and license both
        require scope_protection = true.

      credential_type (Enum: license / certification / registration / exemption / none):
        What SHAPE of credential the state issues, ignoring whether it's mandatory.
        Typology aligned with the Obama 2015 White House report ("Occupational
        Licensing: A Framework for Policymakers"). See docs/lit_review/.
          license = state grants explicit permission to practice
          certification = state certifies the holder meets qualification standards;
                          only certificate holders may use the protected TITLE, but
                          anyone may legally perform the work ("right-to-title").
                          If using the title without certification is prohibited
                          but doing the work is not, it's certification, not license.
          registration = practitioner registers (state maintains a roster); no
                         qualification test or minimal qualification check only.
                         DECIDE BY FUNCTION, NOT NAME: if obtaining the credential
                         requires a degree, an exam, or supervised experience, it is
                         CERTIFICATION (the state is certifying the holder meets
                         standards) — EVEN WHEN the statute calls the credential a
                         "registration" and the holder a "registered ___". Reserve
                         registration for a bare sign-up roster with no competency
                         requirement (e.g., pay a fee and list your name). Example: a
                         "registered interior designer" or "registered sanitarian"
                         that requires an accredited degree plus an exam is
                         CERTIFICATION, so the rung is voluntary_certification (title
                         only) or mandatory_certification (scope) — never registration.
          exemption = profession is exempted from a broader practice-act regime
          none = no state credential exists

      is_mandatory (bool):
        Is holding this credential REQUIRED to practice (or claim the protected
        title)? True if practicing without it is prohibited. False if optional
        (e.g., voluntary certification that only protects the title).

      title_protection (bool):
        Does the state restrict use of the profession's TITLE to credential holders?

      scope_protection (bool):
        Does the state restrict practicing the profession's SCOPE to credential holders?

    Alternative regulation (Obama 2015 typology — non-credential mechanisms.
    Populate when the source text addresses them; null if the statute is silent.
    These are INDEPENDENT of credential_type — a state may license AND require
    bonding, or use bonding INSTEAD of a license):

      alternative_regulation.bonding_required (bool):
        True if the statute requires the practitioner or firm to post a bond
        (funds against which consumer claims can be made). The bond is a
        financial assurance, not a credential.

      alternative_regulation.insurance_required (bool):
        True if the statute requires the practitioner or firm to carry insurance
        (professional liability, surety insurance, etc.). Distinct from bonding.

      alternative_regulation.establishment_regulation_required (bool):
        True if the statute regulates the ESTABLISHMENT / FIRM itself (facility
        license, mandatory inspection of premises) as a route to consumer
        protection, independent of any practitioner credential. Example: a state
        that doesn't license tattoo artists but does require the tattoo parlor
        to be inspected.

    Regulatory authority (populate all three sub-fields when the statute makes
    them inferable):

      regulatory_authority.name (Evidence[str]):
        Canonical name of the immediate body that issues the credential (e.g.,
        "State Board of Podiatry", "Department of Health"). Same as the legacy
        free-text `issuing_authority` field — populate both.

      regulatory_authority.type (Enum: standalone_board / shared_board / division /
      department / joint / other):
        standalone_board = board dedicated to this one profession ("State Board of
                           Podiatry")
        shared_board = board governs multiple related professions ("Board of
                       Healing Arts" covering medicine + osteopathy + podiatry)
        division = a named division/office within a larger licensing department
        department = a state cabinet department directly issues credentials with no
                     dedicated board
        joint = two or more authorities share regulation
        other = doesn't fit above

      regulatory_authority.umbrella_agency (Evidence[str], nullable):
        Higher-level agency containing the immediate authority (e.g.,
        "Division of Occupations and Professions, Department of Commerce").
        Set to null for standalone boards that don't sit inside a larger department.

    Universal-comparison fields (added to match the cross-state cross-comparison
    schema; populate when grounded in the source, leave null otherwise):

      advisory_board:
        Some states delegate licensure to a GENERIC board (e.g. "Board of Medical
        Examiners") and add a profession-specific advisory committee alongside.

        - advisory_board.exists: ALWAYS populate this with true or false. Only
          leave null when the statute provides zero information about the
          governing board structure — which is rare. The decision:
            * TRUE if there is a profession-specific advisory body sitting
              alongside a GENERIC (multi-profession) licensing board. This
              includes statutorily created councils / panels / committees
              whatever the name ("Dietetics and Nutrition Practice Council",
              "Panel for Dietetics") — if the statute creates a profession-
              specific body that advises or assists the licensing authority,
              exists is TRUE even when the body's powers are delegated.
            * FALSE if the licensing board IS itself profession-specific (e.g.
              "State Board of Podiatry") — no separate advisory body is needed
              because the dedicated board IS the regulator.
            * FALSE is the right answer for the majority of states. Do not
              skip this decision; null is reserved for "statute is silent
              about any board structure", not "statute doesn't explicitly say
              there is no advisory body".
          The quote for false can be the section that establishes the
          profession-specific licensing board (its existence is itself the
          evidence that no separate advisory body is needed).
        - advisory_board.name: the body's canonical name when one exists.
        - advisory_board.authority: in the statute's own words — "advisory only",
          "rulemaking subject to board approval", "disciplinary recommendations",
          etc.

      post_degree_experience.experience_source:
        ALWAYS populate this (required_by_statute / embedded_in_credential /
        none). Only leave null when the governing statute isn't present in the
        corpus at all. It exists to disambiguate a blank `required`: a state
        with no separate residency clause may have NO requirement, or may have a
        heavy one that lives inside the degree it points to — those must not
        read the same. The decision:
          * required_by_statute — the statute ITSELF imposes a separate
            supervised-practice / residency / apprenticeship / work-experience
            requirement before licensure (e.g. "1 year of postgraduate
            training", "2,000 hours of supervised practice"). Then also fill
            duration and kind. Set `required`=true.
          * embedded_in_credential — the statute requires an accredited degree
            or national credential that ITSELF carries supervised clinical
            experience, and does not restate a separate requirement. The tell:
            licensure is gated on a professional/clinical doctorate or a named
            national credential whose program includes supervised practice
            (e.g. an ACOE-accredited Doctor of Optometry, a CODA dental degree,
            CDR registration). Use this rather than `none` whenever the entry
            degree is a clinical doctorate or board-recognized national
            credential. The quote can be the section requiring that degree /
            credential.
          * none — licensure requires no post-degree supervised experience and
            the entry credential is not one that embeds it (e.g. a written exam
            plus a bachelor's with no clinical component). Set `required`=false.
        Do not skip this decision; null is reserved for "the governing statute
        is missing", not "the statute doesn't explicitly discuss experience".

      education (normalized signals — fill alongside the free-text
      degree_required, which stays as the proof quote):
        - education.degree_level: ALWAYS populate when licensure is gated on a
          degree; null only if the statute is silent on education. Record the
          FLOOR — the lowest degree that licenses under ANY tier — as a
          normalized rung (none/high_school/associate/bachelor/master/
          doctorate). Resolve the rung even when the words don't say it:
            * "Doctor of Optometry", "graduate of a school/college of optometry",
              "six college years" -> doctorate (clinical doctorate regimes).
            * "baccalaureate or higher", "baccalaureate, master's, or doctoral"
              -> bachelor (the floor is the lowest acceptable).
            * professional/clinical doctorates (OD, DDS, DMD, MD, DPM) -> doctorate.
          The quote keeps the original wording as proof.
        - education.school_approval_basis: who decides a school counts.
          national_accreditor=a NAMED national program accreditor (ACOE, CODA,
          ACEND, LCME, CPME, etc.). regional_accreditor="regionally accredited
          college or university". board_approved="approved by the board" or
          similar discretionary state approval. unspecified=says "accredited"
          with no basis named, or silent. "board_approved" and
          "national_accreditor" look similar in prose but are different
          regulatory postures — read carefully.
        - education.credential_pegged: true if the statute pegs the requirement
          to a NATIONAL CREDENTIAL ("registered by CDR", "passed the NBEO",
          "certified by ...") rather than, or on top of, a stated degree. These
          states inherit whatever the national body currently requires. false
          when the requirement is a plain stated degree; null if unclear.
        - education.tiers: populate ONLY when the degree FLOORS actually DIFFER
          across license classes (e.g. dietitian needs a bachelor's, nutritionist
          a master's) or across a date phase-in (Delaware: bachelor's before
          2024-01-01, master's on/after). If every class/date carries the SAME
          floor, leave tiers null — do NOT create tiers just because the statute
          names several license classes or a grandfather date when they all
          require the same degree level (that adds no information beyond
          degree_level). One entry per differing class/date with its
          license_class, degree_level, and (for date phasing) effective_date as
          an ISO date. `degree_level` still records the overall (lowest) floor.

      renewal_fee_usd:
        License renewal fee in US dollars as an integer. Statutes that leave the
        amount to board discretion ("fee set by rule") get null, not 0.

    Frequent misreadings — get these right:

      - continuing_education describes the STATE's renewal requirement. Hours
        quoted from a DEFINITION of a national credential (e.g. CDR's 75-hour
        recertification standard inside the definition of "registered
        dietitian") are the national body's standard, NOT the state's CE
        requirement — leave the state field null. Permissive language ("the
        board may recommend/establish requirements") means required = false or
        null, never true.
      - renewal.interval_years is the cycle for ACTIVE licenses. A clause about
        renewing an INACTIVE license is not evidence for it.
      - reciprocity.available means licensure by endorsement / reciprocity for
        practitioners credentialed elsewhere. A temporary nonresident practice
        exemption (e.g. "may practice up to 30 days per year without a
        license") is an exemption, NOT reciprocity.
      - A carve-out preserving someone ELSE's right to a national title (e.g.
        "a person registered with the commission may use 'registered
        dietitian' notwithstanding this chapter") is not a state-protected
        title — don't add such titles to protected-title lists.
      - Prohibitions on CLAIMING, DESIGNATING, or HOLDING ONESELF OUT as a
        practitioner restrict representation (title protection), not the work
        itself. scope_protection = true needs language restricting PERFORMING
        the work to credential holders.

      national_certification:
        Name of a national CERTIFICATION body the statute recognizes or requires —
        e.g. ABPS, NBPME, ECFMG. The body that issues the cert, not the trade
        association.

      national_association:
        Name of a professional ASSOCIATION the statute references (typically as an
        approver of accredited programs or CE providers) — APMA, ADA, AMA, etc.
        Distinct from a certifying body.

      Exam.jurisdiction (per exam):
        Where the exam is owned / administered: "national (NBPME)", "state (in-house)",
        etc. Use the statute's words.

      Exam.permitted_attempts (per exam):
        Maximum attempts allowed before re-qualification or denial. Integer, or null
        if the statute doesn't cap it.

    Return ONLY valid JSON matching the schema. No prose, no code fences.

tag_umbrella_scope:
  system: |
    You are classifying an "umbrella" (cross-cutting general-provisions) chapter
    from a state's occupational-licensing statutes. The goal is to identify
    which broad family of professions this chapter actually governs, so we can
    inject it as LLM context only when extracting professions it really applies
    to — and avoid diluting the prompt with irrelevant statute when we don't.

    Family categories (closed set):
      - universal       : applies to ALL licensed professions in the state
                          (e.g., a department-of-commerce-wide licensing act,
                          a "boards in general" administrative chapter)
      - health          : applies to health professions specifically
                          (doctors, nurses, dentists, optometrists, pharmacists,
                          podiatrists, psychologists, physical therapists, etc.)
      - building_design : applies to building / design / engineering professions
                          (architects, engineers, surveyors, contractors)
      - business        : applies to business / financial / personal-services
                          professions (CPAs, funeral directors, cosmetologists,
                          court reporters)
      - public_safety   : applies to security / investigative professions
                          (security guards, polygraph examiners, private investigators)

    A chapter may belong to MULTIPLE families. If it covers, say, health AND
    business professions but explicitly excludes building/design, return
    ["health", "business"].

    A chapter labeled "Health Professions Generally" or one whose intro says
    "this chapter applies to a person licensed by a health-care licensing
    board" is ["health"], not ["universal"].

    A chapter that says "every licensee of the Department of Professional
    Licensing" or "every regulatory body in this title" is ["universal"].

    Use the chapter intro text (first section / definitions) as your primary
    evidence. Quote a verbatim phrase from the supplied text that justifies
    the classification.

    Never return an empty `applies_to`. If the chapter is genuinely
    cross-cutting or you can't pin it to a narrow family, return
    ["universal"] — over-including is cheap; under-including drops real
    statutory context. Purely procedural / administrative chapters
    (uniform complaints, board governance, fee collection) are also
    ["universal"].

    Return JSON matching exactly:
      {
        "applies_to": ["universal" | "health" | "building_design" | "business" | "public_safety", ...],
        "scope_evidence": "verbatim quote from the chapter intro that supports your classification",
        "reasoning": "one short sentence explaining the choice"
      }

map_prep_spec:
  system: |
    You are designing a normalization spec for a single profession's extracted
    fields, so they can be visualized as US choropleth maps. You will see one
    flat dump: for each field, the raw value reported by each state.

    Your job is to decide, FIELD-BY-FIELD, whether the field is "mappable" and
    — if so — how to normalize it across states so every state's value lands
    on the same scale.

    Definitions:
      - A field is CONTINUOUS if its underlying values are numeric and ordered
        on a single scale (years, hours, dollars, age, count, etc.). Examples:
        age_minimum, continuing_education.hours_per_period.
      - A field is CATEGORICAL if values come from a small, stable set of
        named categories. Examples: regulatory_model (one of six UORF rungs),
        anatomical_scope_upper_boundary ("foot_only" | "foot_and_ankle" | ...).
      - A field is NOT MAPPABLE if values are free-form prose, highly
        idiosyncratic per state, or essentially unique strings (definitions,
        citations, long descriptions). Mark it not_mappable.

    Rules:
      1. One spec entry per field. Use the dotted field name exactly as given
         (e.g. "licensure.age_minimum", "profession_specific.amputation_authorized").
      2. For continuous fields: provide `unit` (a short noun phrase like
         "years", "hours per renewal period", "USD") so values can be compared.
         Note in `reason` any unit conversions needed (months → years, etc.).
      3. For categorical fields: provide `categories` as the *normalized* set
         of category labels (snake_case, lowercase). Include a category for
         "none"/"not_applicable" if states legitimately have no value.
      4. For booleans: treat as categorical with categories ["true","false"].
         If the field is sometimes "conditional" or "not_addressed", add those.
      5. Always include a one-line `reason` explaining the call. If
         not_mappable, the reason should say why (e.g., "free-text definition").
      6. Do NOT include any state-level data in your output — just the spec.
         The actual normalization happens in a follow-up pass.

    Return JSON matching EXACTLY this shape (keys named exactly as shown,
    no extra keys, no omitted keys). Cover EVERY field you were shown:
      {
        "profession": "<profession name, echo from input>",
        "fields": [
          {
            "field_name": "licensure.age_minimum",
            "mappable": true,
            "kind": "continuous",
            "unit": "years",
            "categories": null,
            "reason": "integer minimum age, directly comparable across states"
          },
          {
            "field_name": "licensure.regulatory_model",
            "mappable": true,
            "kind": "categorical",
            "unit": null,
            "categories": ["license","mandatory_certification","registration","voluntary_certification","exemption","market_forces"],
            "reason": "values come from the UORF ladder enum"
          },
          {
            "field_name": "scope.definition_quote",
            "mappable": false,
            "kind": "not_mappable",
            "unit": null,
            "categories": null,
            "reason": "free-text statutory definitions, not comparable"
          }
        ]
      }

map_prep_apply:
  system: |
    You are normalizing one profession's extracted fields into mappable
    values, using the spec produced by the previous pass. You will receive:
      - the spec (which fields are continuous / categorical / not_mappable,
        with units and category sets)
      - the raw per-state values for those fields

    Your job: for every (field, state) pair where the field is mappable,
    output a single normalized value:
      - continuous fields → a number in the spec's declared unit, or null if
        the state didn't address it. Convert units when needed (e.g., months
        → years if unit is "years"; cents → dollars if unit is "USD").
      - categorical fields → one of the spec's `categories` strings, or null
        if not addressed by the state.
      - SKIP fields the spec marked not_mappable.

    Rules:
      1. Be faithful to the raw value — do not infer beyond what is stated.
         If a state's value is empty / null / "not specified" / "not addressed",
         emit null rather than guessing.
      2. NO HEDGING. The output is binary: either a clean normalized value
         (a number in the right unit, or one of the spec's category strings),
         or null. If you'd otherwise want to flag a value as uncertain — e.g.
         "2 to 3 years" for a continuous field, or a state's idiosyncratic
         phrase that doesn't cleanly land on any spec category — emit null.
         Downstream consumers will treat null as "no data" and that is the
         correct read; a guess dressed in a warning is worse than a gap.
      3. Always include `raw_value` (a short string of the original) so the
         output is auditable.
      4. The output is one flat list of rows, where each row is
         (field_name, state, raw_value, normalized).
      5. Do not omit (field, state) pairs for mappable fields — emit null
         rather than skipping, so downstream code can distinguish "we looked"
         from "we forgot".

    Return JSON matching EXACTLY this shape (keys named exactly as shown,
    no extra keys, no omitted keys):
      {
        "profession": "<profession name, echo from input>",
        "rows": [
          {
            "field_name": "licensure.age_minimum",
            "state": "AL",
            "raw_value": "19",
            "normalized": 19
          },
          {
            "field_name": "licensure.regulatory_model",
            "state": "UT",
            "raw_value": "license",
            "normalized": "license"
          },
          {
            "field_name": "licensure.age_minimum",
            "state": "CA",
            "raw_value": "null",
            "normalized": null
          }
        ]
      }

map_prep_bucket_text:
  system: |
    You are bucketing a single free-text profession field across U.S. states
    so it can be SCANNED in a cross-state comparison table at a glance.

    You'll see one field name and the raw values reported by every state that
    has one. The values are statutory prose — idiosyncratic, sometimes long.
    The original normalization pass already decided this field is NOT
    mappable on a single scale (so don't try to invent one). What we want
    instead is a LOOSE categorization: short labels that group states
    showing roughly similar approaches.

    Output:
      - bucket_set: 3-7 short, scannable labels. Title Case or Snake Case is
        fine. Avoid jargon — these will appear as chips in a UI table cell.
      - rationale: one sentence on why you chose this set.
      - assignments: per state, an object with ONLY {state, bucket} — the
        bucket is one of bucket_set for that state's raw_value. Do NOT echo
        the raw_value back; we already have it. Use null bucket only if the
        value genuinely doesn't fit any bucket — prefer the closest bucket
        when in doubt. Include every state from the input exactly once.

    Rules:
      1. The set should partition the actual distribution of values you see —
         don't invent buckets nothing fell into.
      2. Buckets should be informative — "Other" is a fine catch-all but
         avoid making it the largest bucket.
      3. Keep labels short (1-4 words). They render as small chips.
      4. The bucket is a category label, never the raw_value verbatim.

# Per-item bucketing runs in two phases so it scales to fields with hundreds
# of items (e.g. podiatry disciplinary_grounds ≈ 788 items). Phase 1 designs
# the vocabulary once over all rows; phase 2 assigns rows in chunks against
# that fixed vocabulary. Splitting keeps each call's OUTPUT small — the old
# single-call version timed out generating ~800 echoed assignments.

map_prep_bucket_text_per_item_design:
  system: |
    You are designing a small category VOCABULARY for the individual items of
    a list-of-objects profession field across U.S. states. The field is
    something like disciplinary_grounds: each state has its own list of items,
    and we want a shared bucket vocabulary so aggregated views can answer
    "which states include a fraud-type ground, a criminal-conviction-type
    ground, etc."

    You will see one field name and many input rows. Each row is ONE item from
    ONE state (the same state appears many times). Each row has:
      - state, item_index: identify the item (you can ignore these here)
      - item_label: the snake_case label the extraction assigned (a signal)
      - raw_value: a plain-English one-line description (the primary signal)

    Output ONLY:
      - bucket_set: 3-9 short, scannable category labels (Title Case, 1-4
        words) that together partition the actual distribution of items you
        see. Don't invent buckets nothing fell into.
      - rationale: one sentence on why this set partitions the data well.

    Do NOT output any per-row assignments — only the vocabulary. A later pass
    assigns each item to one of your buckets, so make the set complete enough
    that every item has a natural home (a single "Other" catch-all is fine but
    should not be the largest group).

map_prep_bucket_text_per_item_assign:
  system: |
    You are assigning individual items of a list-of-objects profession field
    to a FIXED category vocabulary that was already designed. Do not invent new
    categories — use only the provided bucket_set.

    You will see: the field name, the bucket_set (the allowed labels), and a
    batch of input rows. Each row is ONE item from ONE state:
      - state: two-letter state code
      - item_index: 0-based position of the item in that state's list
      - item_label: the snake_case extraction label (a signal)
      - raw_value: a plain-English one-line description (the primary signal —
        read this to choose the bucket)

    Output:
      - assignments: EXACTLY ONE per input row, each an object with ONLY
        {state, item_index, bucket}. The bucket must be one of the provided
        bucket_set, or null only if the item genuinely fits none (prefer the
        closest bucket when in doubt). Do NOT echo item_label or raw_value.

    Rules:
      1. Use only labels from the given bucket_set — never a new one.
      2. Process EVERY input row. Output assignment count must equal input
         row count. Don't deduplicate, skip, or summarize.
      3. Copy each row's state and item_index exactly so assignments join
         back to the source items.

# Cross-profession harmonization (#16): unlike map_prep_bucket_text (one
# profession at a time), this sees EVERY profession's values for one universal
# field at once and emits a SINGLE shared label set, so the same category means
# the same thing across professions and the chips line up side by side.
map_prep_harmonize_universal:
  system: |
    You are bucketing ONE field that exists across MULTIPLE professions into a
    SINGLE shared set of labels, so the same category means the same thing for
    every profession and a reader can line the professions up side by side.

    You'll see the field name, a short note on what the field means, and the raw
    per-state values for EVERY profession (each row tagged with its profession).
    The values are statutory prose — idiosyncratic, and the profession-specific
    wording differs (one profession's body is "Board of Dental Examiners",
    another's is "Board of Nursing"), but the UNDERLYING category is often the
    same — both are "a board dedicated to that profession."

    Produce ONE bucket_set that is PROFESSION-INDEPENDENT: each label names a
    TYPE that applies regardless of profession (e.g. "Profession-Specific Board",
    "Shared Medical/Allied Board", "State Health Department", "General Licensing
    Agency"). NEVER put a single profession's name in a bucket label.

    Output:
      - bucket_set: 4-8 short, scannable, profession-independent labels.
      - rationale: one sentence on the shared dimension you bucketed on.
      - assignments: one object per INPUT ROW, with ONLY {profession, state,
        bucket} — bucket is one of bucket_set. Do NOT echo raw_value back; we
        already have it. Assign every input row exactly once. Use null bucket
        only if a value genuinely fits nothing — prefer the closest bucket when
        in doubt.

    Rules:
      1. The set must partition the actual values you see — don't invent buckets
         nothing falls into.
      2. The SAME real-world category MUST get the SAME label across professions —
         that is the entire point of this pass.
      3. Labels short (1-4 words); they render as small chips. "Other" is a fine
         catch-all but should not be the largest bucket.
      4. The bucket is a category label, never the raw_value verbatim.
      5. Bucket the SPECIFIC body named, not the umbrella it sits inside. Statutes
         routinely create a dedicated board within a parent department — "There is
         created within the department the Board of Optometry", "The Board of
         Nursing is created within the department". That is still a
         profession-specific board; the department is only its host. Use a
         department/agency bucket ONLY when the department itself does the
         licensing and no dedicated board is named. Likewise a value naming both
         ("Board of Medicine, Department of Health") buckets on the BOARD.

