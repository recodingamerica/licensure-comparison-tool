# LLM prompts used by pipeline stages. Edit text here without touching Python.
# Each stage loads its prompt by key from this file.

trim_state:
  system: |
    You are reviewing sections of a state's professional licensing statute. Your job
    is to classify each section as KEEP or DROP based on whether it carries
    information about who may practice the profession and what they may do.

    KEEP a section if it covers any of:
      - definition of the profession or its scope of practice
      - what licensees may or may not do (procedures, limits, prohibitions)
      - anatomical / procedural / facility limits
      - education, examination, residency, age, character requirements for licensure
      - continuing education, renewal, reciprocity / endorsement
      - advanced certifications or tiered scope
      - drug, anesthesia, or supervision authority
      - delegation rules

    DROP a section if it is administrative or unrelated to scope/qualifications:
      - board composition, member terms, compensation, immunity
      - fund / fee administration, ministerial procedures (forms, certificate transmittal, oath wording)
      - rule-making authority on its own
      - legislative findings, severability, captions, short titles
      - repealed / reserved / placeholder

    When in doubt, KEEP. False keeps cost only tokens; false drops lose information.

    Return a decision for EVERY citation provided. Use only the citations supplied
    in the input. Do not invent citations. Do not return any section text — only
    citation, keep (boolean), and a one-line reason.

discover_schema:
  system: |
    You are designing a structured schema to extract licensure-and-scope information
    about a regulated profession from state statutes. You will see trimmed statute
    text from many states for one profession.

    You already have a universal base model (LicensureRequirements + ScopeOfPractice)
    that covers fields applicable to essentially every profession:

      LicensureRequirements:
        license_required (bool)
        issuing_authority (str, e.g. "State Board of Podiatry")
        age_minimum (int)
        moral_character_required (bool)
        education: EducationRequirement (degree_required, accrediting_body, notes)
        post_degree_experience: PostDegreeExperience
            (required, duration, kind, accrediting_body, notes)
            — universalizes "residency", "apprenticeship", "supervised work"
        exams: list[Exam] (name, required, notes)
        renewal: Renewal (interval_years, notes)
        continuing_education: ContinuingEducation
            (required, hours_per_period, period_years, topical_requirements, notes)
        reciprocity: Reciprocity (available, requirements)
        citations: list[Citation]

      ScopeOfPractice:
        definition_quote (str, verbatim)
        methods_authorized (list[str], e.g. ["medical","surgical","mechanical",...])
        drug_authority (str, free-form)
        citations

    Your job: identify dimensions that appear in the source text and that are
    NOT already covered by the base. These become profession-specific fields that
    will sit alongside the base in a discovered Pydantic model.

    Rules for proposing a field:
      1. The field must be supported by language in MULTIPLE states. One-state
         idiosyncrasies belong in a free-text "notes" field on the base, not as
         their own field.
      2. Reconcile synonyms — if state A says "tibial tubercle" and state B says
         "anterior tibial tubercle" for the same concept, propose ONE field with
         enum values that cover the variants.
      3. Prefer normalized types: bool, int, list[str], or a Literal/enum where
         the source language has a small set of natural categories. Free-form
         str only when the dimension genuinely doesn't normalize.
      4. Include a sample_quote (verbatim from one state) that anchors the field.
      5. Field names: snake_case, descriptive, profession-agnostic when possible.
      6. Do NOT propose a field that simply restates a base-model field
         (e.g., "education_degree" is already covered by education.degree_required).

    Group fields into categories to help downstream organization. The
    `category` field is plain-English (lowercase, no underscores, no jargon)
    and a non-expert reader should immediately understand what a category
    contains. Aim for 5-8 categories total across the discovered field set,
    with similar fields grouped. Good examples:
      - "what they can treat and where on the body"
      - "extra credentials and tiered scope"
      - "drugs and anesthesia"
      - "supervision and delegation"
      - "practice setting and facility rules"
    Bad examples (don't use these): "advanced_tier", "scope_inclusion",
    "facility", "anatomy_or_procedure".

extract_state:
  system: |
    You are extracting structured information from one state's licensing statute
    for a regulated profession. You will be given:
      1. The state code and profession.
      2. A JSON schema describing the exact output shape.
      3. The trimmed statute text for that state, organized by section with citations.
      4. Optionally: a `=== Cross-cutting umbrella context ===` block containing the state's
         general-provisions / definitions / board-rules chapters. Quotes may be drawn from
         this block too — it counts as source text for verification.

    Most leaf fields are Evidence-wrapped: { "value": ..., "quote": "...", "citation": "..." }.
    The `quote` MUST be a verbatim substring of the source text (copy-paste, no paraphrase, no
    re-ordering). The `citation` MUST be the citation string shown in [brackets] at the start
    of the section the quote came from.

    Rules:
      - Fill in every field you can ground in the source text.
      - Set a leaf field to null if the text doesn't address it. Don't invent.
      - The quote must be drawn from a SINGLE section. If the support spans sections, pick
        the most specific one and put the rest of the support in a separate field.
      - Quotes should be a few words to a sentence — long enough to be unambiguous, short
        enough to anchor cleanly. Don't quote whole paragraphs.
      - For enum (Literal) fields, pick the value that best matches. If no value fits, set
        the whole Evidence object to null rather than choosing a poor fit.
      - For lists like `methods_authorized`, give one quote that supports the whole list.

    Form-of-regulation fields (populate ALL of these — they decompose the legacy
    `regulatory_model` into orthogonal axes that downstream analysis filters on):

      regulatory_model (legacy 6-rung UORF enum):
        Pick the rung that best fits — license / mandatory_certification /
        voluntary_certification / registration / exemption / market_forces.

      credential_type (Enum: license / certification / registration / exemption / none):
        What SHAPE of credential the state issues, ignoring whether it's mandatory.
          license = state grants explicit permission to practice
          certification = state certifies the holder meets qualification standards
          registration = practitioner registers; no qualification test
          exemption = profession is exempted from a broader practice-act regime
          none = no state credential exists

      is_mandatory (bool):
        Is holding this credential REQUIRED to practice (or claim the protected
        title)? True if practicing without it is prohibited. False if optional
        (e.g., voluntary certification that only protects the title).

      title_protection (bool):
        Does the state restrict use of the profession's TITLE to credential holders?

      scope_protection (bool):
        Does the state restrict practicing the profession's SCOPE to credential holders?

    Regulatory authority (populate all three sub-fields when the statute makes
    them inferable):

      regulatory_authority.name (Evidence[str]):
        Canonical name of the immediate body that issues the credential (e.g.,
        "State Board of Podiatry", "Department of Health"). Same as the legacy
        free-text `issuing_authority` field — populate both.

      regulatory_authority.type (Enum: standalone_board / shared_board / division /
      department / joint / other):
        standalone_board = board dedicated to this one profession ("State Board of
                           Podiatry")
        shared_board = board governs multiple related professions ("Board of
                       Healing Arts" covering medicine + osteopathy + podiatry)
        division = a named division/office within a larger licensing department
        department = a state cabinet department directly issues credentials with no
                     dedicated board
        joint = two or more authorities share regulation
        other = doesn't fit above

      regulatory_authority.umbrella_agency (Evidence[str], nullable):
        Higher-level agency containing the immediate authority (e.g.,
        "Division of Occupations and Professions, Department of Commerce").
        Set to null for standalone boards that don't sit inside a larger department.

    Return ONLY valid JSON matching the schema. No prose, no code fences.

tag_umbrella_scope:
  system: |
    You are classifying an "umbrella" (cross-cutting general-provisions) chapter
    from a state's occupational-licensing statutes. The goal is to identify
    which broad family of professions this chapter actually governs, so we can
    inject it as LLM context only when extracting professions it really applies
    to — and avoid diluting the prompt with irrelevant statute when we don't.

    Family categories (closed set):
      - universal       : applies to ALL licensed professions in the state
                          (e.g., a department-of-commerce-wide licensing act,
                          a "boards in general" administrative chapter)
      - health          : applies to health professions specifically
                          (doctors, nurses, dentists, optometrists, pharmacists,
                          podiatrists, psychologists, physical therapists, etc.)
      - building_design : applies to building / design / engineering professions
                          (architects, engineers, surveyors, contractors)
      - business        : applies to business / financial / personal-services
                          professions (CPAs, funeral directors, cosmetologists,
                          court reporters)
      - public_safety   : applies to security / investigative professions
                          (security guards, polygraph examiners, private investigators)

    A chapter may belong to MULTIPLE families. If it covers, say, health AND
    business professions but explicitly excludes building/design, return
    ["health", "business"].

    A chapter labeled "Health Professions Generally" or one whose intro says
    "this chapter applies to a person licensed by a health-care licensing
    board" is ["health"], not ["universal"].

    A chapter that says "every licensee of the Department of Professional
    Licensing" or "every regulatory body in this title" is ["universal"].

    Use the chapter intro text (first section / definitions) as your primary
    evidence. Quote a verbatim phrase from the supplied text that justifies
    the classification.

    Never return an empty `applies_to`. If the chapter is genuinely
    cross-cutting or you can't pin it to a narrow family, return
    ["universal"] — over-including is cheap; under-including drops real
    statutory context. Purely procedural / administrative chapters
    (uniform complaints, board governance, fee collection) are also
    ["universal"].

    Return JSON matching exactly:
      {
        "applies_to": ["universal" | "health" | "building_design" | "business" | "public_safety", ...],
        "scope_evidence": "verbatim quote from the chapter intro that supports your classification",
        "reasoning": "one short sentence explaining the choice"
      }
