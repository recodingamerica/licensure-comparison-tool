community_health_worker:
  HI: {basis: not_regulated, citation: "", note: 'HI has NO state CHW certification. The 2022 SB2882 (which would have created a DCCA CHW certification program) was DEFERRED and never became law -- state auditor Sunrise Analysis 22-08 recommended against licensing; confirmed via CDP-read bill record + Grassroot Institute/chwregistry.com/Kapiolani CC. The earlier "chapter-321" mapping was spurious (the bill would have gone in a new DCCA chapter, not HRS 321 anyway). (2026-07-09, tier3_absence Step 2 follow-up).'}
  RI: {basis: not_regulated, citation: "", note: 'RI Gen. Laws Title 23 Ch.23-64.1 (Commission for Health Advocacy and Equity) S23-64.1-2 only DEFINES "community health worker" for the Commission''s own purposes -- no chapter establishes individual CHW certification/registration/scope of practice. Medicaid CHW reimbursement runs through EOHHS administrative policy, not a General Laws section. Certification is run entirely by the private Rhode Island Certification Board with no statutory enabling authority. (2026-07-09, tier3_absence Step 2 follow-up).'}
  NV: {basis: not_regulated, citation: "", note: 'NRS 449.0027/.0028/.0045 license CHW "pools" as FACILITIES (business entities), not individual CHWs. No separate NV statute creates an individual CHW license/certification/registration -- checked Ch.439 (Admin. of Public Health) and Ch.432/433/632/422, none codify one. The only individual certification is issued by the Nevada Certification Board, a private 501(c)(3) nonprofit (CASAT/UNR) -- not a state board, not created by statute. 2021 AB191/SB420 and 2023 SB117 only authorized Medicaid reimbursement conditioned on that private certification; they did not enact licensure. (2026-07-09, tier3_absence Step 2 follow-up).'}
  AK: {basis: not_regulated, citation: "", note: 'No statute establishing CHW certification/registration/scope of practice -- only a voluntary agency-run training/certification program with no enabling statute, per NASHP''s State CHW Policy Tracker. (2026-07-08, tier3_absence Step 2 grind).'}
