# Verified absences — (profession, state) pairs confirmed to have NO state-level
# license (regulated locally, or not regulated at all). These are NOT data gaps;
# they are correct-blanks. Source: hand-verified research (Atharv #53 findings,
# spot-checked against official code/legislature sites).
#
# apply_verified_absences.py turns each into a structured record with
# regulatory_model=market_forces (the pipeline's existing "no state regulation"
# value), transparently marked `source: verified_absence` so it's never confused
# with an extracted, statute-grounded record. `citation` is the local-enabling hook
# where one exists (municipal code, HIC act), else "" for a genuine null.
#
# basis: local_only            — licensed by city/county, no state license
#        not_regulated         — no license at any level
#        contractor_only       — only a state contractor registration, not a trade license

electrician:
  IL: {basis: local_only, citation: "65 ILCS 5/11-33-1", note: "No statewide license; municipalities register contractors (Chicago, Aurora, ...)."}
  IN: {basis: local_only, citation: "675 IAC art. 17", note: "Electrical code only, no statewide licensing board; municipal/county."}
  KS: {basis: local_only, citation: "", note: "No state licensing act; counties/cities license."}
  NY: {basis: local_only, citation: "", note: "No state licensing act; NYC DOB and localities license."}
  PA: {basis: local_only, citation: "73 P.S. § 517.1", note: "No statewide license; only HIC registration (consumer protection, not competency)."}

hvac:
  # Group C (Atharv): no statewide HVAC/mechanical license — regulated locally.
  CO: {basis: local_only, citation: "", note: "No statewide HVAC license; local compliance only."}
  IL: {basis: local_only, citation: "", note: "State licenses plumbers/electricians, leaves HVAC to localities."}
  IN: {basis: local_only, citation: "", note: "No statewide HVAC license; municipal/county."}
  KS: {basis: local_only, citation: "", note: "No statewide HVAC license; local."}
  MO: {basis: local_only, citation: "", note: "HVAC handled locally; no statewide HVAC license."}
  NE: {basis: local_only, citation: "", note: "No statewide HVAC license (Omaha ACAD / Lincoln handle it)."}
  NY: {basis: local_only, citation: "", note: "No statewide HVAC-R contractor license; local."}
  PA: {basis: local_only, citation: "73 P.S. § 517.1", note: "Only AG Home Improvement Contractor registration, not an HVAC trade license."}
  SD: {basis: local_only, citation: "", note: "No statewide HVAC license; local."}
  WY: {basis: local_only, citation: "", note: "State licenses plumbers/electricians, leaves HVAC to localities."}
  # MT/ND/VT REMOVED 2026-07-08: same "no dedicated HVAC chapter, covered by a general
  # contractor law" shape as TN/MS/AZ (issue #53), which were extracted as real licenses
  # (regulatory_model=license via contractor classification), not flagged absent. Real
  # corpora now pulled for all three (MT ch9 Contractor Registration, ND ch43-07
  # Contractors, VT residential-contractor-registration act) — let extraction classify
  # them the same way, rather than hand-picking an absence basis ahead of the statute.

plumbing:
  KS: {basis: local_only, citation: "K.S.A. 12-1508", note: "No state license; counties/cities examine and issue a certificate of competency."}
  NE: {basis: local_only, citation: "Neb. Rev. Stat. § 18-1907", note: "No state license; municipal boards; state registration != licensing."}
  NY: {basis: local_only, citation: "", note: "No state plumbing credential; city/county (e.g. NYC DOB) authorities."}
  PA: {basis: local_only, citation: "73 P.S. § 517.1", note: "No state license; only HICPA registration for residential home-improvement."}
  WY: {basis: local_only, citation: "", note: "No statewide plumbing (or contractor) license; cities/counties handle all."}

building_inspector:
  NE: {basis: local_only, citation: "", note: "Nebraska is a home-rule state for building codes — no mandatory statewide code or state-level inspector license; cities/villages/counties adopt and enforce their own (2026-07-08, narrow.py big_no_match + web-verified)."}
  AZ: {basis: local_only, citation: "", note: "No state building-inspector license; construction is licensed via the Registrar of Contractors (Title 32 ch.10) and building inspection is a municipal code-enforcement function (2026-07-13, gap-locator 404 + web-verified)."}
  TX: {basis: local_only, citation: "", note: "No state building-inspector credential; building inspection is local/municipal under adopted codes (state has home-inspector Occ. Code ch.1102 and code-enforcement-officer ch.1952, distinct professions) (2026-07-13, gap-locator no-URL + web-verified)."}
  VA: {basis: local_only, citation: "Va. Code Title 36 ch.6 / 13VAC5-63", note: "No DPOR/Title 54.1 occupational license; building inspectors are DHCD-certified 'code officials' administratively under the Uniform Statewide Building Code, not a standalone statutory license (2026-07-13, gap-locator empty-corpus + web-verified)."}

optician:
  NE: {basis: not_regulated, citation: "", note: "One of 28 states with no dispensing-optician license per IJ's License to Work report (2026-07-08, narrow.py big_no_match + web-verified)."}
  OK: {basis: not_regulated, citation: "", note: "Same IJ License to Work list as NE — no dispensing-optician license (2026-07-08, narrow.py whole_title + web-verified)."}
  LA: {basis: not_regulated, citation: "", note: "LA licenses optometrists (RS Title 37 ch.12) but not dispensing opticians; only voluntary ABO/NCLE certification. Mirrors opticianry/LA (2026-07-13, gap-locator no-URL + web-verified)."}

opticianry:
  ND: {basis: not_regulated, citation: "", note: "ND does not license or register dispensing opticians (only optometrists, under NDCC ch. 43-13); confirmed via the Opterio optician-license-by-state tracker placing ND among the states with no optician credential. Gap-harvest had mis-located this to the optometry chapter, same shape as opticianry/LA (2026-07-17, web-verified)."}
  NE: {basis: not_regulated, citation: "", note: "Same underlying finding as optician/NE — no dispensing-optician license (2026-07-08, narrow.py big_no_match + web-verified)."}
  LA: {basis: not_regulated, citation: "", note: "LA licenses optometrists (RS Title 37 ch.12) but not dispensing opticians; no separate optician licensure found. Gap-harvest had mis-located this to the optometry chapter (2026-07-10, web-verified)."}

alcohol_drug_counseling:
  AK: {basis: not_regulated, citation: "", note: "AK licenses general professional counselors (AS 08.29) but not chemical-dependency counselors specifically; that certification runs through the private Alaska Commission for Behavioral Health Certification with no enabling Justia chapter found (2026-07-08, narrow.py + web-verified)."}

massage_therapy:
  KS: {basis: not_regulated, citation: "K.S.A. 65-2872", note: "No statewide massage therapy license; the only statutory provision exempts massage from needing a healing-arts license. Licensure bills (SB 111/305, 2023) never passed (2026-07-08, narrow.py + web-verified)."}
  MN: {basis: not_regulated, citation: "Minn. Stat. ch. 146A", note: "No true statewide massage therapy license; massage is addressed only as an unlicensed practice category under the Complementary and Alternative Health Care Practices act (2026-07-08, narrow.py + web-verified)."}

prosthetist_orthotist:
  ND: {basis: not_regulated, citation: "", note: "ND is not among the ~17 O&P licensure states -- the ABC (ABCOP) state page states ND issues no O&P licenses; the only requirement is that custom orthotics/prosthetics suppliers use nationally ABC/BOC-certified individuals, not a state practitioner license. Gap-harvest had mis-located this to ch. 43-51, a general cross-profession administrative chapter (2026-07-17, web-verified)."}
  MA: {basis: not_regulated, citation: "", note: "MA is not among the ~17 states requiring O&P licensure (confirmed via BOCUSA/AOPA licensure trackers); no section of MGL ch.112 addresses orthotists/prosthetists/pedorthists (2026-07-08, narrow.py + web-verified)."}
  WV: {basis: not_regulated, citation: "W. Va. Code 30-3", note: "WV has no separate O&P licensure; the Medical Practice Act (ch.30 art.3) only *exempts* nationally-certified device fitters from unauthorized-practice — an exemption, not a licensing chapter. Gap-harvest had mis-located this to that exemption (2026-07-10, web-verified)."}

public_adjuster:
  AK: {basis: not_regulated, citation: "", note: "AK's insurance producer/agent/adjuster chapter (Title 21 ch.27) only licenses adjusters acting for insurers; the Division of Insurance confirms no public-adjuster (insured-side) license category exists (2026-07-08, narrow.py + web-verified)."}
  AR: {basis: not_regulated, citation: "", note: "AR's adjuster chapter (Title 23 ch.64) only licenses adjusters acting for insurers; a 2011 bill to create a public-adjuster license (SB378) failed, and public adjusting is treated as unauthorized practice (2026-07-08, narrow.py + web-verified)."}

polygraph_examiner:
  DE: {basis: not_regulated, citation: "", note: "DE does not license polygraph examiners at all, confirmed via the American Polygraph Association's state-board list; the only polygraph-adjacent statute (19 Del. C. §704) is an employee-protection provision, not a licensing chapter (2026-07-08, narrow.py + web-verified)."}
  CO: {basis: not_regulated, citation: "", note: "CO has no general polygraph-examiner licensing statute; only narrow SOMB/PCSOT approval under CRS §16-11.7-106 for sex-offender testing, not an occupational license (2026-07-13, gap-locator no-URL + web-verified)."}
  CA: {basis: not_regulated, citation: "", note: "CA has no current polygraph-examiner licensing statute; the former Bus. & Prof. Code §§9304-9305 licensing scheme sunset/expired Jan 1, 1990. Only subject-matter statutes remain (Evid. Code §351.1 admissibility, Labor Code §432.2 employment); examiners follow federal 29 CFR §801.26 (2026-07-20, web-verified)."}

court_reporter:
  CO: {basis: not_regulated, citation: "", note: "CO does not license or certify court reporters at the state level (confirmed via CO Judicial Branch + legalcareerpath: employers require the national NCRA RPR, the state does not mandate a license). The old CRS Title 12 Art.63 'Shorthand Reporters' was repealed/obsoleted in the 2019 Title-12 recodification (HB19-1172); the surviving Justia article-63 page is an empty stub (2026-07-13, web-verified)."}

public_weighmaster:
  ND: {basis: not_regulated, citation: "", note: "ND Century Code Title 64 (Weights, Measures, and Grades) has no public-weighmaster license -- weights-and-measures is device-standards enforcement by the Public Service Commission and grain weighing runs through separate Dept. of Agriculture grain licensing. The prior mapping to ch. 64-01 captured units-and-standards, not a weighmaster license (2026-07-17, web-verified against the Title 64 chapter index and ND PSC weights-and-measures pages)."}
  KY: {basis: not_regulated, citation: "", note: "No clean KY public-weighmaster licensing chapter exists; KRS ch.189 (Traffic Regulations) only covers peace officers weighing vehicles for enforcement (2026-07-08, narrow.py + web-verified)."}

private_investigator:
  CO: {basis: not_regulated, citation: "", note: "CO does not license private investigators at the state level; the former CRS Title 12 Art.160 'Private Investigators' program (a voluntary licensure that sunset) is repealed -- Justia's article-160 page is a single '12-160-101 to 12-160-111 [Repealed]' stub. No successor licensing chapter (2026-07-14, gap-repull recon: article resolves 200 but is a repealed stub)."}

auctioneer:
  NE: {basis: not_regulated, citation: "", note: "NE has no general state auctioneer license (confirmed via NALLOA's no-licensing-board list); the only Ch.81 touchpoint (§81-887.03) just requires real-estate auctioneers to also comply with the Real Estate License Act (2026-07-08, narrow.py + web-verified)."}
  NV: {basis: not_regulated, citation: "", note: "NV has no general state-level auctioneer license (confirmed via NALLOA's no-licensing-board list); NRS chapters found are narrow special cases (Ch.573 public livestock auctions, Ch.482/445B vehicle-consignment auctions), not a general auctioneer license. Auction businesses register locally (e.g. Clark Co./Las Vegas permits) (2026-07-08, hand-verified)."}
  AZ: {basis: not_regulated, citation: "", note: "AZ has no statewide auctioneer license (confirmed via AZ State Auctioneers Association + licensing guides); only local permits and UCC/vehicle-dealer rules apply (2026-07-13, gap-locator 404 + web-verified)."}
  MI: {basis: not_regulated, citation: "MCL 339.2901-339.2919 (repealed)", note: "MI repealed its auctioneer board and registration -- Occupational Code Art. 29 (MCL 339.2901-2919) repealed by 2014 Act 151, eff. 2014-06-24. The Justia page for the article is the single 'repealed' notice; no successor licensing chapter. (2026-07-16, issue #8 MI audit)."}

radiologic_technology:
  MI: {basis: not_regulated, citation: "", note: "MI has no radiography license/certificate/permit per ASRT's official states-that-regulate list; MSRT/ARRT lobbied the legislature for licensure and failed, then pursued MIOSHA radiation-safety administrative rules (CT operator qualifications) instead of a licensing statute (2026-07-08, hand-verified)."}
  MN: {basis: not_regulated, citation: "Minn. Stat. § 144.121", note: "MN has no radiography license/certificate/permit for general RTs per ASRT's states-that-regulate list; the only state credential is a narrow 'limited scope x-ray operator' registration under Minn. Stat. §144.121 for non-ARRT-certified operators, not a license covering the radiologic technologist profession generally (2026-07-08, hand-verified)."}

construction_trades:
  IN: {basis: local_only, citation: "", note: "No statewide general-contractor license; each city/county runs its own registration (Indianapolis/Marion Co. BNS Ch. 875, Fort Wayne, Evansville, South Bend, ...). Plumbing is the only construction trade IN licenses at the state level (2026-07-08, hand-verified)."}
  TX: {basis: local_only, citation: "", note: "No statewide general-contractor license; regulated entirely at the municipal level. Only specialty trades (plumbing, electrical, HVAC) carry a state-level license in TX (2026-07-08, hand-verified)."}
  NH: {basis: local_only, citation: "RSA 332-A / RSA 310-A:188-210", note: "No statewide general-contractor license, and most NH municipalities have none either. The only state-level artifact is Home Improvement Contractor registration (residential jobs >$1,000) -- a liability-insurance/consumer-protection requirement, not a competency license (same shape as PA's HIC registration). Electricians (RSA 319-C) and plumbers (RSA 329-B) are separately licensed trades, not construction_trades (2026-07-08, hand-verified)."}
  OK: {basis: not_regulated, citation: "59 O.S. §1151 et seq.", note: "General Contractors are not currently required to have a state license in Oklahoma (verbatim from CIB's own FAQ, corroborated across 3 official oklahoma.gov/cib.html pages). The Construction Industries Board licenses only 6 specific trades (electrical, plumbing, mechanical/HVAC, roofing, building/home inspectors) via their own trade-specific acts -- no general-contractor chapter exists anywhere in Title 59. The existing Title 59 Ch. 11 Roofing Contractor Registration Act corpus is a legitimate CIB trade-act pull, not evidence of general-contractor licensing (2026-07-08, hand-verified)."}
  WY: {basis: local_only, citation: "Wyo. Stat. §16-6-1101 et seq.", note: "No state-level general contractor license -- licensing is purely local (county/city/town). §16-6-1101 (Title 16 Ch.6 Art.11, confirmed via wyoleg.gov's official statute text) is NOT a state license or a public-works-bidding requirement; it's a horizontal reciprocity mandate forcing local licensing jurisdictions to recognize each other's licenses. Electrical is the only state-licensed trade in WY (2026-07-08, hand-verified)."}
  ME: {basis: not_regulated, citation: "", note: "No state-level general contractor license. Prior mapping (Title 10 Ch.201-A §§1111-1120, removed 2026-07-08) was Maine's Prompt Payment Act (payment/retainage/dispute terms for construction contracts), not a licensing statute -- caught when trim_state correctly dropped all 10 sections as non-licensing content. Confirmed via maine.gov/pfr's full 67-profession list (no general/HIC contractor board exists) and legislature.maine.gov (repeated licensing bills, e.g. LD 1038, never enacted) (2026-07-08, hand-verified)."}

professional_geology:
  ND: {basis: not_regulated, citation: "", note: "ND has no professional-geologist licensure/registration act -- the American Geosciences Institute state-licensure tracker lists ND as not providing a license (engineers and land surveyors are licensed separately under ch. 43-19.1). The prior mapping to ch. 54-17.4 captured the Geological Survey agency, not a licensing statute, same shape as professional_geology/MI (2026-07-17, web-verified)."}
  OK: {basis: not_regulated, citation: "", note: "OK has no professional-geologist licensure/registration act (confirmed via the American Geosciences Institute's state licensure tracker); OK licenses engineers and land surveyors under the PELS board but not geologists. The only Justia hit, 25 O.S. §25-35, is a pure definitions section in Title 25 (Oklahoma's general Definitions title), not a licensing statute (2026-07-08, hand-verified)."}
  MI: {basis: not_regulated, citation: "", note: "MI does not license professional geologists (confirmed via American Geosciences Institute / ASBOG state-licensure trackers); a 2003-04 bill (HLA 6063) proposing PG licensure was never enacted. The prior Justia mapping to Chapter 321 'Geological and Other Surveys' captured state-survey acts, not a licensing statute (2026-07-13, web-verified)."}

