<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>State licensing — by profession</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    :root {
      --color-primary: #1a1a2e;
      --color-accent:  #2a7fb8;
    }
    body { padding: 2rem; font-family: var(--font-sans, system-ui, sans-serif); max-width: 880px; }
    h1 { margin-bottom: 1rem; color: var(--color-primary); }
    .picker-card { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .picker-row { display: flex; gap: .75rem; align-items: center; }
    .picker-row select { flex: 1; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin-top: 1rem; font-size: .9em; color: #555; }
    .stats-grid strong { color: var(--color-primary); }
    .prof-list { list-style: none; padding: 0; margin: 0; }
    .prof-list li { padding: .65rem .85rem; border: 1px solid #e1e4e8; border-radius: 6px; margin-bottom: .5rem; display: flex; justify-content: space-between; align-items: center; }
    .prof-list li:hover { background: #f6f8fa; border-color: var(--color-accent); }
    .prof-list a { color: inherit; text-decoration: none; flex: 1; }
    .prof-list .meta { color: #666; font-size: .85em; font-family: var(--font-mono, ui-monospace, monospace); }
  </style>
</head>
<body>
  <h1>State licensing — by profession</h1>

  <div class="picker-card">
    <div class="picker-row">
      <label for="profSelect" class="form-label mb-0"><strong>Pick a profession:</strong></label>
      <select id="profSelect" class="form-select"></select>
      <button id="goBtn" class="btn btn-primary">Open</button>
    </div>
    <div id="pickerStats" class="stats-grid"></div>
  </div>

  <h5 class="mt-4 mb-2 text-muted">All available profiles</h5>
  <ul id="profList" class="prof-list"></ul>

  <script>
  function escapeHtml(s) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => map[m]);
  }

  fetch('professions.json')
    .then(r => r.json())
    .then(items => {
      // items: [{ profession, display, covered, gaps, fields, verified_pct }]
      const sel = document.getElementById('profSelect');
      const list = document.getElementById('profList');
      items.sort((a, b) => (b.covered || 0) - (a.covered || 0));

      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.profession;
        opt.textContent = item.display;
        sel.appendChild(opt);

        const li = document.createElement('li');
        li.innerHTML =
          `<a href="profile.html?p=${encodeURIComponent(item.profession)}">
            <strong>${escapeHtml(item.display)}</strong>
          </a>
          <span class="meta">
            ${item.covered}/${(item.covered || 0) + (item.gaps || 0)} states · ${item.fields} fields · ${item.verified_pct ?? '—'}% verified
          </span>`;
        list.appendChild(li);
      });

      // Stats for selected profession
      function updateStats() {
        const item = items.find(i => i.profession === sel.value);
        if (!item) { document.getElementById('pickerStats').innerHTML = ''; return; }
        document.getElementById('pickerStats').innerHTML =
          `<div><strong>${item.covered}</strong> states with extracted records</div>
           <div><strong>${item.gaps}</strong> coverage gaps</div>
           <div><strong>${item.fields}</strong> profession-specific fields auto-discovered</div>
           <div><strong>${item.verified_pct}%</strong> evidence verified vs source</div>`;
      }
      sel.addEventListener('change', updateStats);
      updateStats();

      document.getElementById('goBtn').addEventListener('click', () => {
        window.location = `profile.html?p=${encodeURIComponent(sel.value)}`;
      });
      sel.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('goBtn').click();
      });
    })
    .catch(err => {
      document.body.insertAdjacentHTML('beforeend',
        `<div class="alert alert-danger">Failed to load professions.json: ${escapeHtml(err.message)}</div>`);
    });
  </script>
</body>
</html>
