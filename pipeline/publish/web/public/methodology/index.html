try').", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development except where the context otherwise requires", "citation": "08.40.490"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "department", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development except where the context otherwise requires", "citation": "08.40.490"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": null}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": null}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": null}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": null}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": null}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "Each applicant shall be examined to determine the applicant's ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field", "citation": "08.40.270"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "Each applicant shall be examined to determine the applicant's ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field", "citation": "08.40.270"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": null}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": null}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Mechanical Administrator Licensing Examination"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Tests knowledge of plans/design specs, mechanical installations and piping, Uniform Plumbing Code, Uniform Mechanical Code, and personal skill and ability."}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (department-administered)"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": null}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "may be renewed on a date set by the department upon proof of continued competency", "citation": "08.40.290"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": null}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "If an applicant for a license submits proof satisfactory to the department that the applicant is licensed as a mechanical administrator or the equivalent by another state or territory, meets qualifica", "citation": "08.40.270"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must be licensed as a mechanical administrator or equivalent by another state or territory, meet qualifications established by the department, and have passed an equivalent examination; upon proof, the department shall waive the examination requirement.", "quote": "the department shall waive all of the examination required under (a) of this section", "citation": "08.40.270"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "regulation of electrical and mechanical administrators under AS 08.40", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": null}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": null}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": egulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.230"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "categories_of_licenses"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "\"mechanical administrator\" means a person who is responsible for (A) installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the Uniform Plumbing Code, Uniform Swimming Pool, Spa, and Hot Tub Code, Uniform Solar Energy Code, and the Uniform Mechanical Code as published by the International Association of Plumbing and Mechanical Officials and the International Conference of Building Officials; or (B) certifying that an installation or modification described in (A) of this paragraph complies with the applicable codes", "quote": "\"mechanical administrator\" means a person who is responsible for (A) installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the U", "citation": "08.40.490"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["installing", "modifying", "certifying compliance"], "quote": "installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials", "citation": "08.40.490"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.490"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "definitions"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "system_components_included", "type": "list", "vocabulary": [], "meaning": "Specific components explicitly included within the definition of an HVAC system for licensing purposes.", "depth": 0, "example": {"value": ["mechanical piping and systems", "devices", "fixtures", "equipment", "other mechanical materials"], "quote": "installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the Uniform Plumbing Code, Uniform Swimming Pool, Spa, and Hot Tub Code, U", "citation": "08.40.490"}}, {"field": "hvac_specific_experience_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the applicant must demonstrate HVAC-specific (not general construction) paid employment experience.", "depth": 0, "example": null}, {"field": "hvac_specific_experience_years", "type": "integer", "vocabulary": [], "meaning": "Number of years of full-time HVAC-specific paid employment experience required for licensure.", "depth": 0, "example": null}, {"field": "prelicensure_course_hours", "type": "integer", "vocabulary": [], "meaning": "Number of hours in the required pre-licensure course that must be completed before a contractor license is issued.", "depth": 0, "example": null}, {"field": "business_law_course_hours", "type": "integer", "vocabulary": [], "meaning": "Number of hours in a required business and law course that must be completed as part of the licensure process.", "depth": 0, "example": null}, {"field": "qualifier_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensed contractor entity must designate a named individual qualifier who holds the relevant trade license and exercises material authority over the business.", "depth": 0, "example": {"value": true, "quote": "A person may not qualify or operate as a mechanical administrator for more than one registered contractor, corporation, joint venture, or other business entity", "citation": "08.40.280"}}, {"field": "qualifier_license_type_required", "type": "list", "vocabulary": [], "meaning": "The specific individual trade license(s) that the qualifier for an HVAC contractor entity must hold.", "depth": 0, "example": {"value": ["mechanical administrator license"], "quote": "A person may not qualify or operate as a mechanical administrator for more than one registered contractor, corporation, joint venture, or other business entity", "citation": "08.40.280"}}, {"field": "qualifier_cessation_notification_days", "type": "integer", "vocabulary": [], "meaning": "Number of days within which a contractor must notify the licensing division after a qualifier ceases association with the business.", "depth": 0, "example": null}, {"field": "qualifier_replacement_grace_period_days", "type": "integer", "vocabulary": [], "meaning": "Number of days a contractor license remains in force after a qualifier ceases association, during which a  work, the cost of which does not exceed $50,000, involving residences or small commercial establishments in communities that (A) have a population of under 5,000", "citation": "08.40.390"}}, {"field": "hvac_exempt_from_small_project_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether HVAC system installation, repair, or replacement is explicitly excluded from the general small-project dollar-threshold exemption from licensure.", "depth": 0, "example": null}, {"field": "license_number_on_permits_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the contractor's license number must appear on all permit applications, contracts, agreements, or bids.", "depth": 0, "example": null}, {"field": "scope_expansion_by_rule_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the licensing commission may expand the authorized scope of work for an HVAC contractor beyond the statutory definition through administrative rulemaking.", "depth": 0, "example": {"value": true, "quote": "The department may adopt regulations establishing categories of mechanical administrators, qualifications for those categories, and the content of examinations for applicants for each category.", "citation": "08.40.230"}}]}], "example_state": "AK"}, "medicine": {"profession": "medicine", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "issuing . 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "submit a certificate from a recognized hospital or hospitals certifying that the applicant has satisfactorily performed the duties of resident physician or intern for a period of", "citation": "08.64.200"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "submit a certificate from a recognized hospital or hospitals certifying that the applicant has satisfactorily performed the duties of resident physician or intern for a period of", "citation": "08.64.200"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "one year (pre-1995 graduates) or two years (post-1995 graduates); three years for foreign medical graduates", "quote": "one year if the applicant graduated from medical school before January 1, 1995 ... two years if the applicant graduated from medical school on or after January 1, 1995", "citation": "08.64.200"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "internship or residency", "quote": "satisfactorily performed the duties of resident physician or intern", "citation": "08.64.200"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Board examination"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Board sets subjects; examination may be waived for licensure by credentials under AS 08.64.250"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (in-house)"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "dep rican Medical Colleges; American Medical Association; American Osteopathic Association; Accreditation Council for Graduate Medical Education", "quote": "accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "citation": "08.64.200"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "the board or its executive secretary shall grant a license to the applicant to practice medicine in the state", "citation": "08.64.230"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title  on, prescribe for, or administer to, any human ailment, blemish, deformity, disease, disfigurement, disorder, injury, or other m", "citation": "08.64.380"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["diagnose", "treat", "operate on", "prescribe for", "administer to"], "quote": "to diagnose, treat, operate on, prescribe for, or administer to, any human ailment, blemish, deformity, disease, disfigurement, disorder, injury, or other mental or physical condition", "citation": "08.64.380"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": {"value": "Physicians may prescribe and dispense prescription drugs, including controlled substances, subject to limits on opioid prescriptions (no initial prescription exceeding 7-day supply for adults; no prescription exceeding 7-day supply for minors without documented justification). Prescribing via telehealth permitted with conditions.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.64.363"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.64.380"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "scope definition"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "license_status_types", "type": "list", "vocabulary": [], "meaning": "The distinct license status categories a physician may hold beyond a standard active license, such as inactive, retired, volunteer, temporary, or administrative.", "depth": 0, "example": {"value": ["active", "inactive", "retired status", "temporary permit", "locum tenens permit", "residency/internship permit"], "quote": "A licensee who does not practice in the state may hold an inactive license. A person who practices in the state, however infrequently, shall hold an active license.", "citation": "08.64.313"}}, {"field": "foreign_medical_graduate_requirements", "type": "string", "vocabulary": [], "meaning": "Special additional requirements imposed on graduates of medical schools outside the United States or Canada, such as additional postgraduate training years, ECFMG certification, or separate examination standards.", "depth": 0, "example": {"value": "Foreign medical graduates (graduates of schools not accredited by AAMC/AMA) must meet requirements of AS 08.64.200(a)(3)-(5) and 08.64.255, complete three years of postgraduate training (or alternative board-approved proof of competency), and pass examinations specified by the board.", "quote": "Applicants who are graduates of medical colleges not accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association shall (1) meet ", "citation": "08.64.225"}}, {"field": "postgraduate_training_years_required", "type": "integer", "vocabulary": [], "meaning": "The minimum number of years of postgraduate internship or residency training required before a license will be issued to a standard domestic medical school graduate.", "depth": 0, "example": {"value": 2, "quote": "two years if the applicant graduated from medical school on or after January 1, 1995", "citation": "08.64.200"}}, {"field": "pain_management_education_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires applicants or licensees to complete specific education in pain management and opioid use and addiction as a condition of licensure or renewal.", "depth": 0, "example": {"value": true, "quote": "receive education in pain management and opioid use and addiction, unless the applicant has demonstrated to the satisfaction of the board that the applicant does not currently hold a valid federal Dru", "citation": "08.64.200"}}, {"field": "opioid_prescribing_limits", "type": "string", "vocabulary": [], "meaning": "Statutory limits on the quantity or duration of opioid prescriptions a licensee may issue, including any exceptions for chronic pain, cancer, or palliative care.", "depth": 0, "example": {"value": "Initial prescription for an opioid may not exceed a seven-day supply for adult outpatients; no opioid prescription may exceed seven days for minors. Exceptions exist for acute medical conditions, chronic pain, cancer pain, palliative care, logistical/travel barriers, or treatment of substance abuse/opioid dependence.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.64.363"}}, {"field": "controlled_substance_database_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees who hold a DEA registration number are required to register with or use the state's prescription drug monitoring program or controlled substance database.", "depth": 0, "example": {"value": true, "quote": "require that a licensee who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 17.30.200(n)", "citation": "08.64.101"}}, {"field": "pain_management_clinic_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether physicians providing pain management services must obtain a separate registration or license from the board in addition to their standard medical license.", "depth": 0, "example": null}, {"field": "telehealth_prescribing_rules", "type": "string", "vocabulary": [], "meaning": "Specific statutory conditions under which a physician may prescribe drugs, including controlled substances, to patients seen only via telehealth rather than in person.", "depth": 0, "example": {"value": "Board may not impose disciplinary sanctions on a physician for prescribing a non-controlled prescription drug via telehealth if follow-up care is available and records are sent to primary care provider with patient consent. Prescribing controlled substances via telehealth is also permitted if those conditions and opioid limits are met. Prescribing via internet questionnaire or email without a prior physician-patient relationship is prohibited.", "quote": "The board may not impose disciplinary sanctions on a physician or physician assistant for rendering a diagnosis, providing treatment, or prescribing, dispensing, or administering a prescription drug t", "citation": "08.64.364"}}, {"field": "telemedicine_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a distinct telemedicine or telehealth license category for out-of-state physicians who wish to treat in-state patients remotely without obtaining a full in-state license.", "depth": 0, "example": null}, {"field": "interstate_medical_licensure_compact_member", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has enacted the Interstate Medical Licensure Compact, enabling eligible physicians to obtain expedited licenses in multiple member states.", "depth": 0, "example": null}, {"field": "physician_assistant_supervision_model", "type": "enum", "vocabulary": ["direct supervision required", "collaborative practice agreement", "job description with board approval", "facility credentialing system"], "meaning": "The statutory model governing how physician assistants must relate to supervising or collaborating physicians, ranging from strict supervision to collaborative practice agreements.", "depth": 0, "example": {"value": "direct supervision required", "quote": "a physician assistant may examine, diagnose, or treat persons under the supervision, control, and responsibility of either a physician licensed under this chapter or a physician exempted from licensin", "citation": "08.64.170"}}, {"field": "physician_assistant_prescriptive_authority", "type": "string", "vocabulary": [], "meaning": "The scope of prescriptive authority granted to physician assistants, including which drug schedules they may prescribe and any conditions or limitations on that authority.", "depth": 0, "example": {"value": "Physician assistants may prescribe drugs (including controlled substances), subject to board regulations on scope of activities and supervising physician responsibilities; prescribing without physical examination is permitted under the same conditions as for physicians.", "quote": "The board shall adopt regulations regarding the licensure of physician assistants and the medical services that they may perform, including the (1) educational and other qualifications ... (3) scope o", "citation": "08.64.107"}}, {"field": "max_physician_assistants_per_supervising_physician", "type": "integer", "vocabulary": [], "meaning": "The maximum number of physician assistants or advanced practice registered nurses that a single supervising or delegating physician may oversee at one time under standard practice settings.", "depth": 0, "example": null}, {"field": "malpractice_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees are required by statute to report to the board the outcome of medical malpractice claims or civil actions in which damages are paid on their behalf.", "depth": 0, "example": {"value": true, "quote": "A person licensed under this chapter shall report in writing to the board concerning the outcome of each medical malpractice claim or civil action in which damages have been or are to be paid by or on", "citation": "08.64.345"}}, {"field": "hospital_privilege_action_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether hospitals are required by statute to report to the medical board when they revoke, suspend, restrict, or refuse to grant hospital privileges to a licensed physician.", "depth": 0, "example": {"value": true, "quote": "A hospital that revokes, suspends, conditions, restricts, or refuses to grant hospital privileges to, or imposes a consultation requirement on, a person licensed to practice medicine or osteopathy in ", "citation": "08.64.336"}}, {"field": "impaired_physician_program_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state statute explicitly authorizes or requires the board to establish or contract with a program to identify, evaluate, and rehabilitate physicians impaired by substance use or mental illness.", "depth": 0, "example": {"value": true, "quote": "under regulations adopted by the board, contract with private professional organizations to establish an impaired medical professionals program to identify, confront, evaluate, and treat persons licen", "citation": "08.64.101"}}, {"field": "compelled_mental_physical_exam_authority", "type": "boolean", "vocabulary": [], "meaning": "Whether the board has statutory authority to order a licensee to submit to a mental or physical examination when there is probable cause to believe the licensee cannot practice safely.", "depth": 0, "example": {"value": true, "quote": "For the purposes of an investigation under this chapter, the board may order a person to whom it has issued a license or permit to submit to a medical or psychiatric examination by a physician or othe", "citation": "08.64.338"}}, {"field": "administrative_medicine_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a distinct administrative medicine license for physicians who wish to perform management or advisory functions without engaging in direct patient care.", "depth": 0, "example": null}, {"field": "locum_tenens_permit_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a specific temporary permit for physicians practicing as locum tenens substitutes for licensed in-state physicians.", "depth": 0, "example": {"value": true, "quote": "A member of the board, its executive secretary, or a person designated by the board to issue temporary permits may grant a temporary permit to a physician or osteopath for the purpose of (1) substitut", "citation": "08.64.275"}}, {"field": "sexual_misconduct_training_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires physicians or medical school students to complete specific training on professional boundaries and physician sexual misconduct as a condition of licensure or renewal.", "depth": 0, "example": null}, {"field": "investigational_drug_protection", "type": "boolean", "vocabulary": [], "meaning": "Whether the state statute explicitly protects physicians from disciplinary action for prescribing or administering investigational drugs or unapproved treatments to terminally ill patients who have given informed consent.", "depth": 0, "example": {"value": true, "quote": "A physician may not be subject to disciplinary action by the board for prescribing, dispensing, or administering an investigational drug, biological product, or device, or providing related treatment,", "citation": "08.64.367"}}]}], "example_state": "AK"}, "nursing": {"profession": "nursing", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Nursing", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Nursing", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "The Department of Commerce, Community, and Economic Development, in consultation with the board, shall employ a licensed registered nurse", "citation": "08.68.111"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": null}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Completion of an accredited registered nurse, practical nurse, or advanced practice registered nurse education program", "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "national nursing accrediting body", "quote": "a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "associate", "quote": "one member shall be a registered nurse engaged in nursing education at the associate, baccalaureate, or graduate degree level at an institution that holds national nursing accreditation", "citation": "08.68.010"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "registered nurse"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "associate"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": null}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": null}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Registered Nursing or Practical Nursing Licensing Examination"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Applies to RN and LPN applicants"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": null}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": null}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A license to practice nursing may not be renewed unless the nurse has complied with continuing competence requirements established by the board by regulation.", "citation": "08.68.276"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction (minimum 2 hours, for APRNs with DEA registration numbers)"], "quote": "The regulations must require that a licensee receive not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a lic", "citation": "08.68.276"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may issue a license by endorsement to practice as a registered, advanced practice registered, or practical nurse, whichever is appropriate, to an applicant who has worked as a nurse within t", "citation": "08.68.200"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must be licensed in another state, meet AK qualifications under AS 08.68.170, and have worked as a nurse within the past five years; or if not worked within five years, must also meet continuing competency requirements or complete a board-approved course of study.", "quote": "The board may issue a license by endorsement to practice as a registered, advanced practice registered, or practical nurse, whichever is appropriate, to an applicant who has worked as a nurse within t", "citation": "08.68.200"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": null}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": null}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "practice or offer to practice nursing without a license, unless the person is practicing within the scope of a delegation properly made under AS 08.68.805 or is giving necessary aid to the ill, injure", "citation": "08.68.340"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "use in connection with the person's name a designation that implies that the person is a licensed nurse unless the person is licensed", "citation": "08.68.340"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "practice or offer to practice nursing without a license, unless the person is practicing within the scope of a delegation properly made under AS 08.68.805 or is giving necessary aid to the ill, injure", "citation": "08.68.340"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value" her the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Examiners in Optometry", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry", "citation": "08.72.010"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Examiners in Optometry", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry", "citation": "08.72.010"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry and to protect and promote the public health, welfare, and safety.", "citation": "08.72.010"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.72.300"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": null}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "graduate of a school or college of optometry recognized by the board", "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "American Optometric Association", "quote": "\"recognized school or college of optometry\" means a school or college approved by the American Optometric Association or a committee of the American Optometric Association.", "citation": "08.72.300"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": " visory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Board of Examiners in Optometry", "quote": "at some time in the past, received a license to practice optometry from another state or territory of the United States or from a province of Canada that required the person to have passed the Nationa", "citation": "08.72.170"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Optometric Association", "quote": "\"recognized school or college of optometry\" means a school or college approved by the American Optometric Association or a committee of the American Optometric Association.", "citation": "08.72.300"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not falsely personate a licensed optometrist, or buy, sell, or fraudulently obtain a license issued to another", "citation": "08.72.280"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which ometrists are required to retain patient records.", "depth": 0, "example": null}, {"field": "impaired_practitioner_program_established", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute establishes or references a formal program for identifying, treating, and monitoring impaired optometrists.", "depth": 0, "example": {"value": true, "quote": "the department may contract with public agencies and private professional organizations to provide assistance and treatment to persons licensed by the board who abuse alcohol, other drugs, or other su", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "limited_teaching_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute provides for a limited license for optometry faculty or instructors who are not otherwise licensed in the state.", "depth": 0, "example": null}, {"field": "retired_license_status_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute provides for a formal retired license status that exempts the holder from renewal and continuing education requirements.", "depth": 0, "example": {"value": true, "quote": "On retiring from practice and on payment of an appropriate one-time fee, a licensee in good standing with the board may apply for the conversion of an active or inactive license to a retired status li", "citation": "08.72.185"}}, {"field": "jurisprudence_exam_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly requires passage of a state law (jurisprudence) examination as a condition of licensure or endorsement.", "depth": 0, "example": {"value": true, "quote": "an examination approved by the board that is designed to test the applicant's knowledge of the laws of Alaska governing the practice of optometry and the regulations adopted under those laws.", "citation": "08.72.160"}}, {"field": "criminal_background_check_required", "type": "boolean", "vocabulary": [], "meaning" iatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": null}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "to use or publicly display a title in connection with a person's name including \"doctor of medicine,\" \"physician,\" \"M.D.,\" or \"doctor of osteopathic medicine\" or \"D.O.\" or a specialist designation inc", "citation": "08.64.380"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_license"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Secured a license through deceit, fraud, or intentional misrepresentation"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": " rgical treatment of the ankle, often subject to additional qualifications.", "depth": 0, "example": null}, {"field": "ankle_surgery_residency_requirement", "type": "enum", "vocabulary": ["24_month_surgical_residency", "36_month_surgical_residency", "2_year_pre_2007_or_3_year_post_2007", "board_certification_or_qualification_required", "hospital_credentialing_required", "board_certification_by_ABFAS"], "meaning": "The specific residency length or certification required for a podiatrist to perform ankle surgery.", "depth": 0, "example": null}, {"field": "ankle_surgery_facility_requirement", "type": "enum", "vocabulary": ["licensed_hospital_only", "hospital_or_ambulatory_surgical_center", "accredited_hospital_or_ASC", "JCAHO_accredited_facility", "multispecialty_ambulatory_surgical_facility"], "meaning": "The type of facility in which ankle surgery must be performed by a podiatrist.", "depth": 0, "example": null}, {"field": "systemic_disease_treatment_excluded", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly excludes treatment of systemic diseases from the podiatric scope of practice, except as manifested in the foot.", "depth": 0, "example": {"value": true, "quote": "a patient shall be concurrently referred to a physician or osteopath for the treatment of the systemic disease itself", "citation": "08.64.380"}}, {"field": "systemic_disease_local_manifestations_included", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly includes treatment of local manifestations of systemic diseases as they appear on the foot or ankle.", "depth": 0, "example": {"value": true, "quote": "the treatment of the local manifestations of systemic diseases as they appear in the hand and foot", "citation": "08.64.380"}}, {"field": "board_certification_body", "type": "list", "vocabulary": [], "meaning": "The recognized certifying body or bodies for advanced podiatric surgery, particularly for ankle surgery privileges.", "depth": 0, "examp ient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.64.363"}}, {"field": "controlled_substances_prescribing_ce_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires continuing education specifically related to controlled substances prescribing as part of license renewal.", "depth": 0, "example": {"value": true, "quote": "Continuing education requirements must include not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.64.312"}}, {"field": "ankle_surgery_board_certification_timeline", "type": "string", "vocabulary": [], "meaning": "The time period within which a podiatrist who qualifies for ankle surgery must obtain board certification, where specified by statute.", "depth": 0, "example": null}, {"field": "total_ankle_replacement_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly addresses or authorizes total ankle replacement surgery by podiatrists.", "depth": 0, "example": null}, {"field": "tibial_pilon_fracture_excluded", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly excludes treatment of tibial pilon fractures from the podiatric scope of practice.", "depth": 0, "example": null}, {"field": "wound_debridement_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly authorizes podiatrists to perform wound debridement beyond the foot and ankle.", "depth": 0, "example": null}, {"field": "vaccination_authority", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly authorizes podiatrists to administer vaccinations.", "depth": 0, "example": null}, {"field": "physician_assistant_collaboration_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly authorizes podiatrists to collaborate with or supervise physician assistants.", "depth": 0, "example": null}, {"field": "advanced_practice_nurse_collaboration_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly authorizes podiatrists to collaborate with advanced practice registered nurses.", "depth": 0, "example": null}, {"field": "hospital_privileges_nondiscrimination", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has a statutory provision prohibiting hospitals from discriminating against podiatrists in granting privileges based solely on their degree type.", "depth": 0, "example": null}, {"field": "corrective_footwear_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly exempts the fitting, recommending, or sale of corrective shoes, arch supports, or similar appliances by retail dealers from the podiatry licensing requirement.", "depth": 0, "example": null}, {"field": "clubfoot_surgery_restriction", "type": "boolean", "vocabulary": [], "meaning": "Whether the state explicitly restricts or excludes surgical correction of clubfoot from the podiatric scope of practice.", "depth": 0, "example": null}, {"field": "ankle_surgery_standard_of_care_reference", "type": "boolean", "vocabulary": [], "meaning": "Whether the state statute explicitly requires podiatrists performing ankle surgery to meet the same standard of care as orthopedic surgeons.", "depth": 0, "example": null}, {"field": "impaired_practitioner_program", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has a statutory provision for a podiatrist health or rehabilitation program for impaired practitioners.", "depth": 0, "example": {"value": true, "quote": "under regulations adopted by the board, contract with private professional organizations to establish an impaired medical professionals program to identify, confront, evaluate, and treat persons licen", "citation": "08.64.101"}}, {"field": "electronic_prescribing_required", "type": "boolean", "vocabulary"
