n, training, and experience equivalents.", "depth": 0, "example": null}, {"field": "unauthorized_practice_criminal_penalty_first_offense", "type": "string", "vocabulary": [], "meaning": "The criminal classification and maximum penalty for a first offense of unauthorized practice of architecture.", "depth": 0, "example": {"value": "Misdemeanor; fine not more than $10,000, or imprisonment not more than one year, or both", "quote": "is guilty of a misdemeanor and upon conviction is punishable by a fine of not more than $10,000, or by imprisonment for not more than one year, or by both.", "citation": "08.48.291"}}, {"field": "unauthorized_practice_criminal_penalty_subsequent_offense", "type": "string", "vocabulary": [], "meaning": "The criminal classification and penalty range for a second or subsequent offense of unauthorized practice of architecture.", "depth": 0, "example": null}, {"field": "civil_penalty_maximum", "type": "integer", "vocabulary": [], "meaning": "Maximum civil penalty in dollars the board may levy on a current licensee or unauthorized practitioner for violations.", "depth": 0, "example": {"value": 5000, "quote": "A civil penalty levied under this section may not exceed $5,000 for each offense.", "citation": "08.48.295"}}]}], "example_state": "AK"}, "construction_trades": {"profession": "construction_trades", "data_as_of": "2026-06-24", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development, unless the context indicates otherwise", "citation": "08.18.171"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development, unless the context indicates otherwise", "citation": "08.18.171"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "department", "quote": "\"commissioner,\" unless the text reads otherwise, means the commissioner of the Department of Commerce, Community, and Economic Development", "citation": "08.18.171"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't er that national body currently requires.", "depth": 1, "example": null}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": null}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": null}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Residential Contractor Examination"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Required for residential contractor endorsement; offered at least once each year in each judicial district; may be written or practical."}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (department)"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": null}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A certificate of registration as a home inspector may not be renewed unless the home inspector has complied with the continuing competency requirements established by the department. The department sh", "citation": "08.18.031"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 8, "quote": "The department shall require at least eight hours of continuing competency activity for each licensing period.", "citation": "08.18.031"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": null}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A board established under this title and the department, with respect to an occupation that it regulates under this title, may by regulation establish criteria for issuing a temporary courtesy license", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Temporary courtesy licenses may be issued to nonresidents by regulation; military courtesy licenses available to active duty members and spouses who hold a current license in another state with substantially equivalent requirements.", "quote": "the department shall issue a temporary courtesy license to an active duty member of the armed forces of the United States or the spouse of an active duty member of the armed forces of the United State", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "\"department\" means the Department of Commerce, Community, and Economic Development, unless the context indicates otherwise", "citation": "08.18.171"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": null}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Society of Home Inspectors; National Association of Home Inspectors; International Code Council", "quote": "the examination offered by the American Society of Home Inspectors or National Association of Home Inspectors; (B) new homes or for a joint registration is the examination offered by the International", "citation": "08.18.022"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "registration", "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "registration", "quote": "the commissioner shall issue to the applicant a certificate of registration upon compliance with the registration requirements of this chapter.", "citation": "08.18.031"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "Individuals who are exempt from registration under AS 08.18.156(a) or whose actions are not considered to be home inspections under AS 08.18.156(b) may not hold themselves out to be registered home in", "citation": "08.18.053"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not submit a bid or work as a contractor until that person has been issued a certificate of registration as a contractor by the department.", "citation": "08.18.011"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraudulent_or_misleading_application"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Application for endorsement or home inspector registration is fraudulent or misleading."}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": true, "quote": "each applicant shall, at the time of applying for a certificate of registration, file with the commissioner a surety bond running to the state", "citation": "08.18.071"}}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "Each suit of an independent business, undertakes or offers to perform, or claims to have the capacity to perform, or submits a bid for a project to construct, alt", "citation": "08.18.171"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["construct", "alter", "repair", "move", "demolish", "excavation and site development", "erection of scaffolding"], "quote": "undertakes or offers to perform, or claims to have the capacity to perform, or submits a bid for a project to construct, alter, repair, move, or demolish a building, highway, road, railroad, or any ty", "citation": "08.18.171"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.18.171"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "definitions"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "registration_number_required_in_ads", "type": "boolean", "vocabulary": [], "meaning": "Whether the contractor's registration number must appear in all advertisements, contracts, estimates, and proposals.", "depth": 0, "example": {"value": true, "quote": "Advertising and contracts must also include the contractor's registration number.", "citation": "08.18.051"}}, {"field": "insurance_personal_injury_minimum_usd", "type": "integer", "vocabulary": [], "meaning": "Minimum dollar amount of liability insurance covering personal injury that a contractor must maintain.", "depth": 0, "example": {"value": 50000, "quote": "$50,000 for injury, including death, to any one person, and $100,000 for injury, including death, to more than one person", "citation": "08.18.101"}}, {"field": "insurance_property_damage_minimum_usd", "type": "integer", "vocabulary": [], "meaning": "Minimum dollar amount of insurance covering property damage caused by the contractor's work.", "depth": 0, "example": {"value": 20000, "quote": "public liability and property damage insurance covering the applicant's contracting operations in this state in the sum of not less than $20,000 for damage to property", "citation": "08.18.101"}}, {"field": "self_insurance_permitted", "type": "boolean", "vocabulary": [], "meaning": "Whether a contractor may satisfy insurance requirements by attesting to being self-insured rather than carrying a third-party policy.", "depth": 0, "example": {"value": true, "quote": "a valid workers' compensation self-insurance certificate issued by the Alaska Workers' Compensation Board", "citation": "08.18.101"}}, {"field": "contract_must_be_written", "type": "boolean", "vocabulary": [], "meaning": "Whether a home improvement contract must be in writing to be valid and enforceable against the owner.", "depth": 0, "example": null}, {"field": "right_of_rescission_days", "type": "integer", "vocabulary": [], "meaning": "Number of business days within which an owner may rescind a signed home improvement contract without penalty.", "depth": 0, "example": null}, {"field": "deposit_cap_fraction", "type": "string", "vocabulary": [], "meaning": "Maximum fraction of the total contract price a contractor may collect as a deposit before work begins, for contracts above a threshold amount.", "depth": 0, "example": null}, {"field": "deposit_cap_contract_threshold_usd", "type": "integer", "vocabulary": [], "meaning": "Minimum contract price above which the deposit cap rule applies.", "depth": 0, "example": null}, {"field": "change_order_must_be_written", "type": "boolean", "vocabulary": [], "meaning": "Whether any deviation from the original plans or specifications requires a written change order signed by both parties.", "depth": 0, "example": null}, {"field": "arbitration_clause_allowed", "type": "boolean", "vocabulary": [], "meaning": "Whether a home improvement contract may include an arbitration clause, subject to specific formatting and disclosure requirements.", "depth": 0, "example": null}, {"field": "voidable_contract_clauses", "type": "list", "vocabulary": [], "meaning": "List of clause types that, if included in a home improvement contract, make the contract voidable by the owner.", "depth": 0, "example": null}, {"field": "minimum_annual_revenue_threshold_usd", "type": "integer", "vocabulary": [], "meaning": "Minimum total cash value of home improvements in the prior taxable year below which a person is exempt from contractor registration.", "depth": 0, "example": null}, {"field": "minimum_project_value_usd", "type": "integer", "vocabulary": [], "meaning": "Minimum cash price of a single project for the work to qualify as a regulated home improvement requiring a registered contractor.", "depth": 0, "example": null}, {"field": "fraud_offense_defined", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute defines a specific criminal offense of home improvement fraud with enumerated prohibited acts.", "depth": 0, "example": null}, {"field": "fraud_felony_threshold_usd", "type": "integer", "vocabulary": [], "meaning": "Dollar amount above which a home improvement fraud violation is graded as a felony rather than a misdemeanor.", "depth": 0, "example": null}, {"field": "enhanced_penalty_for_elderly_victims", "type": "boolean", "vocabulary": [], "meaning": "Whether the grading of a fraud offense is elevated by one level when the victim is 60 years of age or older.", "depth": 0, "example": null}, {"field": "state_preempts_local_registration_fees", "type": "boolean", "vocabulary": [], "meaning": "Whether state registration preempts local governments from imposing their own contractor registration fees or licensing requirements.", "depth": 0, "example": null}, {"field": "local_trade_licensing_preserved", "type": "boolean", "vocabulary": [], "meaning": "Whether existing local licensing standards for specific trades (e.g., electricians, plumbers) are preserved notwithstanding state preemption.", "depth": 0, "example": null}, {"field": "registration_renewal_interval_years", "type": "integer", "vocabulary": [], "meaning": "How often, in years, a contractor must renew their registration with the issuing authority.", "depth": 0, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "out_of_state_disciplinary_action_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a contractor must report to the state any disciplinary action taken against them in another jurisdiction.", "depth": 0, "example": null}]}], "example_state": "AK"}, "dentistry": {"profession": "dentistry", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Dental Examiners", "quote": "\"board\" means the Board of Dental Examiners", "citation": "08.36.370"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Dental Examiners", "quote": "\"board\" means the Board of Dental Examiners", "citation": "08.36.370"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "shared_board", "quote": "There is created the Board of Dental Examiners consisting of nine members. Six members shall be licensed dentists ... two members shall be dental hygienists licensed under AS 08.32 ... and one member ", "citation": "08.36.010"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.36.370"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "has not been convicted of a crime that adversely reflects on the applicant's ability or competency to practice dentistry or that jeopardizes the safety or well-being of a patient", "citation": "08.36.110"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Graduate of a board-approved dental school", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "doctorate", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "embedded_in_credential", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": null}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": null}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Written examination approved by the board"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Must pass written examination approved by the board"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (board-approved)"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": null}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "adopt regulations ensuring that renewal of a license, registration, or certificate under this chapter or a license, certificate, or endorsement under AS 08.32 is contingent on proof of continued profe", "citation": "08.36.070"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "the regulations must require that a licensee receive not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a lic", "citation": "08.36.070"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.36.070"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction"], "quote": "not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.36.070"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may waive the examination requirement and license by credentials if the dentist applicant meets the requirements of AS 08.36.110, submits proof of continued competence as required by regulat", "citation": "08.36.234"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Must meet qualifications under AS 08.36.110, submit proof of continued competence, pay required fee, hold an active license from another state or territory issued after thorough examination (or pass an exam specified by the board), and be interviewed in person by the board.", "quote": "The board may waive the examination requirement and license by credentials if the dentist applicant meets the requirements of AS 08.36.110, submits proof of continued competence as required by regulat", "citation": "08.36.234"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the Board of Dental Examiners consisting of nine members. Six members shall be licensed dentists who have been engaged in the practice of dentistry in the state for five years immedia", "citation": "08.36.010"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": null}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Association of Dental Boards", "quote": "affiliate with the American Association of Dental Boards and pay annual dues to the association", "citation": "08.36.070"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to each successful dentist applicant who has paid the required fees.", "citation": "08.36.240"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "uses the words \"dentist\" or \"dental surgeon\" or the letters \"D.D.S.\" or \"D.M.D.\" or other letter or title that represents the dentist as engaging in the practice of dentistry", "citation": "08.36.360"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_to_obtain_license"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Used or knowingly cooperated in deceit, fraud, or intentional misrepresentation to obtain a license"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": null}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": null}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.36.010"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "board composition"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "A person engages in the practice of dentistry who (1) performs or holds out to the public as being able to perform dental operations; (2) diagnoses, treats, operates on, corrects, attempts to correct, or prescribes for a disease, lesion, pain, injury, deficiency, deformity, or physical condition, malocclusion or malposition of the human teeth, alveolar process, gingiva, maxilla, mandible, or adjacent tissues; (3) performs or attempts to perform an operation incident to the replacement of teeth; (4) furnishes, supplies, constructs, reproduces, or repairs dentures, bridges, appliances or other structures to be used and worn as substitutes for natural teeth...", "quote": "A person engages in the practice of dentistry who (1) performs or holds out to the public as being able to perform dental operations; (2) diagnoses, treats, operates on, corrects, attempts to correct,", "citation": "08.36.360"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["diagnosis", "treatment", "operative procedures", "surgical procedures", "prescribing", "dental operations", "replacement of teeth", "fabrication/repair of dental appliances", "evaluation and preventive procedures for oral cavity and maxillofacial area"], "quote": "diagnoses, treats, operates on, corrects, attempts to correct, or prescribes for a disease, lesion, pain, injury, deficiency, deformity, or physical condition, malocclusion or malposition of the human", "citation": "08.36.360"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": {"value": "Dentists may prescribe drugs as part of the practice of dentistry; opioid prescriptions are limited to a seven-day supply for initial prescriptions for adult outpatients and for any prescription to minors, with exceptions for chronic pain and access barriers. Dentists holding a DEA registration number must register with the controlled substance prescription database.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.36.355"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.36.360"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "practice of dentistry defined"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "sedation_anesthesia_permit_types", "type": "list", "vocabulary": [], "meaning": "The distinct categories of sedation and anesthesia permits a dentist may obtain beyond basic local anesthesia, each requiring separate training and board approval.", "depth": 0, "example": null}, {"field": "sedation_permit_onsite_inspection_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the board may require an on-site inspection of the facility, equipment, and personnel before issuing or renewing a sedation or anesthesia permit.", "depth": 0, "example": null}, {"field": "sedation_adverse_event_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees are required to report deaths, injuries, or other adverse events resulting from sedation or anesthesia to the board within a specified timeframe.", "depth": 0, "example": null}, {"field": "pediatric_sedation_endorsement_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a separate pediatric endorsement on a sedation or anesthesia permit is required before administering sedation to patients below a specified age threshold.", "depth": 0, "example": null}, {"field": "specialist_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a separate specialist license or certificate allowing a dentist to hold themselves out to the public as a specialist in a recognized branch of dentistry.", "depth": 0, "example": {"value": true, "quote": "A licensed dentist may not represent to the public to be qualified in a specialized branch of dentistry through any means of public advertising using the term \"specialist,\" the name of a specialty, or", "citation": "08.36.242"}}, {"field": "specialty_practice_scope_restriction", "type": "boolean", "vocabulary": [], "meaning": "Whether a dentist who obtains a specialist license is restricted to practicing only within that specialty branch.", "depth": 0, "example": {"value": true, "quote": "The practice of a dentist who obtains a specialist license under (a) of this section is limited to the branch of dentistry in which the dentist holds a specialist license.", "citation": "08.36.243"}}, {"field": "specialty_advertising_disclaimer_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists who advertise a practice emphasis in an area not recognized as a specialty by the board must include a specific statutory disclaimer in their advertising.", "depth": 0, "example": null}, {"field": "dental_hygienist_supervision_levels", "type": "list", "vocabulary": [], "meaning": "The defined levels of dentist supervision under which dental hygienists may perform procedures, as enumerated in statute.", "depth": 0, "example": {"value": ["direct supervision", "indirect supervision", "general supervision"], "quote": "\"direct supervision\" means the dentist is in the dental office, personally diagnoses the condition to be treated, personally authorizes the procedure, and before dismissal of the patient evaluates the", "citation": "08.32.190"}}, {"field": "collaborative_agreement_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state authorizes a formal written collaborative agreement between a dentist and a dental hygienist that allows the hygienist to provide specified services without the dentist's physical presence.", "depth": 0, "example": {"value": true, "quote": "a licensed dental hygienist with a minimum of 4,000 documented hours of clinical experience within the five years preceding application for the board's approval may enter into a collaborative agreemen", "citation": "08.32.115"}}, {"field": "collaborative_agreement_max_hygienists_per_dentist", "type": "integer", "vocabulary": [], "meaning": "The maximum number of collaborative or affiliated practice agreements a single dentist may hold simultaneously with dental hygienists.", "depth": 0, "example": {"value": 5, "quote": "the board may not approve more than five collaborative agreements with a licensed dentist, not including any collaborative agreements that have been terminated", "citation": "08.32.115"}}, {"field": "advanced_practice_permit_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues an advanced practice permit or equivalent credential allowing a dental hygienist to provide services to underserved populations without a dentist's physical presence or prior examination.", "depth": 0, "example": {"value": true, "quote": "The board may issue an advanced practice permit to a licensed dental hygienist with a minimum of 4,000 documented hours of clinical experience.", "citation": "08.32.125"}}, {"field": "advanced_practice_eligible_patient_populations", "type": "list", "vocabulary": [], "meaning": "The specific patient populations or settings for which an advanced practice or affiliated practice dental hygienist may provide services without direct dentist supervision.", "depth": 0, "example": {"value": ["residents in a senior center, including hospital, long-term care facility, adult foster home, residential care facility, or adult congregate living facility", "residents in a health care facility, including mental health residential program or facility for individuals with developmental or other disabilities", "persons held in a local correctional facility for juveniles or adults", "persons enrolled in a nursery school, day care program, vocational training facility, primary school, secondary school, private school, or public charter school", "persons entitled to benefits under WIC program", "homebound persons", "residents of a dental health professional shortage area"], "quote": "A licensed dental hygienist holding an advanced practice permit may provide the services described in (a) of this section to a patient who is unable to access dental treatment because of age, infirmit", "citation": "08.32.125"}}, {"field": "dental_therapist_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state licenses dental therapists as a distinct mid-level dental provider category with its own scope of practice.", "depth": 0, "example": null}, {"field": "dental_therapist_collaborative_practice_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a dental therapist must operate under a written collaborative practice agreement with a supervising dentist in order to practice independently of direct supervision.", "depth": 0, "example": null}, {"field": "dental_therapist_practice_setting_restrictions", "type": "list", "vocabulary": [], "meaning": "The specific practice settings or facility types in which a dental therapist is authorized to practice.", "depth": 0, "example": null}, {"field": "mobile_dental_facility_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether operators of mobile dental facilities or portable dental units must register with the state dental board and comply with specific operational requirements.", "depth": 0, "example": null}, {"field": "mobile_facility_followup_care_protocol_required", "type": "boolean", "vocabulary": [], "meaning": "Whether operators of mobile dental facilities are required to maintain a written protocol for emergency follow-up care for patients treated at the mobile facility.", "depth": 0, "example": null}, {"field": "dental_office_ownership_restrictions", "type": "boolean", "vocabulary": [], "meaning": "Whether the state restricts ownership or operation of dental offices to licensed dentists or specified entities, prohibiting non-dentist corporate ownership.", "depth": 0, "example": {"value": true, "quote": "Only a person who holds a valid license issued under this chapter may own, operate, or maintain a dental practice, office, or clinic.", "citation": "08.36.367"}}, {"field": "opioid_prescribing_limits", "type": "boolean", "vocabulary": [], "meaning": "Whether the state imposes statutory limits on the quantity or duration of opioid prescriptions that a dentist may issue.", "depth": 0, "example": {"value": true, "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.36.355"}}, {"field": "controlled_substance_database_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists who hold a DEA registration number are required to register with or use the state's controlled substance prescription monitoring database.", "depth": 0, "example": {"value": true, "quote": "require that a licensed dentist who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 17.30.200(n)", "citation": "08.36.070"}}, {"field": "dental_laboratory_work_authorization_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists must provide a written work authorization or prescription to dental laboratories when ordering prosthetic or orthodontic appliances, with specified content requirements.", "depth": 0, "example": null}, {"field": "denture_patient_identification_marking_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists are required to have complete dentures permanently marked with the patient's name or initials during fabrication for identification purposes.", "depth": 0, "example": null}, {"field": "teledentistry_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state expressly authorizes or defines teledentistry as a permitted mode of delivering dental services.", "depth": 0, "example": null}, {"field": "hygienist_local_anesthesia_certification_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dental hygienists must obtain a separate board-issued certificate or permit before they are authorized to administer local anesthesia.", "depth": 0, "example": {"value": true, "quote": "if certified by the board, administer local anesthetic agents", "citation": "08.32.110"}}, {"field": "hygienist_nitrous_oxide_certification_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dental hygienists must obtain a separate board-issued certificate or permit before they are authorized to administer nitrous oxide analgesia.", "depth": 0, "example": {"value": true, "quote": "if certified by the board and under the direct or indirect supervision of a licensed dentist, administer and monitor nitrous oxide-oxygen conscious sedation.", "citation": "08.32.110"}}, {"field": "restorative_function_endorsement_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a restorative function endorsement or certificate allowing a dental hygienist or dental assistant to place and finish direct restorations prepared by a dentist.", "depth": 0, "example": {"value": true, "quote": "The board shall issue a restorative function endorsement to a licensed dental hygienist if the licensee furnishes evidence satisfactory to the board", "citation": "08.32.085"}}, {"field": "interim_therapeutic_restoration_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state expressly authorizes dental hygienists or dental assistants in extended functions to place interim therapeutic restorations using hand instrumentation only.", "depth": 0, "example": null}, {"field": "patient_record_retention_years", "type": "integer", "vocabulary": [], "meaning": "The minimum number of years a licensee is required to retain patient dental records after the last date of service.", "depth": 0, "example": {"value": 7, "quote": "failed to maintain a patient or facility record for at least seven years after the date the record was created", "citation": "08.36.315"}}, {"field": "cpr_certification_required_for_sedation", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists and auxiliary personnel involved in sedation procedures are required to maintain current certification in basic or advanced cardiac life support.", "depth": 0, "example": null}, {"field": "dental_hygienist_alternative_practice_license", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a distinct 'alternative practice' or equivalent license category allowing dental hygienists to practice independently in specified community or public health settings without a supervising dentist on-site.", "depth": 0, "example": {"value": true, "quote": "The board may issue an advanced practice permit to a licensed dental hygienist with a minimum of 4,000 documented hours of clinical experience. A licensed dental hygienist holding an advanced practice", "citation": "08.32.125"}}]}], "example_state": "AK"}, "dietetics": {"profession": "dietetics", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "An individual may not, unless licensed as a dietitian or nutritionist by the department, use the title \"dietitian,\" \"licensed dietitian,\" \"nutritionist,\" \"licensed nutritionist,\" or an occupational ti", "citation": "08.38.010"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.38.100"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.38.100"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "department", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.38.100"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": null}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": null}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "master's or doctoral degree from an accredited college or university with a major in human nutrition, public health nutrition, clinical nutrition, nutrition education, community nutrition, or food and nutrition", "quote": "has received a master's or doctoral degree from an accredited college or university with a major in human nutrition, public health nutrition, clinical nutrition, nutrition education, community nutriti", "citation": "08.38.030"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education", "quote": "accredited by the regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education at the time the degree was conferred", "citation": "08.38.100"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "master", "quote": "has received a master's or doctoral degree from an accredited college or university", "citation": "08.38.030"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "accredited by the regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education at the time the degree was conferred", "citation": "08.38.100"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": true, "quote": "submits evidence satisfactory to the department of being certified as a Registered Dietitian by the Commission on Dietetic Registration", "citation": "08.38.020"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "licensed dietitian"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "900 hours", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "documented work experience in human nutrition or human nutrition research", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": null}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value" cluded from this exemption.", "depth": 0, "example": {"value": 5000, "quote": "electrical work, the cost of which does not exceed $5,000, involving residences or small commercial establishments in communities that (A) have a population of under 500 according to the latest availa", "citation": "08.40.190"}}, {"field": "solar_panel_electrical_work_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether electrical work incidental to installing or repairing solar panels is exempt from standard electrician licensure requirements.", "depth": 0, "example": null}, {"field": "hot_tub_sign_electrical_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether electrical work incidental to installing or repairing an above-ground prebuilt hot tub or on-premise signage is exempt from electrician licensure.", "depth": 0, "example": null}, {"field": "utility_worker_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether persons employed by electric utilities, railroads, telephone corporations, or municipal utilities are exempt from electrician licensure for work incidental to those employers' operations.", "depth": 0, "example": {"value": true, "quote": "AS 08.40.005 - 08.40.200 do not apply to any utility or municipality engaged in (1) electrical construction and maintenance of electrical wiring for the generation and distribution of electrical curre", "citation": "08.40.190"}}, {"field": "financial_responsibility_bond_option", "type": "boolean", "vocabulary": [], "meaning": "Whether an electrical contractor applicant may satisfy the financial responsibility requirement by submitting a surety bond as an alternative to completing a financial questionnaire.", "depth": 0, "example": null}, {"field": "workers_compensation_insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Whether proof of workers' compensation insurance covering employees is required before the division will issue an electrical contractor license.", "depth": 0, "e
