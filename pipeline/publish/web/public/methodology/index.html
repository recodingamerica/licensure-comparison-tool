ineering": {"profession": "professional_engineering", "data_as_of": "2026-06-25", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "State Board of Registration for Architects, Engineers, and Land Surveyors", "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "State Board of Registration for Architects, Engineers, and Land Surveyors", "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors.", "citation": "08.48.011"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "shared_board", "quote": "The board consists of two civil engineers, two land surveyors, one mining engineer, one electrical or mechanical engineer, one engineer from another branch of the profession of engineering, two archit", "citation": "08.48.011"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.48.341"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": null}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "An applicant for registration as an architect, engineer, land surveyor, or landscape architect must be of good character and reputation", "citation": "08.48.171"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Evidence of education, training, and experience satisfactory to the board; examination standards must at least meet requirements adopted by recognized national examining councils", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": null}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "unspecified", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "The procedure and standards shall at least meet the requirements adopted by recognized national examining councils for these professions.", "citation": "08.48.181"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": null}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": null}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Professional Engineer Examination"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Examinations held at least once per year; standards must meet requirements adopted by recognized national examining councils; candidates failing may apply for reexamination per board regulations"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (administered by board per national examining council standards)"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": null}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "establishing continuing education requirements for registrants that must be completed before a certificate may be renewed; the requirements may not exceed standards established by a national accrediti", "citation": "08.48.101"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": null}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": null}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A person holding a certificate of registration authorizing the person to practice engineering in a state, territory, or possession of the United States, the District of Columbia, or a foreign country ", "citation": "08.48.191"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must hold a certificate of registration from another US state, territory, possession, DC, or foreign country issued under requirements comparable to Alaska's requirements; application reviewed by executive administrator", "quote": "A person holding a certificate of registration authorizing the person to practice engineering in a state, territory, or possession of the United States, the District of Columbia, or a foreign country ", "citation": "08.48.191"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": null}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": null}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": null}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "An applicant who fulfills the requirements set out by the board shall be awarded a certificate of registration authorizing the holder to offer or perform services or work for the public", "citation": "08.48.211"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state", "citation": "08.48.281"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "use in connection with the person's name or otherwise assume or advertise a title or description tending to convey the impression that the person is an architect, an engineer, a land surveyor, or a la", "citation": "08.48.281"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state", "citation": "08.48.281"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_certificate"}}, {"field": "disciplinary_grounds[].description", "type": ion)"], "quote": "professional service or creative work, the adequate performance of which requires the specialized knowledge of applied mathematics and sciences, dealing with the design of structures, machines, equipm", "citation": "08.48.341"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.48.341"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": null}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "covers_land_surveying", "type": "boolean", "vocabulary": [], "meaning": "Whether the same statute and licensing board also governs professional land surveyors.", "depth": 0, "example": {"value": true, "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors.", "citation": "08.48.011"}}, {"field": "covers_geology", "type": "boolean", "vocabulary": [], "meaning": "Whether the same statute and licensing board also governs professional geologists.", "depth": 0, "example": {"value": false, "quote": "regulation of professional geologists under AS 08.02.060", "citation": "UMBRELLA / Chapter 01. Centralized Licensing"}}, {"field": "engineer_intern_certificate_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a formal intermediate certificate (engineer intern or engineer-in-training) to candidates who pass the fundamentals exam but have not yet completed experience requirements.", "depth": 0, "exa red by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "a baccalaureate degree or its equivalent conferred by a college or university acceptable to the board and additional semester hours or post-baccalaureate study so that the total educational program in", "citation": "08.04.120"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "exam tion.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "during the two years immediately preceding the application", "citation": "08.04.425"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": null}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the board may issue a license to engage in the practice of public accounting to an applicant who holds a license, or its equivalent, issued by another state", "citation": "08.04.195"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must have passed the Uniform CPA Examination, meet board-established accounting experience requirements, not be subject to pending disciplinary proceedings in another state, and be of good moral character.", "quote": "passed the Uniform Certified Public Accountant Examination of the American Institute of Certified Public Accountants in order to receive the applicant's initial license from the other state; meets the", "citation": "08.04.195"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False  / etc).", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to engage in the practice of public accounting to an individual who meets the requirements of AS 08.04.110 - 08.04.130.", "citation": "08.04.105"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to engage in the practice of public accounting to an individual who meets the requirements of AS 08.04.110 - 08.04.130.", "citation": "08.04.105"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "Only a person who holds a valid license, practice privilege, or permit may issue a report on behalf of another person or governmental unit.", "citation": "08.04.505"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "An individual may not assume or use the title or designation \"certified public accountant\" or the abbreviation \"CPA\" or any other title, designation, word, letter, abbreviation, sign, card, or device ", "citation": "08.04.500"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "Only a person who holds a valid license, practice privilege, or permit may issue a report on behalf of another person or governmental unit.", "citation": "08.04.505"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_license"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Fraud or deceit in obtaining a license or permit required by this chapter."}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": null}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": null}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the itation": "08.04.680"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["preparing financial statements", "issuing reports", "furnishing management services", "furnishing financial advisory services", "providing consulting services", "preparing tax returns", "advising on tax matters", "consulting on tax matters"], "quote": "\"accounting or auditing skills\" includes preparing financial statements, issuing reports, furnishing management services, furnishing financial advisory services, providing consulting services, prepari", "citation": "08.04.680"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.04.680"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "definition of practice of public accounting"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "attest_services_types", "type": "list", "vocabulary": [], "meaning": "Enumerated types of attest services that constitute the regulated scope of practice, typically defined by reference to AICPA/PCAOB standards.", "depth": 0, "example": {"value": ["audit or other engagement under Statements on Auditing Standards", "review of financial statement under Statements on Standards for Accounting and Review Services", "examination of prospective financial information under Statements on Standards f lent qualifications may practice in the state without providing notice, paying a fee, or making any submission to the board.", "depth": 0, "example": {"value": true, "quote": "An individual who may engage in the practice of public accounting in this state under (a) of this section is not required to provide a notice to the board, to pay a fee to the board, or to submit docu", "citation": "08.04.420"}}, {"field": "practice_privilege_consent_conditions", "type": "list", "vocabulary": [], "meaning": "Conditions to which an out-of-state CPA exercising practice privileges must consent, including board jurisdiction, compliance with state law, cessation if license lapses, and appointment of home-state board as agent for service of process.", "depth": 0, "example": {"value": ["consent to the personal and subject matter jurisdiction and disciplinary authority of the board", "agree to comply with this chapter, including the regulations adopted by the board", "agree that the individual or firm will stop offering to engage or engaging in the practice of public accounting if the license from the state of the individual's or firm's principal place of business becomes invalid", "consent to the appointment of the state board that issued the individual's license as the individual's or firm's agent for service of process"], "quote": "consent to the personal and subject matter jurisdiction and disciplinary authority of the board; agree to comply with this chapter, including the regulations adopted by the board; agree that the indiv", "citation": "08.04.422"}}, {"field": "attest_services_require_firm_permit", "type": "boolean", "vocabulary": [], "meaning": "Whether individuals with practice privileges or individual licensees must perform certain attest services (audits, PCAOB engagements) only through a firm holding a valid permit.", "depth": 0, "example": {"value": true, "quote": "An individual licensed under AS 08.04.105 may not perform attest functions through a firm unless the firm holds a valid permit issued under AS 08.04.240.", "citation": "08.04.565"}}, {"field": "firm_majority_cpa_ownership_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a simple majority (more than 50%) of firm ownership in terms of financial interests and voting rights must belong to licensed CPAs.", "depth": 0, "example": {"value": true, "quote": "more than one-half of the ownership of the firm belongs to certified public accountants of this or another state in good standing", "citation": "08.04.240"}}, {"field": "nonlicensee_firm_owners_permitted", "type": "boolean", "vocabulary": [], "meaning": "Whether CPA firms may include owners who are not licensed CPAs, subject to specified conditions.", "depth": 0, "example": {"value": true, "quote": "a firm may include owners who are not certified public accountants if (1) the firm designates a certified public accountant or an individual with practice privileges to be responsible for the proper r", "citation": "08.04.240"}}, {"field": "peer_review_required_for_firm_renewal", "type": "boolean", "vocabulary": [], "meaning": "Whether peer review is required as a condition for renewal of a firm permit or registration.", "depth": 0, "example": {"value": true, "quote": "The board shall, not more frequently than once every three years, require as a condition for renewal of a permit of a firm that the applicant firm undergo a peer review conducted as required by the bo", "citation": "08.04.426"}}, {"field": "peer_review_max_frequency_years", "type": "integer", "vocabulary": [], "meaning": "Maximum frequency (in years) at which peer review may be required for firm permit renewal.", "depth": 0, "example": {"value": 3, "quote": "not more frequently than once every three years, require as a condition for renewal of a permit of a firm that the applicant firm undergo a peer review", "citation": "08.04.426"}}, {"field": "peer_review_records_privileged", "type": "boolean", "vocabulary": [], "meaning": "Whether peer review proceedings, records, and work papers are privileged and not subject to discovery or introduction into evidence in civil or administrative proceedings.", "depth": 0, "example": {"value": true, "quote": "a peer review be performed and the documents be maintained in a manner that is designed to preserve confidentiality", "citation": "08.04.426"}}, {"field": "inactive_license_status_available", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensee who is not engaged in the practice of public accounting may place their license on inactive status, typically with reduced fees and no CPE requirement.", "depth": 0, "example": {"value": true, "quote": "an individual holding a license who is not engaged in the practice of public accounting may maintain the license in good standing by notifying the board that the individual is inactive and paying the ", "citation": "08.04.410"}}, {"field": "retired_license_status_available", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensee may place their license on a retired status, typically with reduced or no fees and no CPE requirement, with restrictions on active practice.", "depth": 0, "example": null}, {"field": "out_of_state_firm_no_office_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether a firm without an office in the state may provide certain services (compilation, review, or non-attest services) without obtaining a firm permit, subject to specified conditions.", "depth": 0, "example": {"value": true, "quote": "The board shall grant a permit to engage in the practice of public accounting to a firm that does not have an office in the state but provides, or offers to provide, attest functions in the state", "citation": "08.04.240"}}, {"field": "office_supervision_by_licensed_cpa_required", "type": "boolean", "vocabulary": [], "meaning": "Whether each office of a firm established in the state for the practice of public accounting must be under the direct supervision of a licensed CPA.", "depth": 0, "example": {"value": true, "quote": "Each office established or maintained in this state for the practice of public accounting shall be under the direct supervision of an individual who holds a license issued under this chapter.", "citation": "08.04.360"}}, {"field": "attest_report_signer_competency_requirement", "type": "boolean", "vocabulary": [], "meaning": "Whether individuals who sign or authorize signing of attest or compilation reports on behalf of a firm must meet specific competency requirements set out in professional standards.", "depth": 0, "example": {"value": true, "quote": "an individual who is a certified public accountant or has a practice privilege, who is responsible for supervising attest functions or compilation services in the firm, and who signs or authorizes ano", "citation": "08.04.240"}}, {"field": "client_confidentiality_privilege", "type": "boolean", "vocabulary": [], "meaning": "Whether communications between a licensee and client are confidential and privileged, with specified exceptions for professional standards, court proceedings, peer review, and ethical investigations.", "depth": 0, "example": {"value": true, "quote": "A license holder, a permit holder, or a practice privilege holder or a partner, an officer, a shareholder, a member, or an employee of a license holder, a permit holder, or a practice privilege holder", "citation": "08.04.662"}}, {"field": "working_papers_ownership_by_licensee", "type": "boolean", "vocabulary": [], "meaning": "Whether working papers, schedules, and memoranda made by a licensee incident to professional services remain the property of the licensee (absent contrary agreement), with restrictions on transfer without client consent.", "depth": 0, "example": {"value": true, "quote": "Statements, records, schedules, working papers, and memoranda made by a certified public accountant or a public accountant incident to or in the course of professional service to a client, except repo", "citati       }
      html += '<tr data-k="' + esc((f.field + ' ' + (f.meaning||'')).toLowerCase()) + '">' +
        '<td style="padding-left:' + (0.5 + pad) + 'rem"><code>' + esc(f.field) + '</code></td>' +
        '<td class="tcol">' + esc(f.type) + vocab + '</td>' +
        '<td>' + esc(f.meaning) + '</td><td>' + exhtml + '</td></tr>';
    });
    html += '</tbody></table>';
  });
  document.getElementById('out').innerHTML = html;
  filter();
}
function filter(){
  var q = qEl.value.toLowerCase();
  document.querySelectorAll('#out tbody tr').forEach(function(tr){
    tr.style.display = (!q || tr.getAttribute('data-k').indexOf(q) > -1) ? '' : 'none';
  });
}
profEl.addEventListener('change', render);
qEl.addEventListener('input', filter);
techEl.addEventListener('change', function(){ document.body.classList.toggle('tech', techEl.checked); });
render();
</script></body></html>
