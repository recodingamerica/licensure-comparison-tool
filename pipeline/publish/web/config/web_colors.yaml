# Single source of truth for color tokens used in the web frontend.
#
# Two color taxonomies live here:
#   1. audience  — the three tiers for who a regulation applies to
#                  (universal / multi / single). Used on /browse trees,
#                  /professions/<X>?view=statutes section badges, etc.
#   2. families  — profession-family palette. Each profession in
#                  pipeline/config/professions.yaml carries a `family_color`
#                  string that matches one of the keys below.
#
# Values are Tailwind hue names so the generated TS can produce
# bg-/text-/border-/dot- class strings without dynamic concatenation
# (Tailwind purge needs literal classes — we emit them in the generated
# `web-colors.ts` module).
#
# Edit this file → run scripts/generate-colors.mjs (also triggered by
# `npm run predev` / `npm run prebuild`) → commits the regenerated TS.

audience:
  universal: purple
  multi: emerald
  single: sky

# Profession family palette. Includes every hue any committed profession
# carries via its `family_color`, plus some headroom for new families.
# Audience hues above appear here too — collision is fine because audience
# dots and profession dots appear in different visual contexts (audience
# badges on section cards; profession dots on per-thing pages and home).
families:
  - emerald
  - sky
  - violet
  - amber
  - slate
  - rose
  - orange
  - teal
  - indigo
  - fuchsia
  - lime

# Labels paired with audience tiers — co-located so any label change goes
# alongside the color change.
audience_labels:
  universal: "Applies to everyone"
  multi: "Shared with multiple professions"
  single: "Profession-specific"

# ---------------------------------------------------------------------------
# Value-based color tokens (concrete colors, NOT Tailwind hue names). These are
# for the places a Tailwind class won't do: SVG map fills and d3 scales need a
# real color value (an SVG `fill` attribute can't take a CSS `var()`), and a few
# HTML surfaces want a per-theme custom property.
#
# generate-colors.mjs emits these to BOTH:
#   - src/lib/web-colors.ts        → COLOR_TOKENS / MAP_PALETTE  (JS values)
#   - src/app/color-tokens.generated.css → :root + .dark custom properties
# so components read one source (var(--x) in CSS, COLOR_TOKENS in JS). Each token
# has a light + dark value; use the same for both when it shouldn't shift.
tokens:
  # Scope-of-practice view (Map tab → Scope): capability presence matrix + maps.
  scope-has:        { light: "#14b8a6", dark: "#2dd4bf" }   # state authorizes the capability
  scope-none:       { light: "#eceff2", dark: "#1b1f26" }   # it doesn't (empty cell)
  scope-focus:      { light: "#d97706", dark: "#f59e0b" }   # focus state (Utah) outline
  scope-focus-weak: { light: "#fdf1e3", dark: "#2a2114" }   # focus column / row tint
  # Field choropleth (Map tab): endpoints of the light→dark continuous ramp, and
  # the fill for a state with no value. Same in both themes today.
  map-no-data:      { light: "#e5e7eb", dark: "#e5e7eb" }
  map-ramp-lo:      { light: "#dbeafe", dark: "#dbeafe" }
  map-ramp-hi:      { light: "#1e3a8a", dark: "#1e3a8a" }

# Ordinal palette cycled for categorical choropleths (Map tab). One list, both
# themes; emitted as MAP_PALETTE in web-colors.ts.
map_palette:
  - "#0ea5e9"
  - "#10b981"
  - "#f59e0b"
  - "#ef4444"
  - "#8b5cf6"
  - "#ec4899"
  - "#14b8a6"
  - "#f97316"
  - "#6366f1"
  - "#84cc16"
  - "#a855f7"
  - "#06b6d4"
