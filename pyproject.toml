[project]
name = "utah-pipeline"
version = "0.1.0"
description = "State professional-licensing statute extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "curl-cffi",
    "playwright",
    "scrapling[fetchers]>=0.4",  # default Justia fetcher; run `scrapling install` for camoufox
    "psycopg[binary]",
    "pyyaml",
    "pydantic",
    "litellm",
    "anthropic",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
