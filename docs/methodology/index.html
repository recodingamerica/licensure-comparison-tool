loor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "doctorate", "state": "AR"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "submit a certificate from a recognized hospital or hospitals certifying that the applicant has satisfactorily performed the duties of resident physician or intern for a period of", "citation": "08.64.200", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "submit a certificate from a recognized hospital or hospitals certifying that the applicant has satisfactorily performed the duties of resident physician or intern for a period of", "citation": "08.64.200", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "one year (pre-1995 graduates) or two years (post-1995 graduates); three years for foreign medical graduates", "quote": "one year if the applicant graduated from medical school before January 1, 1995 ... two years if the applicant graduated from medical school on or after January 1, 1995", "citation": "08.64.200", "state": "AK"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "internship or residency", "quote": "satisfactorily performed the duties of resident physician or intern", "citation": "08.64.200", "state": "AK"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Board examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Board sets subjects; examination may be waived for licensure by credentials under AS 08.64.250", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (in-house)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "AL"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 1151, "quote": "For licenses that expire on or after January 1, 2024, the biennial renewal fee shall be one thousand one hundred fifty-one dollars ($1,151).", "citation": "Section 2435.", "state": "CA"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the board shall promote a high degree of competence in the practice of medicine, osteopathy, and podiatry by requiring every licensee of medicine, osteopathy, and podiatry in the state to fulfill cont", "citation": "08.64.312", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 30, "quote": "the board shall not renew, reinstate, or reactivate a license of a physician unless the physician presents evidence that the physician has completed thirty CME credit hours within the compliance perio", "citation": "12-240-130.5", "state": "CO"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "Before a license may be renewed, the licensee shall submit evidence to the board or its designee that continuing education requirements prescribed by regulations adopted by the board have been met.", "citation": "08.64.312", "state": "AK"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction (not less than two hours in the two years preceding renewal)"], "quote": "Continuing education requirements must include not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.64.312", "state": "AK"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may waive the examination requirement and license by credentials if the physician, osteopath, or podiatry applicant meets the requirements of AS 08.64.200, 08.64.205, or 08.64.209, submits p", "citation": "08.64.250", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must meet education and training requirements, submit proof of continued competence, pay required fee, and hold an active license from another U.S. state/territory or Canadian province/territory, or have passed an examination specified by the board.", "quote": "The board may waive the examination requirement and license by credentials if the physician, osteopath, or podiatry applicant meets the requirements of AS 08.64.200, 08.64.205, or 08.64.209, submits p", "citation": "08.64.250", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board, consisting of five physicians licensed in the state", "citation": "08.64.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "State Board of Medical Examiners", "quote": "prior to exercising its power and authority to issue, revoke, or reinstate licenses, or to promulgate rules and regulations, the Medical Licensure Commission shall receive and consider but not be boun", "citation": "34-24-311", "state": "AL"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "advisory only — the Medical Licensure Commission shall receive and consider but not be bound by the recommendation of the State Board of Medical Examiners", "quote": "the Medical Licensure Commission shall receive and consider but not be bound by the recommendation of the State Board of Medical Examiners", "citation": "34-24-311", "state": "AL"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Board of Examiners for Osteopathic Physicians and Surgeons; National Board of Osteopathic Medical Examiners; American Board of Medical Specialties (for foreign medical graduates)", "quote": "be certified to practice by the National Board of Examiners for Osteopathic Physicians and Surgeons or by the National Board of Osteopathic Medical Examiners", "citation": "08.64.205", "state": "AK"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "Association of American Medical Colleges; American Medical Association; American Osteopathic Association; Accreditation Council for Graduate Medical Education", "quote": "accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "citation": "08.64.200", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "the board or its executive secretary shall grant a license to the applicant to practice medicine in the state", "citation": "08.64.230", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "to use or publicly display a title in connection with a person's name including \"doctor of medicine,\" \"physician,\" \"M.D.,\" or \"doctor of osteopathic medicine\" or \"D.O.\" or a specialist designation inc", "citation": "08.64.380", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_license", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Secured a license through deceit, fraud, or intentional misrepresentation", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": false, "quote": "The board is authorized to promulgate regulations requiring physicians to obtain professional malpractice liability insurance or a suitable bond or other indemnity against liability for professional m", "citation": "Section 2", "state": "MA"}}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "It is unprofessional conduct for a physician and surgeon to fail to provide adequate security by liability insurance, or by participation in an interindemnity trust, for claims by patients arising out", "citation": "2216.2", "state": "CA"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "no physician and surgeon shall perform procedures in an outpatient setting using anesthesia, except local anesthesia or peripheral nerve blocks ... unless the setting is specified in Section 1248.1.", "citation": "Section 2216.", "state": "CA"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.64.010", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "board composition", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "for a fee, donation or other consideration, to diagnose, treat, operate on, prescribe for, or administer to, any human ailment, blemish, deformity, disease, disfigurement, disorder, injury, or other mental or physical condition; or to attempt to perform or represent that a person is authorized to perform any of the acts set out in this subparagraph", "quote": "for a fee, donation or other consideration, to diagnose, treat, operate on, prescribe for, or administer to, any human ailment, blemish, deformity, disease, disfigurement, disorder, injury, or other m", "citation": "08.64.380", "state": "AK"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["diagnose", "treat", "operate on", "prescribe for", "administer to"], "quote": "to diagnose, treat, operate on, prescribe for, or administer to, any human ailment, blemish, deformity, disease, disfigurement, disorder, injury, or other mental or physical condition", "citation": "08.64.380", "state": "AK"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": {"value": "Physicians may prescribe and dispense prescription drugs, including controlled substances, subject to limits on opioid prescriptions (no initial prescription exceeding 7-day supply for adults; no prescription exceeding 7-day supply for minors without documented justification). Prescribing via telehealth permitted with conditions.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.64.363", "state": "AK"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.64.380", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "scope definition", "state": "AK"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "license_status_types", "type": "list", "vocabulary": [], "meaning": "The distinct license status categories a physician may hold beyond a standard active license, such as inactive, retired, volunteer, temporary, or administrative.", "depth": 0, "example": {"value": ["active", "inactive", "retired status", "temporary permit", "locum tenens permit", "residency/internship permit"], "quote": "A licensee who does not practice in the state may hold an inactive license. A person who practices in the state, however infrequently, shall hold an active license.", "citation": "08.64.313", "state": "AK"}}, {"field": "foreign_medical_graduate_requirements", "type": "string", "vocabulary": [], "meaning": "Special additional requirements imposed on graduates of medical schools outside the United States or Canada, such as additional postgraduate training years, ECFMG certification, or separate examination standards.", "depth": 0, "example": {"value": "Foreign medical graduates (graduates of schools not accredited by AAMC/AMA) must meet requirements of AS 08.64.200(a)(3)-(5) and 08.64.255, complete three years of postgraduate training (or alternative board-approved proof of competency), and pass examinations specified by the board.", "quote": "Applicants who are graduates of medical colleges not accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association shall (1) meet ", "citation": "08.64.225", "state": "AK"}}, {"field": "postgraduate_training_years_required", "type": "integer", "vocabulary": [], "meaning": "The minimum number of years of postgraduate internship or residency training required before a license will be issued to a standard domestic medical school graduate.", "depth": 0, "example": {"value": 2, "quote": "two years if the applicant graduated from medical school on or after January 1, 1995", "citation": "08.64.200", "state": "AK"}}, {"field": "pain_management_education_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires applicants or licensees to complete specific education in pain management and opioid use and addiction as a condition of licensure or renewal.", "depth": 0, "example": {"value": true, "quote": "receive education in pain management and opioid use and addiction, unless the applicant has demonstrated to the satisfaction of the board that the applicant does not currently hold a valid federal Dru", "citation": "08.64.200", "state": "AK"}}, {"field": "opioid_prescribing_limits", "type": "string", "vocabulary": [], "meaning": "Statutory limits on the quantity or duration of opioid prescriptions a licensee may issue, including any exceptions for chronic pain, cancer, or palliative care.", "depth": 0, "example": {"value": "Initial prescription for an opioid may not exceed a seven-day supply for adult outpatients; no opioid prescription may exceed seven days for minors. Exceptions exist for acute medical conditions, chronic pain, cancer pain, palliative care, logistical/travel barriers, or treatment of substance abuse/opioid dependence.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.64.363", "state": "AK"}}, {"field": "controlled_substance_database_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees who hold a DEA registration number are required to register with or use the state's prescription drug monitoring program or controlled substance database.", "depth": 0, "example": {"value": true, "quote": "require that a licensee who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 17.30.200(n)", "citation": "08.64.101", "state": "AK"}}, {"field": "pain_management_clinic_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether physicians providing pain management services must obtain a separate registration or license from the board in addition to their standard medical license.", "depth": 0, "example": {"value": true, "quote": "All physicians providing pain management services shall obtain a pain management registration from the board.", "citation": "34-24-604", "state": "AL"}}, {"field": "telehealth_prescribing_rules", "type": "string", "vocabulary": [], "meaning": "Specific statutory conditions under which a physician may prescribe drugs, including controlled substances, to patients seen only via telehealth rather than in person.", "depth": 0, "example": {"value": "Board may not impose disciplinary sanctions on a physician for prescribing a non-controlled prescription drug via telehealth if follow-up care is available and records are sent to primary care provider with patient consent. Prescribing controlled substances via telehealth is also permitted if those conditions and opioid limits are met. Prescribing via internet questionnaire or email without a prior physician-patient relationship is prohibited.", "quote": "The board may not impose disciplinary sanctions on a physician or physician assistant for rendering a diagnosis, providing treatment, or prescribing, dispensing, or administering a prescription drug t", "citation": "08.64.364", "state": "AK"}}, {"field": "telemedicine_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a distinct telemedicine or telehealth license category for out-of-state physicians who wish to treat in-state patients remotely without obtaining a full in-state license.", "depth": 0, "example": {"value": false, "quote": "Physicians who engage in the provision of telehealth medical services to any individual in this state must possess a full and active license to practice medicine or osteopathy issued by the Medical Li", "citation": "34-24-702", "state": "AL"}}, {"field": "interstate_medical_licensure_compact_member", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has enacted the Interstate Medical Licensure Compact, enabling eligible physicians to obtain expedited licenses in multiple member states.", "depth": 0, "example": {"value": true, "quote": "In order to strengthen access to health care, and in recognition of the advances in the delivery of health care, the member states of the Interstate Medical Licensure Compact have allied in common pur", "citation": "34-24-520", "state": "AL"}}, {"field": "physician_assistant_supervision_model", "type": "enum", "vocabulary": ["direct supervision required", "collaborative practice agreement", "job description with board approval", "facility credentialing system"], "meaning": "The statutory model governing how physician assistants must relate to supervising or collaborating physicians, ranging from strict supervision to collaborative practice agreements.", "depth": 0, "example": {"value": "direct supervision required", "quote": "a physician assistant may examine, diagnose, or treat persons under the supervision, control, and responsibility of either a physician licensed under this chapter or a physician exempted from licensin", "citation": "08.64.170", "state": "AK"}}, {"field": "physician_assistant_prescriptive_authority", "type": "string", "vocabulary": [], "meaning": "The scope of prescriptive authority granted to physician assistants, including which drug schedules they may prescribe and any conditions or limitations on that authority.", "depth": 0, "example": {"value": "Physician assistants may prescribe drugs (including controlled substances), subject to board regulations on scope of activities and supervising physician responsibilities; prescribing without physical examination is permitted under the same conditions as for physicians.", "quote": "The board shall adopt regulations regarding the licensure of physician assistants and the medical services that they may perform, including the (1) educational and other qualifications ... (3) scope o", "citation": "08.64.107", "state": "AK"}}, {"field": "max_physician_assistants_per_supervising_physician", "type": "integer", "vocabulary": [], "meaning": "The maximum number of physician assistants or advanced practice registered nurses that a single supervising or delegating physician may oversee at one time under standard practice settings.", "depth": 0, "example": {"value": 2, "quote": "Limit supervision to no more than two (2) graduate registered physicians per supervising physician.", "citation": "17-95-907", "state": "AR"}}, {"field": "malpractice_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees are required by statute to report to the board the outcome of medical malpractice claims or civil actions in which damages are paid on their behalf.", "depth": 0, "example": {"value": true, "quote": "A person licensed under this chapter shall report in writing to the board concerning the outcome of each medical malpractice claim or civil action in which damages have been or are to be paid by or on", "citation": "08.64.345", "state": "AK"}}, {"field": "hospital_privilege_action_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether hospitals are required by statute to report to the medical board when they revoke, suspend, restrict, or refuse to grant hospital privileges to a licensed physician.", "depth": 0, "example": {"value": true, "quote": "A hospital that revokes, suspends, conditions, restricts, or refuses to grant hospital privileges to, or imposes a consultation requirement on, a person licensed to practice medicine or osteopathy in ", "citation": "08.64.336", "state": "AK"}}, {"field": "impaired_physician_program_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the state statute explicitly authorizes or requires the board to establish or contract with a program to identify, evaluate, and rehabilitate physicians impaired by substance use or mental illness.", "depth": 0, "example": {"value": true, "quote": "under regulations adopted by the board, contract with private professional organizations to establish an impaired medical professionals program to identify, confront, evaluate, and treat persons licen", "citation": "08.64.101", "state": "AK"}}, {"field": "compelled_mental_physical_exam_authority", "type": "boolean", "vocabulary": [], "meaning": "Whether the board has statutory authority to order a licensee to submit to a mental or physical examination when there is probable cause to believe the licensee cannot practice safely.", "depth": 0, "example": {"value": true, "quote": "For the purposes of an investigation under this chapter, the board may order a person to whom it has issued a license or permit to submit to a medical or psychiatric examination by a physician or othe", "citation": "08.64.338", "state": "AK"}}, {"field": "administrative_medicine_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a distinct administrative medicine license for physicians who wish to perform management or advisory functions without engaging in direct patient care.", "depth": 0, "example": {"value": true, "quote": "The Board may issue an administrative medicine license to a physician who meets all qualifications for licensure, including payment of a fee set by the Division of Professional Regulation, except that", "citation": "§ 1720. Certification requirements to practice medicine.", "state": "DE"}}, {"field": "locum_tenens_permit_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a specific temporary permit for physicians practicing as locum tenens substitutes for licensed in-state physicians.", "depth": 0, "example": {"value": true, "quote": "A member of the board, its executive secretary, or a person designated by the board to issue temporary permits may grant a temporary permit to a physician or osteopath for the purpose of (1) substitut", "citation": "08.64.275", "state": "AK"}}, {"field": "sexual_misconduct_training_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires physicians or medical school students to complete specific training on professional boundaries and physician sexual misconduct as a condition of licensure or renewal.", "depth": 0, "example": {"value": true, "quote": "On and after January 1, 2022, all physicians shall be required to receive one-time education and training, for a minimum of two hours, regarding professional boundaries and physician sexual misconduct", "citation": "43-34-11", "state": "GA"}}, {"field": "investigational_drug_protection", "type": "boolean", "vocabulary": [], "meaning": "Whether the state statute explicitly protects physicians from disciplinary action for prescribing or administering investigational drugs or unapproved treatments to terminally ill patients who have given informed consent.", "depth": 0, "example": {"value": true, "quote": "A physician may not be subject to disciplinary action by the board for prescribing, dispensing, or administering an investigational drug, biological product, or device, or providing related treatment,", "citation": "08.64.367", "state": "AK"}}]}], "example_state": null}, "nursing": {"profession": "nursing", "data_as_of": "2026-07-18", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Nursing", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Nursing", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "The Department of Commerce, Community, and Economic Development, in consultation with the board, shall employ a licensed registered nurse", "citation": "08.68.111", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 16, "quote": "A person who wishes to practice as a certified nursing assistant or a licensed nursing assistant shall be at least sixteen years of age.", "citation": "32-1645", "state": "AZ"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "An applicant for a license to practice professional nursing as a registered nurse shall submit to the board written evidence of qualification, verified by oath, that such applicant is of good moral ch", "citation": "34-21-21", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Completion of an accredited registered nurse, practical nurse, or advanced practice registered nurse education program", "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "national nursing accrediting body", "quote": "a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "associate", "quote": "one member shall be a registered nurse engaged in nursing education at the associate, baccalaureate, or graduate degree level at an institution that holds national nursing accreditation", "citation": "08.68.010", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "registered nurse", "state": "AK"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "associate", "state": "AK"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": {"value": "1998-10-01", "state": "FL"}}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "the applicant has successfully completed a registered nurse education program accredited by a national nursing accrediting body and approved by the board", "citation": "08.68.170", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "minimum of three full-time equivalent years of practice or 4,600 hours", "quote": "Has completed a transition to practice in California of a minimum of three full-time equivalent years of practice or 4600 hours.", "citation": "2837.103", "state": "CA"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "transition to practice (for nurse practitioners seeking independent practice authority)", "quote": "\"Transition to practice\" means additional clinical experience and mentorship provided to prepare a nurse practitioner to practice independently.", "citation": "2837.101", "state": "CA"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Registered Nursing or Practical Nursing Licensing Examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Applies to RN and LPN applicants", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "national (NCLEX)", "state": "AL"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 1, "state": "IN"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 100, "quote": "The board may impose a renewal fee in an amount not to exceed one hundred dollars ($100).", "citation": "54-1411", "state": "ID"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A license to practice nursing may not be renewed unless the nurse has complied with continuing competence requirements established by the board by regulation.", "citation": "08.68.276", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 20, "quote": "The board shall not require more than twenty (20) hours of continuing education per year", "citation": "17-87-207", "state": "AR"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 1, "quote": "The board shall not require more than twenty (20) hours of continuing education per year", "citation": "17-87-207", "state": "AR"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction (minimum 2 hours, for APRNs with DEA registration numbers)"], "quote": "The regulations must require that a licensee receive not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a lic", "citation": "08.68.276", "state": "AK"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may issue a license by endorsement to practice as a registered, advanced practice registered, or practical nurse, whichever is appropriate, to an applicant who has worked as a nurse within t", "citation": "08.68.200", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must be licensed in another state, meet AK qualifications under AS 08.68.170, and have worked as a nurse within the past five years; or if not worked within five years, must also meet continuing competency requirements or complete a board-approved course of study.", "quote": "The board may issue a license by endorsement to practice as a registered, advanced practice registered, or practical nurse, whichever is appropriate, to an applicant who has worked as a nurse within t", "citation": "08.68.200", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created a Board of Nursing, consisting of seven members appointed by the governor", "citation": "08.68.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Prescriptive Authority Advisory Committee", "quote": "The Prescriptive Authority Advisory Committee is created as an advisory committee to the Arkansas State Board of Nursing", "citation": "17-87-205", "state": "AR"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "advisory — assists the board in implementing provisions regarding prescriptive authority", "quote": "The committee shall assist the board in implementing the provisions of this chapter regarding prescriptive authority", "citation": "17-87-205", "state": "AR"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National certifying body recognized by the Arkansas State Board of Nursing (role-specific, e.g., for CRNA: Council on Accreditation of Nurse Anesthesia Educational Programs)", "quote": "Hold current certification by a national certifying body recognized by the board in the advanced practice registered nurse role and population foci appropriate to educational preparation", "citation": "17-87-302", "state": "AR"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "Alabama State Nurses Association", "quote": "The Governor shall appoint the seven members of the board who are licensed professional nurses, including the one licensed professional nurse who is approved to engage in advanced practice nursing in ", "citation": "34-21-2", "state": "AL"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "practice or offer to practice nursing without a license, unless the person is practicing within the scope of a delegation properly made under AS 08.68.805 or is giving necessary aid to the ill, injure", "citation": "08.68.340", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "use in connection with the person's name a designation that implies that the person is a licensed nurse unless the person is licensed", "citation": "08.68.340", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "practice or offer to practice nursing without a license, unless the person is practicing within the scope of a delegation properly made under AS 08.68.805 or is giving necessary aid to the ill, injure", "citation": "08.68.340", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_license", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Obtained or attempted to obtain a nursing license by fraud or deceit", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": false, "quote": "The board is authorized to promulgate regulations requiring advanced practice nurses to have professional malpractice liability insurance or a suitable bond or other indemnity against liability for pr", "citation": "Section 80b", "state": "MA"}}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "A nurse practitioner practicing under this section shall have professional liability insurance appropriate for the practice setting.", "citation": "2837.103", "state": "CA"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "No person may establish, operate, maintain, or advertise as a nurse agency in the State of Illinois unless the person is licensed under this Act by the Department of Labor.", "citation": "225 ILCS 510/4", "state": "IL"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.68.010", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "board creation", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "practice of registered nursing means the performance for compensation or personal profit of acts of professional service that requires substantial specialized knowledge, judgment, and skill based on the principles of biological, physiological, behavioral, and sociological sciences in assessing and responding to the health needs of individuals, families, or communities", "quote": "\"practice of registered nursing\" means the performance for compensation or personal profit of acts of professional service that requires substantial specialized knowledge, judgment, and skill based on", "citation": "08.68.850", "state": "AK"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["assessment of problems, counseling, and teaching clients to maintain health or prevent illness and in care of ill, injured, or infirm", "administration, supervision, delegation, and evaluation of nursing practice", "teaching others nursing skills", "execution of a medical regimen as prescribed by a person authorized to practice medicine", "performance of acts of medical diagnosis and prescription of medical therapeutic or corrective measures under board regulations (RN)", "acts of medical diagnosis and prescription and dispensing of medical, therapeutic, or corrective measures (APRN)"], "quote": "assessment of problems, counseling, and teaching ... administration, supervision, delegation, and evaluation of nursing practice ... teaching others the skills of nursing ... execution of a medical re", "citation": "08.68.850", "state": "AK"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": {"value": "Advanced practice registered nurses may prescribe and dispense medical, therapeutic, or corrective measures under board regulations, subject to opioid prescribing limits and DEA registration requirements for controlled substances.", "quote": "\"advanced practice registered nurse\" means a registered nurse licensed to practice in the state who, because of specialized education and experience, is certified to perform acts of medical diagnosis ", "citation": "08.68.850", "state": "AK"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.68.850", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "definitions/scope", "state": "AK"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "license_tiers", "type": "list", "vocabulary": [], "meaning": "The distinct license or certification tiers recognized in the state, each with its own scope and requirements.", "depth": 0, "example": {"value": ["licensed practical nurse (LPN)", "registered nurse (RN)", "advanced practice registered nurse (APRN) — including certified registered nurse anesthetist (CRNA), certified clinical nurse specialist (CNS), certified nurse practitioner (CNP), certified nurse midwife (CNM)"], "quote": "A person practicing or offering to practice registered, advanced practice registered, or practical nursing in the state shall submit evidence of qualification to practice and shall be licensed under t", "citation": "08.68.160", "state": "AK"}}, {"field": "aprn_role_categories", "type": "list", "vocabulary": [], "meaning": "The recognized advanced practice registered nurse role categories, each with distinct scope and certification requirements.", "depth": 0, "example": {"value": ["certified registered nurse anesthetist (CRNA)", "certified clinical nurse specialist (CNS)", "certified nurse practitioner (CNP)", "certified nurse midwife (CNM)"], "quote": "requirements for an advanced practice registered nurse to practice as a certified registered nurse anesthetist, certified clinical nurse specialist, certified nurse practitioner, or certified nurse mi", "citation": "08.68.100", "state": "AK"}}, {"field": "lpn_supervision_requirements", "type": "list", "vocabulary": [], "meaning": "The categories of licensed professionals under whose supervision a practical or vocational nurse must work.", "depth": 0, "example": {"value": ["licensed registered nurse", "advanced practice registered nurse", "licensed physician", "licensed physician assistant", "licensed dentist"], "quote": "A practical nurse shall work under the supervision of a licensed registered or advanced practice registered nurse, a licensed physician, a licensed physician assistant, or a licensed dentist.", "citation": "08.68.265", "state": "AK"}}, {"field": "collaborative_practice_agreement_required", "type": "boolean", "vocabulary": [], "meaning": "Whether certain advanced practice nurses (typically NPs and CNMs) must have a written collaborative practice agreement with a physician to practice or prescribe.", "depth": 0, "example": {"value": true, "quote": "Certified registered nurse practitioners and certified nurse midwives are subject to collaborative practice agreements with an Alabama physician.", "citation": "34-21-81", "state": "AL"}}, {"field": "full_independent_practice_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state provides a pathway for certain APRNs to practice fully independently without a physician collaboration or supervision requirement.", "depth": 0, "example": {"value": false, "quote": "No person may practice as a certified registered nurse practitioner or a certified nurse midwife in this state unless that person possesses a certificate of qualification issued by the Board of Nursin", "citation": "34-21-85", "state": "AL"}}, {"field": "full_independent_practice_experience_hours_required", "type": "integer", "vocabulary": [], "meaning": "Number of supervised or collaborative practice hours required before an APRN may qualify for full independent practice authority.", "depth": 0, "example": {"value": 6240, "quote": "Proof of successful completion of six thousand two hundred forty (6,240) hours of practice", "citation": "17-87-314", "state": "AR"}}, {"field": "prescriptive_authority_certificate_required", "type": "boolean", "vocabulary": [], "meaning": "Whether APRNs must obtain a separate board-issued certificate or number to prescribe or furnish drugs, beyond the basic APRN license.", "depth": 0, "example": {"value": true, "quote": "The Board of Nursing shall recognize the educational qualifications and training of advanced practice nurses by the issuance of a certification of qualification to engage in advanced practice nursing.", "citation": "34-21-84", "state": "AL"}}, {"field": "controlled_substance_schedule_authority", "type": "list", "vocabulary": [], "meaning": "The DEA controlled substance schedules that APRNs are authorized to prescribe, which may differ by role or state.", "depth": 0, "example": {"value": ["Schedule III", "Schedule IV", "Schedule V", "Schedule II (opioids, 5-day supply only)", "Schedule II (stimulants, under specified conditions)", "Schedule II (CRNA during perioperative/peri-obstetrical/medical procedure period)"], "quote": "An advanced practice registered nurse's prescriptive authority shall extend only to drugs listed in Schedules III - V and...also extends to drugs listed in Schedule II if: (i) The prescription is for ", "citation": "17-87-310", "state": "AR"}}, {"field": "opioid_prescribing_limits", "type": "string", "vocabulary": [], "meaning": "Statutory limits on opioid prescriptions issued by APRNs, including maximum day-supply and documentation requirements.", "depth": 0, "example": {"value": "An advanced practice registered nurse may not issue an initial prescription for an opioid exceeding a seven-day supply to an adult for outpatient use, or any opioid prescription exceeding seven days to a minor; exceptions exist for chronic pain, cancer, palliative care, or logistical/travel barriers.", "quote": "An advanced practice registered nurse may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid t", "citation": "08.68.705", "state": "AK"}}, {"field": "dea_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether APRNs authorized to prescribe controlled substances must register with the federal DEA.", "depth": 0, "example": {"value": true, "quote": "require that a licensed advanced practice registered nurse who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 1", "citation": "08.68.100", "state": "AK"}}, {"field": "controlled_substance_database_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether APRNs with DEA numbers must register with the state's controlled substance prescription monitoring database.", "depth": 0, "example": {"value": true, "quote": "require that a licensed advanced practice registered nurse who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 1", "citation": "08.68.100", "state": "AK"}}, {"field": "nurse_aide_registry_maintained", "type": "boolean", "vocabulary": [], "meaning": "Whether the state board maintains a registry of certified nurse aides, including disciplinary findings.", "depth": 0, "example": {"value": true, "quote": "The board shall maintain a registry of certified nurse aides.", "citation": "08.68.333", "state": "AK"}}, {"field": "medication_assistant_certification_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has a separate certification category for medication assistants or medication assistive persons who may administer certain medications under nurse supervision.", "depth": 0, "example": {"value": true, "quote": "Adopt and revise rules providing standards including, but not limited to, scope of practice for certified medication assistants and the issuance of certified medication assistant permits by the board ", "citation": "34-21-2", "state": "AL"}}, {"field": "delegation_to_unlicensed_personnel_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether licensed nurses are explicitly authorized by statute to delegate nursing tasks to unlicensed assistive personnel under defined conditions.", "depth": 0, "example": {"value": true, "quote": "A registered, advanced practice registered, or practical nurse licensed under this chapter may delegate nursing duties to other persons, including unlicensed assistive personnel, under regulations ado", "citation": "08.68.805", "state": "AK"}}, {"field": "employer_mandatory_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether employers of nurses are legally required to report to the board when a nurse is discharged, suspended, or resigns under circumstances related to grounds for discipline.", "depth": 0, "example": {"value": true, "quote": "An employer of a nurse licensed under this chapter ... that discharges or suspends a nurse or nurse aide or conditions or restricts the practice of a nurse or nurse aide shall, within seven working da", "citation": "08.68.277", "state": "AK"}}, {"field": "whistleblower_protection_for_delegation_refusal", "type": "boolean", "vocabulary": [], "meaning": "Whether the state provides explicit statutory protection for nurses who refuse to perform improperly delegated tasks.", "depth": 0, "example": {"value": true, "quote": "An employer may not discharge, threaten, or otherwise discriminate against a nurse employed by the employer regarding the nurse's compensation, terms, conditions, location, or privileges of employment", "citation": "08.68.279", "state": "AK"}}, {"field": "nurse_licensure_compact_member", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has enacted the Enhanced Nurse Licensure Compact (eNLC), allowing multistate licensure privileges.", "depth": 0, "example": {"value": true, "quote": "A multistate license to practice registered or licensed practical nursing issued by a home state to a resident in that state shall be recognized by each party state as authorizing a nurse to practice ", "citation": "34-21-122", "state": "AL"}}, {"field": "multistate_license_option_available", "type": "boolean", "vocabulary": [], "meaning": "Whether applicants may choose between a single-state license and a multistate license when applying for licensure.", "depth": 0, "example": {"value": true, "quote": "An applicant for a license to practice professional nursing in Alabama may apply for either a single state license or a multistate license.", "citation": "34-21-21", "state": "AL"}}, {"field": "impaired_nurse_alternative_program_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has a voluntary non-disciplinary alternative or diversion program for nurses impaired by substance use or mental health conditions.", "depth": 0, "example": {"value": true, "quote": "the department may contract with public agencies and private professional organizations to provide assistance and treatment to persons licensed by the board who abuse alcohol, other drugs, or other su", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "rn_death_pronouncement_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether registered nurses are explicitly authorized by statute to make a determination and pronouncement of death under specified conditions.", "depth": 0, "example": {"value": true, "quote": "A registered nurse licensed under this chapter may make a determination and pronouncement of death of a person", "citation": "08.68.700", "state": "AK"}}, {"field": "public_health_nurse_certification_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state has a separate board-issued public health nurse certification with title protection.", "depth": 0, "example": {"value": true, "quote": "No individual shall hold himself or herself out as a public health nurse or use a title which includes the term \"public health nurse\" unless that individual is in possession of a valid California publ", "citation": "Section 2818.", "state": "CA"}}, {"field": "telehealth_prescribing_rules", "type": "string", "vocabulary": [], "meaning": "Statutory rules governing when an APRN may prescribe or treat without a prior in-person physical examination, including telehealth or internet-based restrictions.", "depth": 0, "example": {"value": "An APRN may render a diagnosis, provide treatment, or prescribe/dispense/administer a non-controlled prescription drug without a physical examination if follow-up care is available and records are sent to the primary care provider with patient consent. Controlled substances may also be prescribed under the same conditions. However, an APRN may not prescribe in response to an Internet questionnaire or email to a person without a prior provider-patient relationship.", "quote": "an advanced practice registered nurse may not prescribe, dispense, or administer a prescription drug in response to an Internet questionnaire or electronic mail message to a person with whom the advan", "citation": "08.68.710", "state": "AK"}}, {"field": "nurse_practitioner_transition_to_practice_hours", "type": "integer", "vocabulary": [], "meaning": "Number of supervised or collaborative practice hours a nurse practitioner must complete before qualifying for independent or expanded practice authority.", "depth": 0, "example": {"value": 6240, "quote": "Proof of successful completion of six thousand two hundred forty (6,240) hours of practice", "citation": "17-87-314", "state": "AR"}}, {"field": "crna_physician_supervision_model", "type": "enum", "vocabulary": ["direction and presence required", "direction without required presence", "consultation model", "coordination model"], "meaning": "The statutory model governing the relationship between a CRNA and a physician during anesthesia administration.", "depth": 0, "example": {"value": "coordination model", "quote": "functions under the direction of or in coordination with a physician licensed to practice medicine, a podiatrist, or a dentist, who is immediately available.", "citation": "34-21-81", "state": "AL"}}, {"field": "cnm_out_of_hospital_birth_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether certified nurse midwives are explicitly authorized to attend births in out-of-hospital settings.", "depth": 0, "example": {"value": true, "quote": "For a delivery outside of an accredited facility, the certified nurse midwife shall identify a licensed physician or facility, or both, with which an arrangement has been made for referral and consult", "citation": "17-87-315", "state": "AR"}}, {"field": "aprn_formulary_or_protocol_required", "type": "boolean", "vocabulary": [], "meaning": "Whether APRNs who prescribe must do so pursuant to a board-approved formulary or written protocol specifying permissible drugs.", "depth": 0, "example": {"value": true, "quote": "The drug shall be on the formulary recommended by the joint committee and adopted by the State Board of Medical Examiners and the Board of Nursing.", "citation": "34-21-86", "state": "AL"}}, {"field": "nursing_education_program_clinical_hours_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum number of direct patient care clinical hours required in an approved prelicensure nursing education program.", "depth": 0, "example": {"value": 500, "quote": "An approved school of nursing or nursing program shall meet a minimum of 500 direct patient care clinical hours in a board-approved clinical setting with a minimum of 30 hours of supervised direct pat", "citation": "Section 2786.", "state": "CA"}}, {"field": "implicit_bias_training_required_in_curriculum", "type": "boolean", "vocabulary": [], "meaning": "Whether approved nursing education programs are required to include implicit bias training as part of graduation requirements.", "depth": 0, "example": {"value": true, "quote": "Graduation requirements for an approved school of nursing, or an approved nursing program, shall include one hour of direct participation in an implicit bias training", "citation": "Section 2786.", "state": "CA"}}, {"field": "military_education_credit_required", "type": "boolean", "vocabulary": [], "meaning": "Whether approved nursing schools are required to grant credit toward licensure for military medical education and experience.", "depth": 0, "example": {"value": true, "quote": "Notwithstanding another provision of law, the department or applicable board shall accept military education, training, and service for some or all of the qualifications otherwise required of an appli", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}]}], "example_state": null}, "optometry": {"profession": "optometry", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Examiners in Optometry", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry", "citation": "08.72.010", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Examiners in Optometry", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry", "citation": "08.72.010", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry and to protect and promote the public health, welfare, and safety.", "citation": "08.72.010", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit
