experience requirements.", "depth": 0, "example": {"value": true, "quote": "ENGINEER INTERN. An individual who has been certified as an engineer intern by the board.", "citation": "34-11-1", "state": "AL"}}, {"field": "surveyor_in_training_certificate_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a formal intermediate certificate to land surveying candidates who pass the fundamentals exam but have not yet completed experience requirements.", "depth": 0, "example": {"value": true, "quote": "LAND SURVEYOR INTERN. An individual who has been certified as a land surveyor intern by the board.", "citation": "34-11-1", "state": "AL"}}, {"field": "geologist_in_training_certificate_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a formal intermediate certificate to geology candidates who pass the fundamentals exam but have not yet completed experience requirements.", "depth": 0, "example": {"value": true, "quote": "\"Geologist-in-training\" means a candidate for registration as a professional geologist who both: (a) Is a graduate of a school approved by the board or has four years or more of education or experienc", "citation": "32-101", "state": "AZ"}}, {"field": "postgraduate_degree_experience_credit_years_max", "type": "integer", "vocabulary": [], "meaning": "Maximum number of years of experience credit that may be granted for postbaccalaureate engineering degrees earned before licensure.", "depth": 0, "example": {"value": 2, "quote": "If a Ph.D. in engineering is completed, a total of two years' experience may be credited.", "citation": "34-11-4", "state": "AL"}}, {"field": "responsible_charge_defined", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute provides an explicit statutory definition of 'responsible charge' as a term of art for the level of oversight required for licensure and practice.", "depth": 0, "example": {"value": true, "quote": "\"responsible charge\" means the direct control and personal supervision of work", "citation": "08.48.341", "state": "AK"}}, {"field": "seal_required_on_documents", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees are required by statute to obtain and affix an official seal to plans, specifications, plats, and reports they issue.", "depth": 0, "example": {"value": true, "quote": "When a registrant issues final drawings, specifications, surveys, plats, plates, reports, or similar documents, the registrant shall stamp the documents with the seal and sign the seal.", "citation": "08.48.221", "state": "AK"}}, {"field": "seal_document_types", "type": "list", "vocabulary": [], "meaning": "Types of professional documents that must bear the licensee's seal and signature.", "depth": 0, "example": {"value": ["final drawings", "specifications", "surveys", "plats", "plates", "reports", "similar documents"], "quote": "When a registrant issues final drawings, specifications, surveys, plats, plates, reports, or similar documents, the registrant shall stamp the documents with the seal and sign the seal.", "citation": "08.48.221", "state": "AK"}}, {"field": "firm_practice_allowed", "type": "boolean", "vocabulary": [], "meaning": "Whether firms and corporations may lawfully offer engineering, surveying, or geology services, subject to the condition that responsible employees are licensed.", "depth": 0, "example": {"value": true, "quote": "This chapter does not prevent a corporation, limited liability company, limited liability partnership, or limited partnership from offering architectural, engineering, land surveying, or landscape arc", "citation": "08.48.241", "state": "AK"}}, {"field": "exemptions_from_licensure", "type": "list", "vocabulary": [], "meaning": "Categories of persons or activities explicitly exempted from the licensure requirement.", "depth": 0, "example": {"value": ["contractor performing work designed by a professional engineer under supervision", "workers in building trades crafts, earthwork, grounds keeping, or nursery operations", "officer or employee of the United States government in official capacity", "employee or subordinate of a registrant under direct supervision", "associates, consultants, or specialists retained by a registrant under responsible charge", "person preparing drawings or specifications for specified residential and agricultural buildings", "specialty contractor for work designed by an engineer within the specialty", "person furnishing drawings for alterations not affecting structural system or public safety", "postsecondary educational institution employee teaching engineering courses", "officer or employee practicing engineering involved in employer's business only (not offering to public)", "person involved in revegetation, restoration, reclamation, or erosion control not affecting public health, safety, or welfare", "person maintaining or directing placement of plant material not affecting public health, safety, or welfare", "employee/officer of regulatory agency reviewing drawings sealed by a registrant", "person designing fire protection systems authorized by the Department of Public Safety"], "quote": "This chapter does not apply to (1) a contractor performing work designed by a professional architect, engineer, or landscape architect or the supervision of the construction of the work as a superviso", "citation": "08.48.331", "state": "AK"}}, {"field": "code_of_ethics_in_statute", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute itself contains a codified code of ethics whose violation is grounds for license suspension or revocation.", "depth": 0, "example": {"value": true, "quote": "publishing a code of ethics or professional conduct for registrants and entities authorized under AS 08.48.241", "citation": "08.48.101", "state": "AK"}}, {"field": "multi_license_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees holding licenses in other states, territories, or countries must report that fact and any out-of-state disciplinary actions to the board.", "depth": 0, "example": {"value": false, "quote": "A licensee shall report to the board in writing the occurrence of any of the following events", "citation": "Section 6770.", "state": "CA"}}, {"field": "board_engineering_disciplines_represented", "type": "list", "vocabulary": [], "meaning": "The major engineering disciplines that must be represented on the licensing board, as specified by statute.", "depth": 0, "example": {"value": ["civil engineering (2 members)", "land surveying (2 members)", "mining engineering (1 member)", "electrical or mechanical engineering (1 member)", "another branch of engineering (1 member)"], "quote": "The board consists of two civil engineers, two land surveyors, one mining engineer, one electrical or mechanical engineer, one engineer from another branch of the profession of engineering, two archit", "citation": "08.48.011", "state": "AK"}}, {"field": "board_member_responsible_charge_years_required", "type": "integer", "vocabulary": [], "meaning": "Minimum number of years a professional board member must have been in responsible charge of work to be eligible for appointment.", "depth": 0, "example": {"value": 5, "quote": "must be registered and have a minimum of five years of professional practice in the member's respective field", "citation": "08.48.031", "state": "AK"}}, {"field": "pdh_units_per_renewal_period", "type": "integer", "vocabulary": [], "meaning": "Number of Professional Development Hours (PDH) required per biennial renewal period.", "depth": 0, "example": {"value": 18, "quote": "Every licensee must complete 9 continuing education hours for each year of the license renewal period, totaling 18 continuing education hours for the license renewal period.", "citation": "471.017", "state": "FL"}}, {"field": "pdh_carryover_max_units", "type": "integer", "vocabulary": [], "meaning": "Maximum number of excess PDH units that may be carried forward into the next renewal period.", "depth": 0, "example": {"value": 12, "quote": "a carryover permitted from the previous renewal period, which must not exceed 50 percent of the biennial requirement of professional development hours.", "citation": "326.107", "state": "MN"}}, {"field": "retired_status_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state offers a retired-status license that exempts the holder from continuing education requirements while prohibiting active practice.", "depth": 0, "example": {"value": true, "quote": "On retiring from practice and payment of an appropriate one-time fee, a registrant in good standing with the board may apply for the conversion of a certificate of registration to a retired status reg", "citation": "08.48.215", "state": "AK"}}]}], "example_state": null}, "public_accountancy": {"profession": "public_accountancy", "data_as_of": "2026-07-18", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "The board shall issue a license to engage in the practice of public accounting to an individual who meets the requirements of AS 08.04.110 - 08.04.130.", "citation": "08.04.105", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Board of Public Accountancy", "quote": "There is created the Board of Public Accountancy.", "citation": "08.04.010", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Board of Public Accountancy", "quote": "There is created the Board of Public Accountancy.", "citation": "08.04.010", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "There is created the Board of Public Accountancy.", "citation": "08.04.010", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.04.680", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 19, "quote": "has attained the age of 19 years", "citation": "34-1-4", "state": "AL"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "An applicant for a certified public accountant license shall be of good moral character.", "citation": "08.04.110", "state": "AK"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "baccalaureate degree or its equivalent conferred by a college or university acceptable to the board and additional semester hours or post-baccalaureate study so that the total educational program includes at least 150 hours", "quote": "a baccalaureate degree or its equivalent conferred by a college or university acceptable to the board and additional semester hours or post-baccalaureate study so that the total educational program in", "citation": "08.04.120", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Regional accreditation board such as the Southern Association of Colleges and Universities", "quote": "a college or university accredited by a regional accreditation board such as the Southern Association of Colleges and Universities", "citation": "34-1-4", "state": "AL"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "bachelor", "quote": "a baccalaureate degree or its equivalent conferred by a college or university acceptable to the board and additional semester hours or post-baccalaureate study so that the total educational program in", "citation": "08.04.120", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "a baccalaureate degree or its equivalent conferred by a college or university acceptable to the board", "citation": "08.04.120", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "a baccalaureate degree or its equivalent conferred by a college or university acceptable to the board and additional semester hours or post-baccalaureate study so that the total educational program in", "citation": "08.04.120", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "applicants until December 31, 1999", "state": "CT"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor", "state": "CT"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": {"value": "2026-11-21", "state": "NY"}}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "two years of accounting experience satisfactory to the board", "citation": "08.04.120", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "two years of accounting experience satisfactory to the board", "citation": "08.04.120", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "two years", "quote": "two years of accounting experience satisfactory to the board", "citation": "08.04.120", "state": "AK"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "accounting experience", "quote": "two years of accounting experience satisfactory to the board", "citation": "08.04.120", "state": "AK"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Uniform Certified Public Accountant Examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Administered by the American Institute of Certified Public Accountants; board uses AICPA's advisory grading service if available.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "national (AICPA)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 150, "quote": "the board shall charge a fee of one hundred fifty dollars for the initial issuance and the professional services fee for class I, as defined in section 33-182l, for each annual renewal of such license", "citation": "20-281d", "state": "CT"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "Each application for renewal of a license to practice as a certified public accountant by an individual who has held a license as a certified public accountant for two years or more shall be accompani", "citation": "08.04.425", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 40, "quote": "documenting completion of forty (40) hours of acceptable continuing education, approved by the board, during the twelve-month period immediately preceding the expiration date of the license", "citation": "17-12-502", "state": "AR"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "during the two years immediately preceding the application", "citation": "08.04.425", "state": "AK"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["24 hours of governmental accounting and auditing (for those who plan, direct, or approve financial or compliance audit reports on governmental agencies)", "24 hours of accounting and auditing related to reporting on financial statements (for those providing audit, review, attestation, or compilation services)", "continuing education course on provisions of this chapter and rules of professional conduct (within a six-year period)"], "quote": "A licensee who plans, directs, or approves any financial or compliance audit report on any governmental agency shall complete a minimum of 24 hours of qualifying continuing education in the area of go", "citation": "Section 5027.", "state": "CA"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the board may issue a license to engage in the practice of public accounting to an applicant who holds a license, or its equivalent, issued by another state", "citation": "08.04.195", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must have passed the Uniform CPA Examination, meet board-established accounting experience requirements, not be subject to pending disciplinary proceedings in another state, and be of good moral character.", "quote": "passed the Uniform Certified Public Accountant Examination of the American Institute of Certified Public Accountants in order to receive the applicant's initial license from the other state; meets the", "citation": "08.04.195", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the Board of Public Accountancy.", "citation": "08.04.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Public Accountant Registration and Licensure Committee", "quote": "The Secretary shall appoint a Public Accountant Registration and Licensure Committee", "citation": "225 ILCS 450/2.05", "state": "IL"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "advisory capacity to the Secretary on questions involving standards of professional conduct, discipline, and qualifications of applicants and licensees", "quote": "The Secretary shall consider the advice and recommendations of the Committee on questions involving standards of professional conduct, discipline, and qualifications of applicants and licensees under ", "citation": "225 ILCS 450/2.05", "state": "IL"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "American Institute of Certified Public Accountants (AICPA)", "quote": "international uniform certified public accountant qualification examination of the American institute of certified public accountants", "citation": "32-721", "state": "AZ"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Institute of Certified Public Accountants", "quote": "The board shall use the Uniform Certified Public Accountant Examination of the American Institute of Certified Public Accountants and the institute's advisory grading service, if available.", "citation": "08.04.130", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to engage in the practice of public accounting to an individual who meets the requirements of AS 08.04.110 - 08.04.130.", "citation": "08.04.105", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to engage in the practice of public accounting to an individual who meets the requirements of AS 08.04.110 - 08.04.130.", "citation": "08.04.105", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "Only a person who holds a valid license, practice privilege, or permit may issue a report on behalf of another person or governmental unit.", "citation": "08.04.505", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "An individual may not assume or use the title or designation \"certified public accountant\" or the abbreviation \"CPA\" or any other title, designation, word, letter, abbreviation, sign, card, or device ", "citation": "08.04.500", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "Only a person who holds a valid license, practice privilege, or permit may issue a report on behalf of another person or governmental unit.", "citation": "08.04.505", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", function filter(){
  var q = qEl.value.toLowerCase(), grp = grpEl.value;
  document.querySelectorAll('#out section.grp').forEach(function(sec){
    sec.style.display = (!grp || sec.getAttribute('data-group') === grp) ? '' : 'none';
  });
  document.querySelectorAll('#out tbody tr').forEach(function(tr){
    tr.style.display = (!q || tr.getAttribute('data-k').indexOf(q) > -1) ? '' : 'none';
  });
}
profEl.addEventListener('change', render);
grpEl.addEventListener('change', filter);
qEl.addEventListener('input', filter);
techEl.addEventListener('change', function(){ document.body.classList.toggle('tech', techEl.checked); });
render();
</script></body></html>
