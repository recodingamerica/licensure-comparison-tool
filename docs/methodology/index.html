 inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.72.300", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 19, "quote": "Every person desiring to practice optometry in this state shall be 19 years of age, or over", "citation": "34-22-20", "state": "AL"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "Every person desiring to practice optometry in this state shall be 19 years of age, or over, a citizen of the United States or, if not a citizen of the United States, a person who is legally present i", "citation": "34-22-20", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "graduate of a school or college of optometry recognized by the board", "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "American Optometric Association", "quote": "\"recognized school or college of optometry\" means a school or college approved by the American Optometric Association or a committee of the American Optometric Association.", "citation": "08.72.300", "state": "AK"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "doctorate", "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "\"recognized school or college of optometry\" means a school or college approved by the American Optometric Association or a committee of the American Optometric Association.", "citation": "08.72.300", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "embedded_in_credential", "quote": "shall be a graduate of a school or college of optometry recognized by the board", "citation": "08.72.140", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "at least 100 hours", "quote": "which internship includes at least one hundred (100) hours of supervised clinical training", "citation": "17-90-401", "state": "AR"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "supervised clinical internship in examination, diagnosis, and treatment of conditions of the human eye and adnexa", "quote": "Served an internship program established by the board, supervised and certified by a board-certified ophthalmologist, which internship includes at least one hundred (100) hours of supervised clinical ", "citation": "17-90-401", "state": "AR"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "National or international examination designated by the board", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "First section of the two-part examination.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "national or international, as designated by board regulation", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 160, "quote": "Every licensed optometrist who desires to continue the practice of optometry in this state shall annually, on or before October 1, pay to the secretary of the board a renewal fee of one hundred sixty ", "citation": "34-22-22", "state": "AL"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the licensee has met continuing education requirements as may be prescribed by regulations of the board to ensure the continued protection of the public", "citation": "08.72.181", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 25, "quote": "The length of study shall be prescribed by the board but shall not exceed 25 hours in any calendar year.", "citation": "34-22-22", "state": "AL"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 1, "quote": "All registered optometrists licensed in this state are required to take annual courses of study in subjects relating to the practice of optometry.", "citation": "34-22-22", "state": "AL"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction (at least 2 hours in the two years preceding renewal, unless licensee does not hold a DEA registration number)"], "quote": "the two years preceding the application for renewal, the licensee has completed at least two hours of education in pain management and opioid use and addiction, unless the licensee demonstrates to the", "citation": "08.72.181", "state": "AK"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board shall issue a license by credentials to an applicant who ... holds a current license to practice optometry in another state or territory of the United States or in a province of Canada that ", "citation": "08.72.170", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must: (1) be a graduate of a board-recognized optometry school; (2) pass the Alaska laws/regulations exam; (3) hold a current equivalent license from another US state/territory or Canadian province; (4) have previously passed the National Board of Examiners in Optometry exam; (5) have at least 3,120 hours of active clinical practice in the preceding 36 months; (6) have no disciplinary history; and (7) demonstrate adequate education in pain management and opioid use unless they lack a DEA registration number.", "quote": "was engaged in the active licensed clinical practice of optometry in a state or territory of the United States or in a province of Canada for at least 3,120 hours during the 36 months preceding the da", "citation": "08.72.170", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the Board of Examiners in Optometry to regulate and control the practice of optometry and to protect and promote the public health, welfare, and safety.", "citation": "08.72.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Connecticut Board of Examiners for Optometrists", "quote": "There shall be within the Department of Public Health a Connecticut Board of Examiners for Optometrists.", "citation": "20-128a", "state": "CT"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "The board hears and decides matters concerning suspension or revocation of licensure, adjudicates complaints, and imposes sanctions; the Commissioner of Public Health makes and enforces regulations with advice and assistance from the board; the board may revoke or suspend licenses for cause.", "quote": "The Commissioner of Public Health, with advice and assistance from the board, may make and enforce such regulations, in accordance with chapter 54, as the commissioner deems necessary to maintain prop", "citation": "20-128a", "state": "CT"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Board of Examiners in Optometry", "quote": "at some time in the past, received a license to practice optometry from another state or territory of the United States or from a province of Canada that required the person to have passed the Nationa", "citation": "08.72.170", "state": "AK"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Optometric Association", "quote": "\"recognized school or college of optometry\" means a school or college approved by the American Optometric Association or a committee of the American Optometric Association.", "citation": "08.72.300", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not falsely personate a licensed optometrist, or buy, sell, or fraudulently obtain a license issued to another", "citation": "08.72.280", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice, attempt to practice, or offer to practice optometry without first obtaining a license from the board.", "citation": "08.72.110", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_license", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Secured a license through deceit, fraud, or intentional misrepresentation.", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": true, "quote": "By maintaining a surety bond in a form acceptable to the commissioner of insurance in the amounts set forth in subsection (1)(a) of this section", "citation": "12-275-128", "state": "CO"}}, {"field": "alternative_regulation.insurance_required", "typ ", "state": "AK"}}, {"field": "laser_procedures_authorized", "type": "list", "vocabulary": [], "meaning": "Specific laser procedures the statute explicitly authorizes optometrists to perform.", "depth": 0, "example": {"value": ["Laser capsulotomy", "Laser trabeculoplasty"], "quote": "Laser capsulotomy; and (v) Laser trabeculoplasty.", "citation": "17-90-101", "state": "AR"}}, {"field": "minor_surgical_procedures_authorized", "type": "list", "vocabulary": [], "meaning": "Minor non-laser procedural authorities explicitly granted by statute beyond foreign body removal.", "depth": 0, "example": {"value": ["Injections, excluding intravenous or intraocular injections", "Incision and curettage of a chalazion", "Removal and biopsy of skin lesions with low risk of malignancy, excluding lesions involving the lid margin or nasal to the puncta"], "quote": "Injections, excluding intravenous or intraocular injections; (ii) Incision and curettage of a chalazion; (iii) Removal and biopsy of skin lesions with low risk of malignancy, excluding lesions involvi", "citation": "17-90-101", "state": "AR"}}, {"field": "glaucoma_treatment_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly authorizes optometrists to medically treat glaucoma.", "depth": 0, "example": {"value": true, "quote": "To promulgate rules which authorize board-certified primary care optometrists to order any procedure or laboratory test necessary in the examination, diagnosis, treatment, or management of diseases or", "citation": "17-90-401", "state": "AR"}}, {"field": "anaphylaxis_treatment_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly authorizes optometrists to administer epinephrine or similar agents for anaphylaxis.", "depth": 0, "example": {"value": true, "quote": "The practice of optometry shall include the authority to administer benedryl, epinephrine, or other medication to counteract anaphylaxis or anaphylactic reaction.", "citation": "34-22-1", "state": "AL"}}, {"field": "vision_therapy_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly includes vision therapy, orthoptics, or visual training within the scope of practice.", "depth": 0, "example": {"value": true, "quote": "the providing of developmental and perceptual therapy for the vision system", "citation": "34-22-1", "state": "AL"}}, {"field": "immunization_authority", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute authorizes optometrists to administer immunizations/vaccines.", "depth": 0, "example": {"value": true, "quote": "If also certified under subdivision (d), independent initiation and administration of immunizations for influenza, herpes zoster virus, pneumococcus, and SARS-CoV-2 in compliance with recommendations ", "citation": "Section 3041.", "state": "CA"}}, {"field": "controlled_substance_schedule_restrictions", "type": "list", "vocabulary": [], "meaning": "Specific controlled substance schedules that optometrists are prohibited from or limited in prescribing.", "depth": 0, "example": {"value": ["Schedule I narcotic analgesics: prohibited", "Schedule II narcotic analgesics: prohibited", "Schedule III pharmaceutical agents containing Dihydrocodeinone (Hydrocodone): prohibited", "Other Schedule III pharmaceutical agents: limited to prescriptions not exceeding 96 hours duration"], "quote": "except for narcotic analgesics classified under Schedule I and II, and any Schedule III pharmaceutical agents that contain Dihydrocodeinone, (\"Hydrocodone\"). The prescribing or administering of any ot", "citation": "34-22-1", "state": "AL"}}, {"field": "opioid_prescription_day_limit", "type": "integer", "vocabulary": [], "meaning": "Maximum number of days' supply for an initial opioid prescription issued by an optometrist.", "depth": 0, "example": {"value": 4, "quote": "an initial prescription for an opioid that exceeds a four-day supply to an adult patient for outpatient use", "citation": "08.72.276", "state": "AK"}}, {"field": "oral_pharmaceutical_authority", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly grants authority to prescribe oral (systemic) pharmaceutical agents, beyond topical agents.", "depth": 0, "example": {"value": true, "quote": "a nontopical therapeutic pharmaceutical agent course of at least 23 hours approved by the board or an examination approved by the board on the treatment and management of ocular disease", "citation": "08.72.140", "state": "AK"}}, {"field": "pharmaceutical_certification_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a separate board certification or approval is required before an optometrist may use therapeutic pharmaceutical agents.", "depth": 0, "example": {"value": true, "quote": "shall have successfully completed ... the written and practical portions of an examination on ocular pharmacology approved by the board ... a nontopical therapeutic pharmaceutical agent course of at l", "citation": "08.72.140", "state": "AK"}}, {"field": "dea_registration_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute requires optometrists who prescribe controlled substances to hold or register a federal DEA number.", "depth": 0, "example": {"value": true, "quote": "require that a licensee who has a federal Drug Enforcement Administration registration number register with the controlled substance prescription database under AS 17.30.200(n)", "citation": "08.72.060", "state": "AK"}}, {"field": "tiered_license_types", "type": "list", "vocabulary": [], "meaning": "Named license tiers or designations beyond the basic optometrist license that carry different scopes of practice.", "depth": 0, "example": {"value": ["Regular license", "Limited teaching license", "Limited resident license", "Temporary license", "Board approval to use pharmaceutical agents (additional endorsement)"], "quote": "The board, by rule, may issue a limited ditions exceed the optometric scope of practice.", "depth": 0, "example": {"value": true, "quote": "failed to refer a patient to a physician after ascertaining the presence of ocular or systemic conditions requiring management by a physician", "citation": "08.72.240", "state": "AK"}}, {"field": "comanagement_with_ophthalmologist_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute requires co-management with an ophthalmologist for pre- or post-operative care or certain conditions.", "depth": 0, "example": {"value": true, "quote": "Treatment with topical and oral medications authorized in subdivision (a) related to an ocular surgery shall be comanaged with the ophthalmologist that performed the surgery, or another ophthalmologis", "citation": "Section 3041.", "state": "CA"}}, {"field": "delegation_to_unlicensed_assistants_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly authorizes optometrists to delegate routine or specified tasks to unlicensed or non-optometrist assistants.", "depth": 0, "example": {"value": true, "quote": "authorizing an optometrist licensed under this chapter to delegate routine services of optometry to an agent of the optometrist", "citation": "08.72.050", "state": "AK"}}, {"field": "telemedicine_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly addresses or authorizes the delivery of optometric services via telemedicine.", "depth": 0, "example": {"value": true, "quote": "TELEMEDICINE. A health service that is delivered by a licensed optometrist acting within the scope of his or her license and that requires the use of advanced telecommunications technology", "citation": "34-22-81", "state": "AL"}}, {"field": "mobile_office_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly addresses or regulates the operation of mobile optometric offices (vans, trailers, etc.).", "depth": 0, "example": {"val
