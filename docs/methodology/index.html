var DATA = {"architecture": {"profession": "architecture", "data_as_of": "2026-07-08", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "State Board of Registration for Architects, Engineers, and Land Surveyors", "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "State Board of Registration for Architects, Engineers, and Land Surveyors", "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "shared_board", "quote": "The board consists of two civil engineers, two land surveyors, one mining engineer, one electrical or mechanical engineer, one engineer from another branch of the profession of engineering, two archit", "citation": "08.48.011", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.48.341", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 21, "quote": "To be qualified for admission to an examination to practice architecture in the State of Arkansas, an applicant shall be at least twenty-one (21) years of age.", "citation": "17-15-304", "state": "AR"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "An applicant for registration as an architect, engineer, land surveyor, or landscape architect must be of good character and reputation and shall submit evidence satisfactory to the board of the appli", "citation": "08.48.171", "state": "AK"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Evidence of education, training, and experience satisfactory to the board", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "National Architectural Accrediting Board (NAAB)", "quote": "accredited by the National Architectural Accrediting Board (NAAB)", "citation": "34-2-33", "state": "AL"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "bachelor", "quote": "Graduation after a course of study of a length as the board by rule shall determine from a school or college of architecture accredited by the National Architectural Accrediting Board (NAAB)", "citation": "34-2-33", "state": "AL"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "bachelor's or higher degree in architecture", "state": "HI"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor", "state": "HI"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "as the board by rule shall deem appropriate", "quote": "An additional period of practical experience in architectural work under the responsible control of a registered architect or architects as the board by rule shall deem appropriate.", "citation": "34-2-33", "state": "AL"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "practical experience in architectural work under responsible control of a registered architect", "quote": "practical experience in architectural work under the responsible control of a registered architect or architects", "citation": "34-2-33", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Architecture registration examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "The procedure and standards shall at least meet the requirements adopted by recognized national examining councils for these professions.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (administered in Alaska in accordance with board regulations and national examining council standards)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": null}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 0 carbon design (5 hours)"], "quote": "Five hours of coursework regarding disability access requirements... Five hours of coursework regarding zero net carbon design for all renewals occurring on or after January 1, 2023.", "citation": "5600.05", "state": "CA"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A person holding a certificate of registration authorizing the person to practice architecture in a state, territory, or possession of the United States, the District of Columbia, or a foreign country", "citation": "08.48.191", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must hold a certificate of registration from another U.S. state, territory, possession, the District of Columbia, or a foreign country (or an NCARB certificate of qualification), issued under requirements comparable to Alaska's requirements.", "quote": "A person holding a certificate of registration authorizing the person to practice architecture in a state, territory, or possession of the United States, the District of Columbia, or a foreign country", "citation": "08.48.191", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Illinois Architecture Licensing Board", "quote": "\"Board\" means the Illinois Architecture Licensing Board appointed by the Secretary.", "citation": "225 ILCS 305/4", "state": "IL"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "advisory capacity to the Secretary; makes recommendations on applicant qualifications, discipline, and rulemaking; assists with hearings; reviews complaints", "quote": "7 members who shall serve in an advisory capacity to the Secretary", "citation": "225 ILCS 305/9", "state": "IL"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Council of Architectural Registration Boards (NCARB)", "quote": "holding a certificate of qualification issued by the National Council of Architectural Registration Boards, may, upon application, be registered in accordance with the regulations of the board", "citation": "08.48.191", "state": "AK"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "National Architectural Accrediting Board (NAAB)", "quote": "accredited by the National Architectural Accrediting Board (NAAB)", "citation": "34-2-33", "state": "AL"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "An applicant who fulfills the requirements set out by the board shall be awarded a certificate of registration authorizing the holder to offer or perform services or work for the public, or to certify", "citation": "08.48.211", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "use in connection with the person's name or otherwise assume or advertise a title or description tending to convey the impression that the person is an architect, an engineer, a land surveyor, or a la", "citation": "08.48.281", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state", "citation": "08.48.281", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_certificate", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Fraud or deceit in obtaining a certificate of registration", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": null}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "an architectural corporation shall provide adequate security by insurance or otherwise for claims against it by its clients arising out of the rendering of professional services.", "citation": "5610.7", "state": "CA"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "a corporation, limited liability company, limited liability partnership, or limited partnership shall file with the board (1) an application for a certificate of authorization", "citation": "08.48.241", "state": "AK"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.48.011", "state": "AK"}}, {"field" agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.36.370", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 19, "quote": "every applicant shall be at least 19 years of age", "citation": "34-9-10", "state": "AL"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "has not been convicted of a crime that adversely reflects on the applicant's ability or competency to practice dentistry or that jeopardizes the safety or well-being of a patient", "citation": "08.36.110", "state": "AK"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Graduate of a board-approved dental school", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "American Dental Association Commission on Dental Accreditation (CODA)", "quote": "accredited by the American Dental Association Commission on Dental Accreditation and approved by the board", "citation": "34-9-10", "state": "AL"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "doctorate", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "embedded_in_credential", "quote": "is a graduate of a dental school that, at the time of graduation, is approved by the board", "citation": "08.36.110", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "at least one year", "quote": "evidence of satisfactory completion of at least one year of a clinically based postdoctoral general practice or specialty dental residency program accredited by the Commission on Dental Accreditation,", "citation": "[20-107]", "state": "CT"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "clinically based postdoctoral general practice or specialty dental residency program", "quote": "at least one year of a clinically based postdoctoral general practice or specialty dental residency program accredited by the Commission on Dental Accreditation, or its successor organization", "citation": "[20-107]", "state": "CT"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Written examination approved by the board", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Must pass written examination approved by the board", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (board-approved)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "IN"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 650, "quote": "pay a license renewal fee of not more than $650, established by a formal vote of the board.", "citation": "32-1236", "state": "AZ"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "adopt regulations ensuring that renewal of a license, registration, or certificate under this chapter or a license, certificate, or endorsement under AS 08.32 is contingent on proof of continued profe", "citation": "08.36.070", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "the regulations must require that a licensee receive not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a lic", "citation": "08.36.070", "state": "AK"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.36.070", "state": "AK"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction"], "quote": "not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.36.070", "state": "AK"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may waive the examination requirement and license by credentials if the dentist applicant meets the requirements of AS 08.36.110, submits proof of continued competence as required by regulat", "citation": "08.36.234", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Must meet qualifications under AS 08.36.110, submit proof of continued competence, pay required fee, hold an active license from another state or territory issued after thorough examination (or pass an exam specified by the board), and be interviewed in person by the board.", "quote": "The board may waive the examination requirement and license by credentials if the dentist applicant meets the requirements of AS 08.36.110, submits proof of continued competence as required by regulat", "citation": "08.36.234", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the Board of Dental Examiners consisting of nine members. Six members shall be licensed dentists who have been engaged in the practice of dentistry in the state for five years immedia", "citation": "08.36.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "State Dental Commission", "quote": "The State Dental Commission shall consist of nine members appointed by the Governor", "citation": "[20-103a]", "state": "CT"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "The Commission hears and decides matters concerning suspension or revocation of licensure, adjudicates complaints filed against practitioners, and imposes sanctions; the Commissioner of Public Health issues regulations with advice and assistance from the Dental Commission", "quote": "Said commission shall (1) hear and decide matters concerning suspension or revocation of licensure, (2) adjudicate complaints filed against practitioners and (3) impose sanctions where appropriate.", "citation": "[20-103a]", "state": "CT"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "American Board of Oral and Maxillofacial Surgery", "quote": "Is a diplomate of the American Board of Oral and Maxillofacial Surgery, or is eligible for examination by the American Board of Oral and Maxillofacial Surgery", "citation": "34-9-60", "state": "AL"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Association of Dental Boards", "quote": "affiliate with the American Association of Dental Boards and pay annual dues to the association", "citation": "08.36.070", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "The board shall issue a license to each successful dentist applicant who has paid the required fees.", "citation": "08.36.240", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "uses the words \"dentist\" or \"dental surgeon\" or the letters \"D.D.S.\" or \"D.M.D.\" or other letter or title that represents the dentist as engaging in the practice of dentistry", "citation": "08.36.360", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "a person may not practice, or attempt to practice, dentistry without a license.", "citation": "08.36.100", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_to_obtain_license", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Used or knowingly cooperated in deceit, fraud, or intentional misrepresentation to obtain a license", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": null}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "The initial application for a certificate of registration shall also include proof of insurance from a licensed insurance carrier that the operator has in force at least one million dollars ($1,000,00", "citation": "34-9-6.1", "state": "AL"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "In order to operate a mobile dental facility or portable dental operation, an operator shall first obtain a certificate of registration issued by the board.", "citation": "34-9-6.1", "state": "AL"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.36.010", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "board composition", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "A person engages in the practice of dentistry who (1) performs or holds out to the public as being able to perform dental operations; (2) diagnoses, treats, operates on, corrects, attempts to correct, or prescribes for a disease, lesion, pain, injury, deficiency, deformity, or physical condition, malocclusion or malposition of the human teeth, alveolar process, gingiva, maxilla, mandible, or adjacent tissues; (3) performs or attempts to perform an operation incident to the replacement of teeth; (4) furnishes, supplies, constructs, reproduces, or repairs dentures, bridges, appliances or other structures to be used and worn as substitutes for natural teeth...", "quote": "A person engages in the practice of dentistry who (1) performs or holds out to the public as being able to perform dental operations; (2) diagnoses, treats, operates on, corrects, attempts to correct,", "citation": "08.36.360", "state": "AK"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["diagnosis", "treatment", "operative procedures", "surgical procedures", "prescribing", "dental operations", "replacement of teeth", "fabrication/repair of dental appliances", "evaluation and preventive procedures for oral cavity and maxillofacial area"], "quote": "diagnoses, treats, operates on, corrects, attempts to correct, or prescribes for a disease, lesion, pain, injury, deficiency, deformity, or physical condition, malocclusion or malposition of the human", "citation": "08.36.360", "state": "AK"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": {"value": "Dentists may prescribe drugs as part of the practice of dentistry; opioid prescriptions are limited to a seven-day supply for initial prescriptions for adult outpatients and for any prescription to minors, with exceptions for chronic pain and access barriers. Dentists holding a DEA registration number must register with the controlled substance prescription database.", "quote": "A licensee may not issue (1) an initial prescription for an opioid that exceeds a seven-day supply to an adult patient for outpatient use; (2) a prescription for an opioid that exceeds a seven-day sup", "citation": "08.36.355", "state": "AK"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.36.360", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "practice of dentistry defined", "state": "AK"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "sedation_anesthesia_permit_types", "type": "list", "vocabulary": [], "meaning": "The distinct categories of sedation and anesthesia permits a dentist may obtain beyond basic local anesthesia, each requiring separate training and board approval.", "depth": 0, "example": {"value": ["general anesthesia permit", "parenteral sedation permit", "oral conscious sedation permit"], "quote": "In order to administer oral conscious sedation, a dentist must possess a general anesthesia permit, a parenteral sedation permit, or an oral conscious sedation permit from the board.", "citation": "34-9-81", "state": "AL"}}, {"field": "sedation_permit_onsite_inspection_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the board may require an on-site inspection of the facility, equipment, and personnel before issuing or renewing a sedation or anesthesia permit.", "depth": 0, "example": {"value": true, "quote": "Prior to the issuance of the permit, the board, at its discretion, may require an on-site inspection of the facility, equipment, and personnel to determine if the requirements in paragraph a. have bee", "citation": "34-9-60", "state": "AL"}}, {"field": "sedation_adverse_event_reporting_required", "type": "boolean", "vocabulary": [], "meaning": "Whether licensees are required to report deaths, injuries, or other adverse events resulting from sedation or anesthesia to the board within a specified timeframe.", "depth": 0, "example": {"value": true, "quote": "All licensees engaged in the practice of dentistry in the state must submit a complete report within a period of 30 days to the Board of Dental Examiners of any mortality or other incident occurring i", "citation": "34-9-65", "state": "AL"}}, {"field": "pediatric_sedation_endorsement_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a separate pediatric endorsement on a sedation or anesthesia permit is required before administering sedation to patients below a specified age threshold.", "depth": 0, "example": {"value": false, "quote": "When oral conscious sedation is used on any patient under 12 years of age, the following provisions shall apply: (1) The drugs, dosages, and techniques used should carry a margin of safety which is un", "citation": "34-9-89", "state": "AL"}}, {"field": "specialist_license_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues a separate specialist license or certificate allowing a dentist to hold themselves out to the public as a specialist in a recognized branch of dentistry.", "depth": 0, "example": {"value": true, "quote": "A licensed dentist may not represent to the public to be qualified in a specialized branch of dentistry through any means of public advertising using the term \"specialist,\" the name of a specialty, or", "citation": "08.36.242", "state": "AK"}}, {"field": "specialty_practice_scope_restriction", "type": "boolean", "vocabulary": [], "meaning": "Whether a dentist who obtains a specialist license is restricted to practicing only within that specialty branch.", "depth": 0, "example": {"value": true, "quote": "The practice of a dentist who obtains a specialist license under (a) of this section is limited to the branch of dentistry in which the dentist holds a specialist license.", "citation": "08.36.243", "state": "AK"}}, {"field": "specialty_advertising_disclaimer_required", "type": "boolean", "vocabulary": [], "meaning": "Whether dentists who advertise a practice emphasis in an area not recognized as a specialty by the board must include a specific statutory disclaimer in their advertising.", "depth": 0, "example": {"value": true, "quote": "a dentist who lacks membership in or certification, diplomate status, or other similar credentials from an accrediting organization approved as bona fide by the board may announce a practice emphasis ", "citation": "34-9-19", "state": "AL"}}, {"field": "dental_hygienist_supervision_levels", "type": "list", "vocabulary": [], "meaning": "The defined levels of dentist supervision under which dental hygienists may perform procedures, as enumerated in statute.", "depth": 0, "example": {"value": ["direct supervision", "indirect supervision", "general supervision"], "quote": "\"direct supervision\" means the dentist is in the dental office, personally diagnoses the condition to be treated, personally authorizes the procedure, and before dismissal of the patient evaluates the", "citation": "08.32.190", "state": "AK"}}, {"field": "collaborative_agreement_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state authorizes a formal written collaborative agreement between a dentist and a dental hygienist that allows the hygienist to provide specified services without the dentist's physical presence.", "depth": 0, "example": {"value": true, "quote": "a licensed dental hygienist with a minimum of 4,000 documented hours of clinical experience within the five years preceding application for the board's approval may enter into a collaborative agreemen", "citation": "08.32.115", "state": "AK"}}, {"field": "collaborative_agreement_max_hygienists_per_dentist", "type": "integer", "vocabulary": [], "meaning": "The maximum number of collaborative or affiliated practice agreements a single dentist may hold simultaneously with dental hygienists.", "depth": 0, "example": {"value": 5, "quote": "the board may not approve more than five collaborative agreements with a licensed dentist, not including any collaborative agreements that have been terminated", "citation": "08.32.115", "state": "AK"}}, {"field": "advanced_practice_permit_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state issues an advanced practice permit or equivalent cr  that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Professional Licensing Boards Division, Office of the Secretary of State", "quote": "There is created within the office of the Secretary of State the professional licensing boards division", "citation": "UMBRELLA / Chapter 1 - GENERAL PROVISIONS (§§ 43-1-1 — 43-1-36)", "state": "GA"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 19, "quote": "Be 19 years of age or older.", "citation": "34-34A-7", "state": "AL"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "Submit evidence of good moral character and respectability.", "citation": "34-34A-7", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "master's or doctoral degree from an accredited college or university with a major in human nutrition, public health nutrition, clinical nutrition, nutrition education, community nutrition, or food and nutrition", "quote": "has received a master's or doctoral degree from an accredited college or university with a major in human nutrition, public health nutrition, clinical nutrition, nutrition education, community nutriti", "citation": "08.38.030", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education", "quote": "accredited by the regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education at the time the degree was conferred", "citation": "08.38.100", "state": "AK"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "master", "quote": "has received a master's or doctoral degree from an accredited college or university", "citation": "08.38.030", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "accredited by the regional or national accrediting agencies recognized by the Council on Post-Secondary Accreditation and the United States Department of Education at the time the degree was conferred", "citation": "08.38.100", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": true, "quote": "submits evidence satisfactory to the department of being certified as a Registered Dietitian by the Commission on Dietetic Registration", "citation": "08.38.020", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "licensed dietitian", "state": "AK"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor", "state": "AK"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "required_by_statute", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "900 hours", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030", "state": "AK"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "documented work experience in human nutrition or human nutrition research", "quote": "has completed a documented work experience in human nutrition or human nutrition research of at least 900 hours", "citation": "08.38.030", "state": "AK"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Commission on Dietetic Registration Examination", "state": "AL"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AL"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Waived for applicants who provide evidence of current CDR registration.", "state": "AL"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "national (Commission on Dietetic Registration)", "state": "AL"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "MO"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 105, "quote": "upon payment of a renewal fee of one hundred five dollars", "citation": "20-206r", "state": "CT"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote":
