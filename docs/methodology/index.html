eld": "hospital_order_authority_requires_policy", "type": "boolean", "vocabulary": [], "meaning": "Whether a dietitian's authority to issue orders in a hospital setting is conditioned on the hospital having written policies and procedures authorizing such orders.", "depth": 0, "example": {"value": true, "quote": "The hospital's written policies and procedures allow registered dietitians or other qualified nutrition professionals to issue such orders.", "citation": "36-416", "state": "AZ"}}, {"field": "inactive_license_status_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the state allows a licensee to place their license in an inactive status for a defined period.", "depth": 0, "example": {"value": true, "quote": "A license under this part which has become inactive may be reactivated pursuant to this section.", "citation": "468.515", "state": "FL"}}, {"field": "ethics_code_violation_grounds_for_discipline", "type": "boolean", "vocabulary": [], "meaning": "Whether violation of a recognized professional code of ethics (e.g., the American Dietetic Association's code) is explicitly listed as a ground for disciplinary action.", "depth": 0, "example": {"value": true, "quote": "Has violated the Code of Ethics as established by the American Dietetic Association", "citation": "§ 3811. Grounds for discipline/sanctions/penalties of unlicensed practice.", "state": "DE"}}]}], "example_state": null}, "electrician": {"profession": "electrician", "data_as_of": "2026-07-18", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not act as an electrical administrator in the state without a license issued by the department unless the person is covered by an exclusion under AS 08.40.190.", "citation": "08.40.090", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.40.200", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.40.200", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "department", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.40.200", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Labor and Licensing", "quote": "It shall be the duty of the Department of Labor and Licensing to administer and enforce the provisions of this chapter.", "citation": "17-28-202", "state": "AR"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 18, "quote": "A license may not be issued to a minor, to any partnership in which one of the partners is a minor or to any corporation in which a corporate officer is a minor.", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "each person who is named on a license must not have engaged in contracting without a license or committed any act that, if committed or done by any licensed contractor, would be grounds for suspension", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "No degree required; technical training in an accredited college or university may substitute for up to two years of required practical experience", "quote": "Technical training in an accredited college or university or in a manufacturer's accredited training program may be substituted for a portion of such experience, but in no case may credited technical ", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "accredited college or university (for engineering degree pathway); community college or trade school program approved by the board (for trade school pathway)", "quote": "a graduate electrical engineer of an accredited college or university or the graduate of a community college or trade school program approved by the board", "citation": "12-115-110", "state": "CO"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "none", "quote": "Have a minimum of four years' practical or management trade experience, at least two of which must have been within the last ten years, dealing specifically with the type of construction, or its equiv", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "regional_accreditor", "quote": "Technical training in an accredited college or university or in a manufacturer's accredited training program may be substituted for a portion of such experience", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "Have a minimum of four years' practical or management trade experience, at least two of which must have been within the last ten years, dealing specifically with the type of construction, or its equiv", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "master electrician (engineering degree pathway)", "state": "CO"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor", "state": "CO"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "Each applicant shall be examined to determine the applicant's (1) ability to understand plans, design specifications, and engineering terms commonly used in the electrical field; (2) knowledge of elec", "citation": "08.40.120", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "Each applicant shall be examined to determine the applicant's (1) ability to understand plans, design specifications, and engineering terms commonly used in the electrical field; (2) knowledge of elec", "citation": "08.40.120", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "4 years", "quote": "Four years of practical experience as a journeyman electrician in charge of jobs.", "citation": "34-36-3", "state": "AL"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "practical experience as a journeyman electrician in charge of jobs", "quote": "Four years of practical experience as a journeyman electrician in charge of jobs.", "citation": "34-36-3", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Electrical Administrator Licensing Examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Covers ability to understand plans/specifications, knowledge of electrical installations and wiring, familiarity with National Electrical Code and National Electrical Safety Code, and personal skill and ability. Offered at least twice per year.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (department-administered)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 2, "state": "MI"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 50, "quote": "Master electrician ............... $50.00 per year", "citation": "17-28-301", "state": "AR"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the department shall adopt regulations subject to AS 44.62 (Administrative Procedure Act), relating to the examination and licensing of electrical administrators and the establishing of the continued ", "citation": "08.40.050", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 14, "quote": "All persons holding an electrical contractor license shall be required to complete 14 hours of continuing education every two years.", "citation": "34-36-8", "state": "AL"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "All persons holding an electrical contractor license shall be required to complete 14 hours of continuing education every two years.", "citation": "34-36-8", "state": "AL"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["national electrical code", "core competencies as determined by the board"], "quote": "requirements and standards must include course work related to the national electrical code, including core competencies as determined by the board.", "citation": "12-115-110", "state": "CO"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "If an applicant for a license submits proof satisfactory to the department that the applicant is licensed as an electrical administrator or the equivalent by another state or territory, that the appli", "citation": "08.40.120", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must show they are licensed as an electrical administrator or equivalent in another state or territory, meet department qualifications, and have passed an equivalent examination. The department then waives the licensing examination.", "quote": "the department shall waive all of the examination required under (a) of this section.", "citation": "08.40.120", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "regulation of electrical and mechanical administrators under AS 08.40", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Electrical Work Board", "quote": "The Electrical Work Board shall consist of twelve members who shall be residents of this state", "citation": "Sec. 20-331", "state": "CT"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "The board advises the Commissioner of Consumer Protection on regulations, examinations, and continuing education; the Commissioner holds rulemaking authority with the board's advice and assistance; the board makes proposed final decisions on discipline subject to commissioner review.", "quote": "The Commissioner of Consumer Protection, with the advice and assistance of the appropriate board, (1) may adopt regulations, in accordance with chapter 54, for the pursuit, practice and standards of t", "citation": "Sec. 20-332", "state": "CT"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": null}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American National Standards Institute", "quote": "familiarity with the regulations contained in the National Electrical Code and the National Electrical Safety Code, as approved by the American National Standards Institute", "citation": "08.40.120", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not act as an electrical administrator in the state without a license issued by the department unless the person is covered by an exclusion under AS 08.40.190.", "citation": "08.40.090", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not act as an electrical administrator in the state without a license issued by the department", "citation": "08.40.090", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not act as an electrical administrator in the state without a license issued by the department unless the person is covered by an exclusion under AS 08.40.190.", "citation": "08.40.090", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not act as an electrical administrator in the state without a license issued by the department", "citation": "08.40.090", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not act as an electrical administrator in the state without a license issued by the department unless the person is covered by an exclusion under AS 08.40.190.", "citation": "08.40.090", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraudulent_application", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "The license application is fraudulent or misleading.", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": true, "quote": "Before granting an original contractor's license, the registrar shall require of the applicant a surety bond in a form acceptable to the registrar or a cash deposit as provided in this section.", "citation": "A.R.S. § 32-1152", "state": "AZ"}}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "An attestation that the applicant has complied with the statutes and rules governing workers' compensation insurance. If the applicant is required by law to secure workers' compensation insurance purs", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "All agencies, who intend to conduct electrical inspections in this State, shall apply for a license as an approved electrical inspection agency", "citation": "§ 1421. Electrical Inspection Agencies.", "state": "DE"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.045", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "statute", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "a person who is responsible for (A) installing or repairing electrical wiring, conduits, devices, fixtures, equipment, or other electrical materials for transmitting, using, or consuming electrical energy; or (B) certifying that an installation or repair described in (A) of this paragraph complies with applicable electrical codes", "quote": "\"electrical administrator\" means a person who is responsible for (A) installing or repairing electrical wiring, conduits, devices, fixtures, equipment, or other electrical materials for transmitting, ", "citation": "08.40.200", "state": "AK"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["installing electrical wiring, conduits, devices, fixtures, equipment", "repairing electrical wiring, conduits, devices, fixtures, equipment", "certifying compliance with applicable electrical codes"], "quote": "installing or repairing electrical wiring, conduits, devices, fixtures, equipment, or other electrical materials for transmitting, using, or consuming electrical energy; or (B) certifying that an inst", "citation": "08.40.200", "state": "AK"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.200", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "statute", "state": "AK"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "license_tiers", "type": "list", "vocabulary": [], "meaning": "The named tiers or classifications of electrician license available in the state, from apprentice through master and including residential variants.", "depth": 0, "example": {"value": ["electrical administrator categories (set by regulation)"], "quote": "The department may adopt regulations establishing categories of electrical administrators, qualifications for those categories, and the content of examinations for applicants for each category.", "citation": "08.40.045", "state": "AK"}}, {"field": "residential_project_definition", "type": "string", "vocabulary": [], "meaning": "Statutory definition of what constitutes a 'residential project' for purposes of limiting or distinguishing residential electrician license scope.", "depth": 0, "example": {"value": "residential journeyman and master electrician licenses are limited to single family dwellings, duplexes, triplexes, and quadraplexes", "quote": "\"Residential journeyman electrician\" means the classification by which the licenses and electrical work of journeyman electricians may be limited to the installation, alteration, repair, maintenance, ", "citation": "17-28-101", "state": "AR"}}, {"field": "residential_wiring_method_restriction", "type": "boolean", "vocabulary": [], "meaning": "Whether the residential-tier electrician license is restricted to work on buildings primarily wired with nonmetallic sheathed (NM) cable.", "depth": 0, "example": {"value": true, "quote": "\"Residential journeyman electrician\" means a person licensed under this chapter as a residential journeyman electrician having the qualifications, training, experience, and knowledge to wire, install,", "citation": "Section 102 - Definitions.", "state": "UT"}}, {"field": "voltage_limit_residential", "type": "integer", "vocabulary": [], "meaning": "Maximum voltage (line-to-line) permitted under a residential electrician license classification.", "depth": 0, "example": {"value": 1000, "quote": "the equipment or installation in the contract is rated at not more than 1,000 volts", "citation": "87-43.3", "state": "NC"}}, {"field": "scope_exclusions", "type": "list", "vocabulary": [], "meaning": "Specific categories of work explicitly excluded from the definition of the electrical trade and therefore not requiring an electrician license.", "depth": 0, "example": {"value": ["utilities/municipalities for generation and distribution systems owned and operated by them", "installation/operation/maintenance/repair of telephone, signal, or communication systems by utility employees", "manufacture, maintenance, or repair of electrical apparatus or equipment", "electrical work under $5,000 in communities under 500 population or over 50 miles from a licensed administrator", "electrical installation on residential property owned by installer or immediate family not intended for sale", "operation/maintenance/repair of television or radio broadcasting systems and radio broadcasting systems under 500 watts", "installation, maintenance, and repair of elevators confined to elevator control system by elevator industry employees", "operation, maintenance, and repair of telephone and intercommunication facilities", "installation, maintenance, and repair of fire alarm, intrusion alarm, or other low voltage signaling systems of 48 volts to ground or less", "maintenance or repair of diesel electric engines on heavy construction equipment", "installation in a commercial water well of submersible pump motor and wiring to well pump system controls outside a building", "installation in a noncommercial water well of submersible pump motor and wiring to well pump system controls", "electrical maintenance or repair by an employee of an owner or tenant of commercial property as part of work duties not offered as a service to the public"], "quote": "AS 08.40.005 - 08.40.200 do not apply to any utility or municipality engaged in (1) electrical construction and maintenance of electrical wiring for the generation and distribution of electrical curre", "citation": "08.40.190", "state": "AK"}}, {"field": "minor_electrical_work_amperage_limit", "type": "integer", "vocabulary": [], "meaning": "Maximum amperage for minor electrical work incidental to a mechanical or service installation that is excluded from the licensed electrical trade.", "depth": 0, "example": {"value": 200, "quote": "Persons working beyond the main breaker or fuse of 200 amps or less on structures used exclusively for agricultural purposes", "citation": "§ 1419. Exceptions.", "state": "DE"}}, {"field": "minor_electrical_work_distance_limit_feet", "type": "integer", "vocabulary": [], "meaning": "Maximum distance in feet that wiring may be extended from an existing outlet or disconnect to qualify as minor electrical work excluded from licensure.", "depth": 0, "example": {"value": 10, "quote": "Any holder of a state-issued heating, ventilation, air conditioning, and refrigeration, or HVACR, license may run line voltage power wiring in compliance with the state electric code from a disconnect", "citation": "17-28-102", "state": "AR"}}, {"field": "apprentice_supervision_ratio", "type": "string", "vocabulary": [], "meaning": "The maximum ratio of licensed apprentice electricians permitted under the immediate supervision of one licensed supervisor, as set by rule.", "depth": 0, "example": {"value": "1 master or journeyman to 3 apprentices on a single electrical job", "quote": "One (1) master electrician or journeyman electrician may supervise up to three (3) apprentice electricians on a single electrical job.", "citation": "17-28-312", "state": "AR"}}, {"field": "apprentice_unsupervised_hours_allowed", "type": "integer", "vocabulary": [], "meaning": "Maximum hours per 24-hour period that a fourth-year or later apprentice electrician may work without direct supervision.", "depth": 0, "example": {"value": 8, "quote": "beginning in a licensed apprentice electrician's fourth year of training, a licensed apprentice electrician may work without supervision for a period not to exceed eight hours in any 24-hour period", "citation": "Section 302 - Qualifications for licensure.", "state": "UT"}}, {"field": "apprentice_unsupervised_year_threshold", "type": "integer", "vocabulary": [], "meaning": "The year of apprenticeship training at which an apprentice electrician first becomes eligible to work limited hours without direct supervision.", "depth": 0, "example": {"value": 4, "quote": "beginning in a licensed apprentice electrician's fourth year of training, a licensed apprentice electrician may work without supervision for a period not to exceed eight hours in any 24-hour period", "citation": "Section 302 - Qualifications for licensure.", "state": "UT"}}, {"field": "residential_apprentice_supervisor_ratio_max", "type": "integer", "vocabulary": [], "meaning": "Maximum number of apprentice electricians a licensed supervisor may oversee on a residential project.", "depth": 0, "example": {"value": 6, "quote": "The supervision ratio in a residential setting shall be one (1) residential electrician, journeyman electrician, or master electrician to no more than six (6) apprentice electricians.", "citation": "Idaho Code § 54-1010", "state": "ID"}}, {"field": "qualifier_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensed electrical contractor entity must designate a qualifying individual who holds the relevant journeyman or master license and exercises material authority over the business.", "depth": 0, "example": {"value": true, "quote": "A person may not qualify for or operate as an electrical administrator for more than one registered contractor.", "citation": "08.40.130", "state": "AK"}}, {"field": "qualifier_license_requirement_by_contractor_type", "type": "list", "vocabulary": [], "meaning": "The specific electrician license tier that the qualifier for each type of electrical contractor must hold.", "depth": 0, "example": {"value": ["Electrical contractor: must be a master electrician or employ a master electrician as superintendent or manager"], "quote": "Any person, member, or employee of a firm, partnership, or corporation desiring to engage in the business of electrical contractor may apply for and be issued a license upon satisfying the Board of El", "citation": "17-28-302", "state": "AR"}}, {"field": "qualifier_replacement_notice_days", "type": "integer", "vocabulary": [], "meaning": "Number of days within which a contractor must notify the licensing division in writing after a qualifier ceases association with the business.", "depth": 0, "example": {"value": 15, "quote": "Failure to notify the registrar in writing within a period of fifteen days of any disassociation of the person who qualified for the license.", "citation": "A.R.S. § 32-1154", "state": "AZ"}}, {"field": "qualifier_replacement_grace_period_days", "type": "integer", "vocabulary": [], "meaning": "Number of days a contractor license remains in force after a qualifier ceases association, during which a replacement qualifier must be named.", "depth": 0, "example": {"value": 60, "quote": "The licensee must qualify through another person within sixty days after the date of disassociation.", "citation": "A.R.S. § 32-1154", "state": "AZ"}}, {"field": "long_term_compliance_qualifier_waiver_years", "type": "integer", "vocabulary": [], "meaning": "Number of consecutive years of violation-free licensure after which an electrical contractor business entity may substitute an active licensed employee name for a named individual qualifier at renewal.", "depth": 0, "example": {"value": 5, "quote": "A licensee may apply in writing to the registrar for exemption from a qualifying party. The licensee must show to the satisfaction of the registrar that during the past five years the licensee: 1. Hel", "citation": "A.R.S. § 32-1125", "state": "AZ"}}, {"field": "journeyman_electrician_apprenticeship_hours", "type": "integer", "vocabulary": [], "meaning": "Minimum hours of full-time apprenticeship training required to qualify for a journeyman electrician license via the apprenticeship pathway.", "depth": 0, "example": {"value": 8000, "quote": "Have over 8,000 hours of full-time experience performing electrical work under the supervision of a licensed master electrician, master electrician special, limited electrician or limited electrician ", "citation": "§ 1408. Qualifications of applicant [For application of this section, see 81 Del. Laws, c. 290, § 5] [Effective until July 1, 2026].", "state": "DE"}}, {"field": "journeyman_electrician_experience_alternative_years", "type": "integer", "vocabulary": [], "meaning": "Years of full-time electrical experience accepted as an alternative pathway to journeyman electrician licensure in lieu of a formal apprenticeship.", "depth": 0, "example": {"value": 4, "quote": "At least four years' apprenticeship in the electrical trade or four years' practical experience in wiring for, installing, and repairing electrical apparatus and equipment for electric light, heat, an", "citation": "12-115-110", "state": "CO"}}, {"field": "master_electrician_journeyman_experience_years", "type": "integer", "vocabulary": [], "meaning": "Years of practical experience as a journeyman electrician required to qualify for a master electrician license via the experience pathway.", "depth": 0, "example": {"value": 4, "quote": "Four years of practical experience as a journeyman electrician in charge of jobs.", "citation": "34-36-3", "state": "AL"}}, {"field": "master_electrician_engineering_degree_pathway", "type": "boolean", "vocabulary": [], "meaning": "Whether a graduate electrical engineering degree from an accredited institution, combined with reduced practical experience, is an accepted pathway to master electrician licensure.", "depth": 0, "example": {" d licensure pathway exists for applicants who can clearly demonstrate equivalent knowledge and skills without meeting the standard experience or training requirements.", "depth": 0, "example": {"value": true, "quote": "Notwithstanding Section 7065, the registrar may waive the examination for a contractor's license under any of the following circumstances", "citation": "[7065.1]", "state": "CA"}}, {"field": "electrician_continuing_education_hours", "type": "integer", "vocabulary": [], "meaning": "Total hours of continuing education a licensed electrician (journeyman through master) must complete per two-year renewal cycle.", "depth": 0, "example": {"value": 14, "quote": "All persons holding an electrical contractor license shall be required to complete 14 hours of continuing education every two years.", "citation": "34-36-8", "state": "AL"}}, {"field": "approved_continuing_education_providers", "type": "list", "vocabulary": [], "meaning": "Named organizations whose courses are approved to satisfy electrician continuing education requirements.", "depth": 0, "example": {"value": ["accredited college or university", "established industry training program", "any other provider whose training is conducted in compliance with rules promulgated by the board, in collaboration with established industry training programs and industry representatives"], "quote": "at least two hundred eighty-eight hours of training in safety, the national electrical code and its applications, and any other training required by the board that is provided by an accredited college", "citation": "12-115-110", "state": "CO"}}, {"field": "national_electrical_code_reference", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute explicitly references the National Electrical Code as the governing standard for electrical work.", "depth": 0, "example": {"value": true, "quote": "familiarity with the regulations contained in the National Electrical Code and the National Electrical Safety Code, as approved by the American National Standards Institute", "citation": "08.40.120", "state": "AK"}}, {"field": "gas_appliance_work_certification_required", "type": "boolean", "vocabulary": [], "meaning": "Whether electricians or contractors performing installation, repair, or replacement of gas appliances or combustion systems must obtain a separate certification beyond their electrician license.", "depth": 0, "example": {"value": true, "quote": "Any person described in Subsection (2)(b) that performs work described in Subsection (2)(a): (i) must first receive training and certification as specified in rules adopted by the commission, with the", "citation": "Section 308 - Scope of practice -- Installation, repair, maintenance, or replacement of gas appliance, combustion system, automatic fire sprinkler system, or battery-powered fence -- Rules.", "state": "UT"}}, {"field": "small_project_dollar_threshold_exemption", "type": "integer", "vocabulary": [], "meaning": "Maximum total project cost (labor and materials) below which a person may perform certain construction work without a contractor license, with electrical and plumbing work explicitly excluded from this exemption.", "depth": 0, "example": {"value": 5000, "quote": "electrical work, the cost of which does not exceed $5,000, involving residences or small commercial establishments in communities that (A) have a population of under 500", "citation": "08.40.190", "state": "AK"}}, {"field": "solar_panel_electrical_work_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether electrical work incidental to installing or repairing solar panels is exempt from standard electrician licensure requirements.", "depth": 0, "example": {"value": true, "quote": "employees of or any contractor employed by and under the direction of a properly licensed solar contractor, performing work limited to the hoisting, placement and anchoring of solar collectors, photov", "citation": "Sec. 20-340", "state": "CT"}}, {"field": "hot_tub_sign_electrical_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether electrical work incidental to installing or repairing an above-ground prebuilt hot tub or on-premise signage is exempt from electrician licensure.", "depth": 0, "example": {"value": false, "quote": "The installation, repair, or maintenance of signs of billboards; provided, however, an electrical license is required to perform a final connection to a branch circuit conductor. The installation or m", "citation": "40-11-360", "state": "SC"}}, {"field": "utility_worker_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether persons employed by electric utilities, railroads, telephone corporations, or municipal utilities are exempt from electrician licensure for work incidental to those employers' operations.", "depth": 0, "example": {"value": true, "quote": "AS 08.40.005 - 08.40.200 do not apply to any utility or municipality engaged in (1) electrical construction and maintenance of electrical wiring for the generation and distribution of electrical curre", "citation": "08.40.190", "state": "AK"}}, {"field": "financial_responsibility_bond_option", "type": "boolean", "vocabulary": [], "meaning": "Whether an electrical contractor applicant may satisfy the financial responsibility requirement by submitting a surety bond as an alternative to completing a financial questionnaire.", "depth": 0, "example": {"value": true, "quote": "Before granting an original contractor's license, the registrar shall require of the applicant a surety bond in a form acceptable to the registrar or a cash deposit as provided in this section.", "citation": "A.R.S. § 32-1152", "state": "AZ"}}, {"field": "workers_compensation_insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Whether proof of workers' compensation insurance covering employees is required before the division will issue an electrical contractor license.", "depth": 0, "example": {"value": true, "quote": "An attestation that the applicant has complied with the statutes and rules governing workers' compensation insurance. If the applicant is required by law to secure workers' compensation insurance purs", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "public_liability_insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Whether proof of public liability insurance in division-specified amounts is required before the division will issue an electrical contractor license.", "depth": 0, "example": {"value": true, "quote": "submits proof of general liability insurance as required by the Board.", "citation": "§ 1411. Issuance and renewal of licenses [Effective until July 1, 2026].", "state": "DE"}}]}], "example_state": null}, "hvac": {"profession": "hvac", "data_as_of": "2026-07-18", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development except where the context otherwise requires", "citation": "08.40.490", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development except where the context otherwise requires", "citation": "08.40.490", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "department", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development except where the context otherwise requires", "citation": "08.40.490", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Labor and Licensing", "quote": "The secretary of the board shall be a representative of the Department of Labor and Licensing", "citation": "17-33-201", "state": "AR"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 18, "quote": "Be an individual of at least eighteen (18) years of age", "citation": "17-33-302", "state": "AR"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "The board shall examine the character, fitness, and qualifications of every individual who applies for a certified heating, air conditioning, or refrigeration contractor license", "citation": "34-31-28", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "graduate of an approved heating, air conditioning, or refrigeration curriculum", "quote": "completed 3,000 hours of work experience, as defined by the board, or is a graduate of an approved heating, air conditioning, or refrigeration curriculum.", "citation": "34-31-28", "state": "AL"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "accredited college or university (board finds acceptable)", "quote": "from an accredited college or university in the United States which the board finds acceptable", "citation": "45:16A-13", "state": "NJ"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "none", "quote": "completed 3,000 hours of work experience, as defined by the board, or is a graduate of an approved heating, air conditioning, or refrigeration curriculum.", "citation": "34-31-28", "state": "AL"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "is a graduate of an approved heating, air conditioning, or refrigeration curriculum.", "citation": "34-31-28", "state": "AL"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "completed 3,000 hours of work experience, as defined by the board, or is a graduate of an approved heating, air conditioning, or refrigeration curriculum.", "citation": "34-31-28", "state": "AL"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "Each applicant shall be examined to determine the applicant's ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field", "citation": "08.40.270", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "Each applicant shall be examined to determine the applicant's ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field", "citation": "08.40.270", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "3,000 hours", "quote": "completed 3,000 hours of work experience, as defined by the board", "citation": "34-31-28", "state": "AL"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "work experience in heating, air conditioning, or refrigeration", "quote": "completed 3,000 hours of work experience, as defined by the board", "citation": "34-31-28", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Mechanical Administrator Licensing Examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Tests ability to understand plans/design specs, knowledge of mechanical installations and piping, familiarity with Uniform Plumbing Code, Uniform Mechanical Code, and related codes, and personal skill and ability.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "DE"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 110, "quote": "The fee for renewal of a certificate shall be one hundred ten dollars.", "citation": "Sec. 20-341y", "state": "CT"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "may be renewed on a date set by the department upon proof of continued competency", "citation": "08.40.290", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 4, "quote": "All certified contractors shall be required to complete at least four hours of continuing education every year.", "citation": "34-31-26", "state": "AL"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 1, "quote": "All certified contractors shall be required to complete at least four hours of continuing education every year.", "citation": "34-31-26", "state": "AL"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["workers' compensation", "business practices", "workplace safety", "wind mitigation methodologies (for applicable categories)", "laws and rules (1 hour)", "Florida Building Code advanced/specialized module courses"], "quote": "The board shall establish by rule that a portion of the required 14 hours must deal with the subject of workers' compensation, business practices, workplace safety, and, for applicable licensure categ", "citation": "489.115", "state": "FL"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "If an applicant for a license submits proof satisfactory to the department that the applicant is licensed as a mechanical administrator or the equivalent by another state or territory, meets qualifica", "citation": "08.40.270", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must show proof of licensure as mechanical administrator or equivalent by another state or territory, meet qualifications established by the department, and have passed an equivalent examination; department shall waive exam requirement.", "quote": "the department shall waive all of the examination required under (a) of this section", "citation": "08.40.270", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "regulation of electrical and mechanical administrators under AS 08.40", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Committee of Mechanical Examiners", "quote": "There is hereby established the Committee of Mechanical Examiners, which shall consist of five (5) members.", "citation": "59-1850.4", "state": "OK"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "Assists and advises the Board on rulemaking, examinations, licensing, and registration matters; conducts examinations for applicants.", "quote": "The Committee shall: 1. Assist and advise the Board on all matters pertaining to the formation of rules pursuant to the provisions of the Mechanical Licensing Act; 2. Assist and advise the Board on th", "citation": "59-1850.4", "state": "OK"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "Environmental Protection Agency (EPA) CFC certification", "quote": "Has been certified at the appropriate level for handling chlorofluorocarbons (CFC's) by a testing organization approved by the Environmental Protection Agency", "citation": "§ 1821. Qualifications of applicant — Heating, ventilation, air conditioning, and refrigeration.", "state": "DE"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "Mechanical Contractors Association of Arkansas, Inc.", "quote": "One (1) member of the board shall be a member of the Mechanical Contractors Association of Arkansas, Inc., who holds a current state contractor's license.", "citation": "17-33-201", "state": "AR"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraudulent_application", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "License application is fraudulent or misleading", "state": "AK"}}, {"field": "alternative_regulation", "typ ience required for licensure.", "depth": 0, "example": {"value": 4, "quote": "Have a minimum of four years' practical or management trade experience, at least two of which must have been within the last ten years, dealing specifically with the type of construction, or its equiv", "citation": "A.R.S. § 32-1122", "state": "AZ"}}, {"field": "prelicensure_course_hours", "type": "integer", "vocabulary": [], "meaning": "Number of hours in the required pre-licensure course that must be completed before a contractor license is issued.", "depth": 0, "example": {"value": 120, "quote": "The education of a \"specialty limited heating journeyman\" shall include one hundred twenty (120) hours of instruction approved by the board for career technical education in LP gas specialty education", "citation": "Idaho Code § 54-5003", "state": "ID"}}, {"field": "business_law_course_hours", "type": "integer", "vocabulary": [], "meaning": "Number of hours in a required business and law course that must be completed as part of the licensure process.", "depth": 0, "example": {"value": 5, "quote": "if the applicant is applying for licensure as a general building contractor, general engineering contractor, residential and small commercial contractor, general plumbing contractor, residential plumb", "citation": "Section 302", "state": "UT"}}, {"field": "qualifier_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensed contractor entity must designate a named individual qualifier who holds the relevant trade license and exercises material authority over the business.", "depth": 0, "example": {"value": true, "quote": "A person may not qualify or operate as a mechanical administrator for more than one registered contractor, corporation, joint venture, or other business entity", "citation": "08.40.280", "state": "AK"}}, {"field": "qualifier_license_type_required", "type": "list", "vocabulary": [], "meaning": "The specific individual trade license(s) that the qualifier for an H t be filed before a license is issued.", "depth": 0, "example": {"value": true, "quote": "Establish by board rule a minimum level of general liability insurance coverage for a license if the board determines that a specific class of license requires insurance coverage", "citation": "17-33-202", "state": "AR"}}, {"field": "small_project_exemption_threshold_dollars", "type": "integer", "vocabulary": [], "meaning": "Dollar threshold below which a project may be performed without a contractor license, subject to stated exclusions.", "depth": 0, "example": {"value": 50000, "quote": "mechanical work, the cost of which does not exceed $50,000, involving residences or small commercial establishments in communities that (A) have a population of under 5,000", "citation": "08.40.390", "state": "AK"}}, {"field": "hvac_exempt_from_small_project_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether HVAC system installation, repair, or replacement is explicitly excluded from the general small-project dollar-threshold exemption from licensure.", "depth": 0, "example": {"value": true, "quote": "The exemptions from licensure pursuant to subsection A, paragraphs 4, 9 and 14 of this section do not apply to either of the following: ... 2. All work done, including installing, maintaining and repa", "citation": "A.R.S. § 32-1121", "state": "AZ"}}, {"field": "license_number_on_permits_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the contractor's license number must appear on all permit applications, contracts, agreements, or bids.", "depth": 0, "example": {"value": true, "quote": "Every contractor licensed under this chapter shall display the contractor's certification number and the company name on all documentation, forms of advertising, and on all service and installation ve", "citation": "34-31-24", "state": "AL"}}, {"field": "scope_expansion_by_rule_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether the licensing commission may expand the authorized scope of work for an HVAC contractor beyond the statutory definition through administrative rulemaking.", "depth": 0, "example": {"value": true, "quote": "The department may adopt regulations establishing categories of mechanical administrators, qualifications for those categories, and the content of examinations for applicants for each category.", "citation": "08.40.230", "state": "AK"}}]}], "example_state": null}, "medicine": {"profession": "medicine", "data_as_of": "2026-07-18", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "State Medical Board", "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "State Medical Board", "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "standalone_board", "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board, consisting of five physicians licensed in the state", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.64.380", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 21, "quote": "Is at least twenty-one (21) years of age", "citation": "17-95-403", "state": "AR"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "if the commission finds that the applicant is of good moral character and has been duly certified by the board, the commission shall issue to such applicant a license", "citation": "34-24-333", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Certificate of graduation from a legally chartered medical school accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "quote": "submit a certificate of graduation from a legally chartered medical school accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Assoc", "citation": "08.64.200", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "quote": "accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "citation": "08.64.200", "state": "AK"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "doctorate", "quote": "submit a certificate of graduation from a legally chartered medical school accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Assoc", "citation": "08.64.200", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "national_accreditor", "quote": "accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Association", "citation": "08.64.200", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "submit a certificate of graduation from a legally chartered medical school accredited by the Association of American Medical Colleges and the Council on Medical Education of the American Medical Assoc", "citation": "08.64.200", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "US/Canadian medical school graduate", "state": "AR"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education f
