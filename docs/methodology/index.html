"vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "none", "quote": "The board shall issue licenses to persons who have, by examination and experience, shown themselves competent and qualified to engage in the business, trade, or calling of a residential plumber, journ", "citation": "12-155-110", "state": "CO"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "If the applicant is a graduate of a community college or trade school plumbing program approved by the board", "citation": "12-155-110", "state": "CO"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "The board shall issue licenses to persons who have, by examination and experience, shown themselves competent and qualified", "citation": "12-155-110", "state": "CO"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "journeyperson plumber (standard pathway)", "state": "RI"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "none", "state": "RI"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "Each applicant shall be examined to determine the applicant's (1) ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field; (2) knowledge of mech", "citation": "08.40.270", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "Each applicant shall be examined to determine the applicant's (1) ability to understand plans, design specifications, and engineering terms commonly used in the mechanical field; (2) knowledge of mech", "citation": "08.40.270", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "Two years (journeyman); one year as journeyman (master)", "quote": "Applicants for examination for a master plumber certificate shall submit proof to the board that the applicant has at least one year of current work experience as a journeyman plumber.", "citation": "34-37-6", "state": "AL"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "work experience as apprentice plumber/gas fitter or board-approved apprentice training program; then as journeyman for master", "quote": "An applicant for examination for a journeyman plumber or gas fitter certificate shall submit proof that the applicant has two years of current work experience as an apprentice plumber or gas fitter or", "citation": "34-37-6", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Mechanical Administrator Examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Tests knowledge of plans/design specs, mechanical installations, Uniform Plumbing Code, Uniform Mechanical Code, and personal skill. May be waived if applicant holds equivalent license from another state and has passed equivalent exam.", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "DE"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 150, "quote": "The board may renew such license if the application for such renewal is received by the board no later than one month after the date of expiration of such license, upon payment to the department of a ", "citation": "Sec. 20-335", "state": "CT"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "The board, by rule, may adopt continuing education requirements for licensees and may develop and produce courses, approve continuing education courses and providers, and set those fees necessary to a", "citation": "34-37-8", "state": "AL"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 8, "quote": "the board shall not renew or reinstate a license unless the applicant has completed eight hours of continuing education for every twelve months that have passed", "citation": "12-155-112", "state": "CO"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 1, "quote": "eight hours of continuing education for every twelve months that have passed after the later of the last date of renewal or reinstatement", "citation": "12-155-112", "state": "CO"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["course work related to the code, including core competencies"], "quote": "The requirements and standards must include course work related to the code, including core competencies, as determined by the board.", "citation": "12-155-112", "state": "CO"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "If an applicant for a license submits proof satisfactory to the department that the applicant is licensed as a mechanical administrator or the equivalent by another state or territory, meets qualifica", "citation": "08.40.270", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Applicant must hold equivalent license from another state or territory, meet qualifications established by the department, and have passed an equivalent examination. The examination requirement is waived; other requirements still apply.", "quote": "the department shall waive all of the examination required under (a) of this section", "citation": "08.40.270", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "regulation of electrical and mechanical administrators under AS 08.40", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Committee of Plumbing Examiners", "quote": "The State Board of Health shall appoint a Committee of Plumbing Examiners consisting of seven (7) voting members", "citation": "17-38-202", "state": "AR"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "The committee and other employees of the department shall serve the board in an advisory capacity in the formulating of rules to be adopted by the board; the committee also conducts examinations, issues temporary permits, and may suspend or recommend revocation of licenses", "quote": "the committee and other employees of the department shall serve the board in an advisory capacity in the formulating of rules to be adopted by the board", "citation": "17-38-202", "state": "AR"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Inspection Testing Certification (NITC) Corporation", "quote": "has been issued a valid certification from the national inspection testing certification (NITC) corporation, or an equivalent authority approved by the board", "citation": "105.2", "state": "IA"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "International Association of Plumbing and Mechanical Officials; International Conference of Building Officials", "quote": "subject to the Uniform Plumbing Code, Uniform Swimming Pool, Spa, and Hot Tub Code, Uniform Solar Energy Code, and the Uniform Mechanical Code as published by the International Association of Plumbing", "citation": "08.40.490", "state": "AK"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not act as a mechanical administrator without a license unless the person is covered by an exclusion under AS 08.40.390.", "citation": "08.40.260", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraudulent_application", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "License application is fraudulent or misleading", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": {"value": true, "quote": "Before granting an original contractor's license, the registrar shall require of the applicant a surety bond in a form acceptable to the registrar or a cash deposit as provided in this section. No con", "citation": "A.R.S. § 32-1152", "state": "AZ"}}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": true, "quote": "the board shall require as a condition precedent to the issuance, reinstatement, reactivation, renewal, or continued maintenance of a license, that the applicant or licensee have on file at all times ", "citation": "Section 7125.", "state": "CA"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "A person shall not operate as a plumbing contractor until the contractor has obtained registration from the board. The board shall register a plumbing contractor upon payment of the fee as provided in", "citation": "12-155-108", "state": "CO"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.230", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "statute", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act lets (or reserves to) this profession — the defined scope,\nauthorized methods, drug authority, and any title/scope protection. Skeleton only —\nprofession-specific scope richness lives in the discovered block.", "fields": [{"field": "definition_quote", "type": "string", "vocabulary": [], "meaning": "Verbatim statutory definition; quote field repeats the value text.", "depth": 0, "example": {"value": "\"mechanical administrator\" means a person who is responsible for (A) installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the Uniform Plumbing Code, Uniform Swimming Pool, Spa, and Hot Tub Code, Uniform Solar Energy Code, and the Uniform Mechanical Code as published by the International Association of Plumbing and Mechanical Officials and the International Conference of Building Officials; or (B) certifying that an installation or modification described in (A) of this paragraph complies with the applicable codes", "quote": "\"mechanical administrator\" means a person who is responsible for (A) installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the U", "citation": "08.40.490", "state": "AK"}}, {"field": "methods_authorized", "type": "list", "vocabulary": [], "meaning": "High-level methods, e.g. ['medical','surgical','mechanical']", "depth": 0, "example": {"value": ["installing mechanical piping and systems", "modifying mechanical piping and systems", "installing devices, fixtures, equipment, or other mechanical materials", "certifying that an installation or modification complies with applicable codes"], "quote": "installing or modifying mechanical piping and systems, devices, fixtures, equipment, or other mechanical materials subject to the Uniform Plumbing Code", "citation": "08.40.490", "state": "AK"}}, {"field": "drug_authority", "type": "string", "vocabulary": [], "meaning": "Whether/how the profession may prescribe, administer, or dispense drugs.", "depth": 0, "example": null}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the scope fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.40.490", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "statute", "state": "AK"}}]}, {"group": "profession_specific", "intro": "Fields discovered specifically for this profession (auto-derived from its statutes); they vary profession to profession.", "fields": [{"field": "license_tiers", "type": "list", "vocabulary": [], "meaning": "The distinct license classification tiers available for plumbers, from apprentice through master and contractor levels.", "depth": 0, "example": {"value": ["mechanical administrator (categories set by department regulation)"], "quote": "The department may adopt regulations establishing categories of mechanical administrators, qualifications for those categories, and the content of examinations for applicants for each category.", "citation": "08.40.230", "state": "AK"}}, {"field": "residential_scope_limited", "type": "boolean", "vocabulary": [], "meaning": "Whether a residential-tier plumber license restricts the licensee to work only on residential buildings (typically single or multi-family dwellings up to four units).", "depth": 0, "example": {"value": true, "quote": "Specialty residential contracting, which is engaging in the residential contracting business by the performance of construction work requiring special skill and involving the use of specialized constr", "citation": "A.R.S. § 32-1102", "state": "AZ"}}, {"field": "residential_building_unit_cap", "type": "integer", "vocabulary": [], "meaning": "Maximum number of dwelling units in a building that a residential-tier plumber or contractor license authorizes work on.", "depth": 0, "example": {"value": 8, "quote": "A residential jobsite shall also mean up to eight attached residential dwellings located under one roof assembly.", "citation": "34-37-1", "state": "AL"}}, {"field": "apprentice_supervision_requirement", "type": "string", "vocabulary": [], "meaning": "Description of which license types are authorized to directly supervise a licensed apprentice plumber.", "depth": 0, "example": {"value": "An apprentice plumber must work directly under the supervision of a journeyman or master plumber.", "quote": "shall work directly under the supervision of a journeyman or master gas fitter or plumber", "citation": "34-37-1", "state": "AL"}}, {"field": "apprentice_unsupervised_hours_allowed", "type": "integer", "vocabulary": [], "meaning": "Maximum number of hours per 24-hour period that a fourth-year or later apprentice plumber may work without direct supervision.", "depth": 0, "example": {"value": 8, "quote": "beginning in a licensed apprentice plumber's fourth year of training, a licensed apprentice plumber may work without supervision for a period not to exceed eight hours in any 24-hour period", "citation": "Section 302 - Qualifications for licensure.", "state": "UT"}}, {"field": "apprentice_unsupervised_training_year_threshold", "type": "integer", "vocabulary": [], "meaning": "The year of apprenticeship training at which an apprentice plumber first becomes eligible to work limited hours without direct supervision.", "depth": 0, "example": {"value": 4, "quote": "\"Final year of apprenticeship\" means when an apprentice plumber has obtained four hundred eighty (480) hours or more of classroom instruction and completed six thousand (6,000) or more hours of on-the", "citation": "17-38-101", "state": "AR"}}, {"field": "apprentice_to_supervisor_ratio_regulated", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute establishes or delegates authority to set a maximum ratio of apprentice plumbers per supervising licensee.", "depth": 0, "example": {"value": true, "quote": "The board may set a ratio of apprentice plumbers and apprentice gas fitters working under the supervision of any journeyman or master plumber or gas fitter; provided, the ratio shall be not less than ", "citation": "34-37-6.1", "state": "AL"}}, {"field": "journeyman_experience_pathways", "type": "list", "vocabulary": [], "meaning": "Alternative pathways an applicant may use to satisfy the experience requirement for journeyman plumber licensure.", "depth": 0, "example": {"value": ["two years of current work experience as an apprentice plumber or gas fitter", "completed an apprentice training program approved by the board"], "quote": "An applicant for examination for a journeyman plumber or gas fitter certificate shall submit proof that the applicant has two years of current work experience as an apprentice plumber or gas fitter or", "citation": "34-37-6", "state": "AL"}}, {"field": "master_plumber_supervisory_experience_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a master plumber applicant must demonstrate supervisory experience as a journeyman plumber in addition to time-in-grade.", "depth": 0, "example": {"value": false, "quote": "Applicants for examination for a master plumber certificate shall submit proof to the board that the applicant has at least one year of current work experience as a journeyman plumber.", "citation": "34-37-6", "state": "AL"}}, {"field": "expedited_licensure_pathway_available", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute provides an expedited licensure pathway for applicants who can otherwise demonstrate equivalent knowledge and skills.", "depth": 0, "example": {"value": true, "quote": "The Committee of Plumbing Examiners shall approve an applicant for master plumber or journeyman plumber examination provided that the applicant is currently licensed as a master plumber or journeyman ", "citation": "17-38-304", "state": "AR"}}, {"field": "plumbing_trade_geographic_limit_feet", "type": "integer", "vocabulary": [], "meaning": "How many feet beyond the outside walls of a building the plumbing trade definition extends.", "depth": 0, "example": {"value": 5, "quote": "installation of water lines or sanitary, storm, or drain sewer lines more than five feet from a building", "citation": "08.40.390", "state": "AK"}}, {"field": "gas_supply_work_included_in_scope", "type": "boolean", "vocabulary": [], "meaning": "Whether the delivery of gas for lighting, heating, and industrial purposes is explicitly included within the plumbing trade scope.", "depth": 0, "example": {"value": true, "quote": "GAS FITTING, GAS SYSTEMS, or GAS WORK. The installation, repair of pipes, fixtures, fittings, appliances, or apparatus necessary for supplying natural gas for residential or commercial use from the po", "citation": "34-37-1", "state": "AL"}}, {"field": "natural_gas_appliance_certification_required", "type": "boolean", "vocabulary": [], "meaning": "Whether a separate certification (beyond the plumbing license) is required before a licensee may install, repair, or replace a residential or commercial gas appliance or combustion system.", "depth": 0, "example": {"value": false, "quote": "This chapter shall not be construed to prevent any contractor certified by the Alabama Board of Heating, Air Conditioning, and Refrigeration Contractors from installing, replacing, or performing servi", "citation": "34-37-1", "state": "AL"}}, {"field": "fire_sprinkler_work_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensed journeyman plumber is authorized to perform installation, repair, or replacement of water-based fire protection systems.", "depth": 0, "example": {"value": false, "quote": "design, installation, maintenance, or repair of fire extinguishing systems", "citation": "08.40.390", "state": "AK"}}, {"field": "natural_gas_facilities_installation_authorized", "type": "boolean", "vocabulary": [], "meaning": "Whether a licensed plumber (as a qualifying installer) is authorized to install natural gas mains and service lines beyond the building.", "depth": 0, "example": {"value": true, "quote": "including the installation of water, natural gas, liquefied petroleum gas and related venting, and storm and sanitary sewer lines", "citation": "489.105", "state": "FL"}}, {"field": "contractor_qualifier_license_requirement", "type": "enum", "vocabulary": ["master plumber required for general plumbing contractor", "master plumber or master residential plumber required for residential plumbing contractor"], "meaning": "The specific individual plumber license tier that the qualifier for a plumbing contractor entity must hold.", "depth": 0, "example": {"value": "master plumber required for general plumbing contractor", "quote": "The individual shall qualify to be a certified master gas fitter or a certified master plumber, or both.", "citation": "34-37-1", "state": "AL"}}, {"field": "qualifier_replacement_notice_days", "type": "integer", "vocabulary": [], "meaning": "Number of days within which a contractor must notify the licensing division after a qualifier ceases association with the business.", "depth": 0, "example": {"value": 15, "quote": "Failure to notify the registrar in writing within a period of fifteen days of any disassociation of the person who qualified for the license.", "citation": "A.R.S. § 32-1154", "state": "AZ"}}, {"field": "qualifier_replacement_grace_period_days", "type": "integer", "vocabulary": [], "meaning": "Number of days a contractor license remains in force after a qualifier ceases association, during which a replacement qualifier must be named.", "depth": 0, "example": {"value": 60, "quote": "The licensee must qualify through another person within sixty days after the date of disassociation.", "citation": "A.R.S. § 32-1154", "state": "AZ"}}, {"field": "long_term_compliance_qualifier_waiver_years", "type": "integer", "vocabulary": [], "meaning": "Number of consecutive violation-free years after which a plumbing or electrical contractor business entity may substitute an active employee license number for a named individual qualifier at renewal.", "depth": 0, "example": {"value": 5, "quote": "The licensee must show to the satisfaction of the registrar that during the past five years the licensee: 1. Held a valid and active license and could legally contract under this chapter for the entir", "citation": "A.R.S. § 32-1125", "state": "AZ"}}, {"field": "minor_plumbing_repair_exemption", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute provides an exemption from licensure for minor plumbing repair work incidental to fixing a fixture or appliance in a residential or small commercial building, provided no piping or gas system is altered.", "depth": 0, "example": {"value": true, "quote": "mechanical work, the cost of which does not exceed $50,000, involving residences or small commercial establishments in communities that (A) have a population of under 5,000 according to the latest ava", "citation": "08.40.390", "state": "AK"}}, {"field": "small_project_dollar_threshold", "type": "integer", "vocabulary": [], "meaning": "Maximum total project cost (labor and materials) below which an unlicensed person may perform certain construction work, with plumbing and electrical systems explicitly excluded from this exemption.", "depth": 0, "example": {"value": 50000, "quote": "mechanical work, the cost of which does not exceed $50,000, involving residences or small commercial establishments in communities", "citation": "08.40.390", "state": "AK"}}, {"field": "continuing_education_hours_plumber", "type": "integer", "vocabulary": [], "meaning": "Number of continuing education hours a licensed plumber (individual, not contractor) must complete per two-year renewal cycle.", "depth": 0, "example": {"value": 8, "quote": "the board shall not renew or reinstate a license unless the applicant has completed eight hours of continuing education for every twelve months that have passed after the later of the last date of ren", "citation": "12-155-112", "state": "CO"}}, {"field": "continuing_education_hours_contractor", "type": "integer", "vocabulary": [], "meaning": "Number of continuing education hours a licensed plumbing contractor must complete per two-year renewal cycle.", "depth": 0, "example": {"value": 7, "quote": "which regulations shall require not more than a total of seven hours of accredited continuing professional education every two years", "citation": "Sec. 20-334d", "state": "CT"}}]}], "example_state": null}, "podiatry": {"profession": "podiatry", "data_as_of": "2026-07-05", "groups": [{"group": "licensure", "intro": "Whether and how the state credentials this profession — the regulatory model,\ncredential type, issuing authority, entry requirements (education, exams, age,\ncharacter), fees, renewal, continuing education, and reciprocity.", "fields": [{"field": "license_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the state requires a credential to practice this profession.", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "issuing_authority", "type": "string", "vocabulary": [], "meaning": "Free-text name of the board/agency that issues the credential (the structured form is `regulatory_authority`).", "depth": 0, "example": {"value": "State Medical Board", "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority", "type": "object", "vocabulary": [], "meaning": "Structured decomposition of the issuing authority — name, type (standalone board / shared board / division / department / joint), and any umbrella agency it sits within. Populated alongside the legacy free-text issuing_authority for back-compat.", "depth": 0, "example": null}, {"field": "regulatory_authority.name", "type": "string", "vocabulary": [], "meaning": "Canonical name of the immediate authority (e.g., 'State Board of Podiatry').", "depth": 1, "example": {"value": "State Medical Board", "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority.type", "type": "enum", "vocabulary": ["standalone_board", "shared_board", "division", "department", "joint", "other"], "meaning": "Structural classification of the immediate authority.", "depth": 1, "example": {"value": "shared_board", "quote": "a board of medical examiners, to be known as the State Medical Board, consisting of five physicians licensed in the state", "citation": "08.64.010", "state": "AK"}}, {"field": "regulatory_authority.umbrella_agency", "type": "string", "vocabulary": [], "meaning": "Higher-level agency that contains the immediate authority, if any. Example: 'Division of Occupations and Professions, Department of Commerce'. Null for standalone boards that don't sit inside a larger department.", "depth": 1, "example": {"value": "Department of Commerce, Community, and Economic Development", "quote": "\"department\" means the Department of Commerce, Community, and Economic Development", "citation": "08.64.380", "state": "AK"}}, {"field": "age_minimum", "type": "integer", "vocabulary": [], "meaning": "Minimum age (years) to hold the credential, if the statute sets one.", "depth": 0, "example": {"value": 19, "quote": "The applicant shall be 19 years of age or over, or the age as the board may by rule determine", "citation": "34-24-255", "state": "AL"}}, {"field": "moral_character_required", "type": "boolean", "vocabulary": [], "meaning": "Whether the statute conditions licensure on good moral character / fitness.", "depth": 0, "example": {"value": true, "quote": "of good moral character, shall be a graduate of a college of podiatry recognized by the American Podiatric Medical Association", "citation": "34-24-255", "state": "AL"}}, {"field": "education", "type": "object", "vocabulary": [], "meaning": "Education entry requirement — degree, level, accreditation, and any tiers.", "depth": 0, "example": null}, {"field": "education.degree_required", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Certificate of graduation from a legally chartered school of podiatry approved by the board", "quote": "submit a certificate of graduation from a legally chartered school of podiatry approved by the board", "citation": "08.64.209", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "American Podiatric Medical Association", "quote": "graduate of a college of podiatry recognized by the American Podiatric Medical Association", "citation": "34-24-255", "state": "AL"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "doctorate", "quote": "submit a certificate of graduation from a legally chartered school of podiatry approved by the board", "citation": "08.64.209", "state": "AK"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "a legally chartered school of podiatry approved by the board", "citation": "08.64.209", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "submit a certificate of graduation from a legally chartered school of podiatry approved by the board", "citation": "08.64.209", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": null}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": null}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": false, "quote": "Each applicant who desires to practice podiatry shall meet the qualifications prescribed in AS 08.64.200(a)(3) - (5) and shall (1) submit a certificate of graduation from a legally chartered school of", "citation": "08.64.209", "state": "AK"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "none", "quote": "Each applicant who desires to practice podiatry shall meet the qualifications prescribed in AS 08.64.200(a)(3) - (5) and shall (1) submit a certificate of graduation from a legally chartered school of", "citation": "08.64.209", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "minimum of one year", "quote": "satisfactory completion of a minimum of a one-year postgraduate residency program", "citation": "17-96-303", "state": "AR"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "podiatric residency", "quote": "shall have completed a podiatric residency approved by the American Podiatric Medical Association or by the State Board of Podiatry under its rules and regulations", "citation": "34-24-255", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Board examination (podiatry)", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "The board calls to its aid a podiatrist of known ability to assist in the examination. Applicants may be waived under AS 08.64.250 (license by credentials).", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "national (National Board of Podiatric Examiners)", "state": "AL"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "AR"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 300, "quote": "submit it to the board in the manner prescribed by the board in the notice before June 30 with the renewal fee of an amount established by the board, but not to exceed Three Hundred Dollars ($300.00)", "citation": "73-27-12", "state": "MS"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "the board shall promote a high degree of competence in the practice of medicine, osteopathy, and podiatry by requiring every licensee of medicine, osteopathy, and podiatry in the state to fulfill cont", "citation": "08.64.312", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 12, "quote": "Such program shall consist of no less than 12 hours", "citation": "34-24-275", "state": "AL"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "Before a license may be renewed, the licensee shall submit evidence to the board or its designee that continuing education requirements prescribed by regulations adopted by the board have been met.", "citation": "08.64.312", "state": "AK"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["pain management and opioid use and addiction (minimum 2 hours per 2-year renewal period)"], "quote": "Continuing education requirements must include not less than two hours of education in pain management and opioid use and addiction in the two years preceding an application for renewal of a license", "citation": "08.64.312", "state": "AK"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "The board may waive the examination requirement and license by credentials if the physician, osteopath, or podiatry applicant meets the requirements of AS 08.64.200, 08.64.205, or 08.64.209, submits p", "citation": "08.64.250", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Active license from a board of medical examiners in another US state, territory, or Canadian province/territory issued after thorough examination; must meet podiatry qualifications under AS 08.64.209; submit proof of continued competence; pay required fee; demonstrate professional competence in pain management and addiction disorders.", "quote": "The board may waive the examination requirement and license by credentials if the physician, osteopath, or podiatry applicant meets the requirements of AS 08.64.200, 08.64.205, or 08.64.209, submits p", "citation": "08.64.250", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "the governor shall appoint a board of medical examiners, to be known as the State Medical Board, consisting of five physicians licensed in the state", "citation": "08.64.010", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "Connecticut Board of Examiners in Podiatry", "quote": "an accredited school or college of chiropody or podiatry approved by the Connecticut Board of Examiners in Podiatry with the consent of the Commissioner of Public Health", "citation": "20-54", "state": "CT"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "The board supervises examinations, approves schools/colleges with consent of Commissioner of Public Health, advises on passing scores, and takes disciplinary action", "quote": "The examination shall be prescribed by the department with the advice and consent of the board. Passing scores shall be established by the department with the consent of the board.", "citation": "20-55", "state": "CT"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Board of Podiatric Examiners", "quote": "shall have successfully passed all parts of the examination given by the National Board of Podiatric Examiners", "citation": "34-24-255", "state": "AL"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "American Podiatric Medical Association", "quote": "shall be a graduate of a college of podiatry recognized by the American Podiatric Medical Association", "citation": "34-24-255", "state": "AL"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice medicine, podiatry, or osteopathy in the state unless the person is licensed under this chapter", "citation": "08.64.170", "state": "AK"}}, {"f on, training, and experience satisfactory to the board; examination standards must at least meet requirements adopted by recognized national examining councils", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "education.accrediting_body", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Accreditation Board for Engineering and Technology, Inc. (ABET)", "quote": "a graduate of an Accreditation Board for Engineering and Technology, Inc., approved engineering curriculum", "citation": "17-30-302", "state": "AR"}}, {"field": "education.degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "The comparable education FLOOR as a normalized rung. Populate whenever licensure is gated on a degree; null only if the statute is silent on education.", "depth": 1, "example": {"value": "bachelor", "quote": "A graduate of an approved engineering curriculum of four years or more from a school or college approved by the board", "citation": "34-11-4", "state": "AL"}}, {"field": "education.school_approval_basis", "type": "enum", "vocabulary": ["national_accreditor", "regional_accreditor", "board_approved", "unspecified"], "meaning": "How the statute decides a school counts. national_accreditor=a named national program accreditor (ACOE/CODA/ACEND/LCME/CPME). regional_accreditor='regionally accredited college or university'. board_approved='approved by the board' (discretionary state gate). unspecified=says 'accredited' with no basis named, or silent.", "depth": 1, "example": {"value": "board_approved", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "education.credential_pegged", "type": "boolean", "vocabulary": [], "meaning": "True if the statute pegs the education requirement to a NATIONAL CREDENTIAL (e.g. 'registered by CDR', 'passed the NBEO') rather than (or in addition to) a stated degree — such a state inherits whatever that national body currently requires.", "depth": 1, "example": {"value": false, "quote": "The procedure and standards shall at least meet the requirements adopted by recognized national examining councils for these professions.", "citation": "08.48.181", "state": "AK"}}, {"field": "education.tiers", "type": "list", "vocabulary": [], "meaning": "Per-tier floors when the statute sets different education levels for different license classes, or phases the floor in by date. Omit/null when there is a single floor. `degree_level` still records the overall floor across all tiers.", "depth": 1, "example": null}, {"field": "education.tiers[].license_class", "type": "string", "vocabulary": [], "meaning": "Which class/date this floor applies to — e.g. 'licensed dietitian', 'certified nutritionist', 'applicants on or after 2024-01-01'.", "depth": 2, "example": {"value": "professional engineer - baccalaureate in engineering/engineering technology", "state": "MT"}}, {"field": "education.tiers[].degree_level", "type": "enum", "vocabulary": ["none", "high_school", "associate", "bachelor", "master", "doctorate"], "meaning": "Normalized education floor, low -> high. Resolved to the rung even when\nthe statute uses verbiage ('six college years' -> doctorate, 'or equivalent\ndegree' -> the named level). Professional/clinical doctorates (OD, DDS, MD,\nDPM) are `doctorate`.", "depth": 2, "example": {"value": "bachelor", "state": "MT"}}, {"field": "education.tiers[].effective_date", "type": "string", "vocabulary": [], "meaning": "ISO date when this floor takes effect, for date-phased tiers (e.g. '2024-01-01'). Null otherwise.", "depth": 2, "example": null}, {"field": "post_degree_experience", "type": "object", "vocabulary": [], "meaning": "Supervised practice / residency / apprenticeship required after the degree.", "depth": 0, "example": null}, {"field": "post_degree_experience.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "has a specific record of an additional four years or more of progressive experience in engineering work of a grade and character satisfactory to the board shall be granted a certificate of licensure t", "citation": "34-11-4", "state": "AL"}}, {"field": "post_degree_experience.experience_source", "type": "enum", "vocabulary": ["required_by_statute", "embedded_in_credential", "none"], "meaning": "ALWAYS populate (required_by_statute / embedded_in_credential / none) unless the governing statute is absent from the corpus. Disambiguates a blank `required`: 'none' (truly no requirement) vs 'embedded_in_credential' (the accredited degree the statute points to carries the supervised hours).", "depth": 1, "example": {"value": "embedded_in_credential", "quote": "shall submit evidence satisfactory to the board of the applicant's education, training, and experience", "citation": "08.48.171", "state": "AK"}}, {"field": "post_degree_experience.duration", "type": "string", "vocabulary": [], "meaning": "e.g. '24 months', '1 year', '2,000 hours' (free text — units vary)", "depth": 1, "example": {"value": "four years or more", "quote": "has a specific record of an additional four years or more of progressive experience in engineering work of a grade and character satisfactory to the board", "citation": "34-11-4", "state": "AL"}}, {"field": "post_degree_experience.kind", "type": "string", "vocabulary": [], "meaning": "e.g. 'podiatric residency', 'accounting work experience', 'AXP'", "depth": 1, "example": {"value": "progressive experience in engineering work", "quote": "progressive experience in engineering work of a grade and character satisfactory to the board", "citation": "34-11-4", "state": "AL"}}, {"field": "exams", "type": "list", "vocabulary": [], "meaning": "Examinations required for the credential (one entry per exam).", "depth": 0, "example": null}, {"field": "exams[].name", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Registration examination", "state": "AK"}}, {"field": "exams[].required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "state": "AK"}}, {"field": "exams[].notes", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "Examinations held at least once each year; candidates failing may reapply per board regulations; standards must at least meet recognized national examining council requirements", "state": "AK"}}, {"field": "exams[].jurisdiction", "type": "string", "vocabulary": [], "meaning": "Where the exam is administered / who owns it — e.g. 'NBPME (national)', 'state board (in-state)', 'NCLEX-RN (national)'. Use the statute's language; null if the source doesn't say.", "depth": 1, "example": {"value": "state (with national standards)", "state": "AK"}}, {"field": "exams[].permitted_attempts", "type": "integer", "vocabulary": [], "meaning": "Max attempts allowed before re-qualification. Null if not specified.", "depth": 1, "example": {"value": 3, "state": "FL"}}, {"field": "renewal", "type": "object", "vocabulary": [], "meaning": "How the credential is renewed — interval and any conditions.", "depth": 0, "example": null}, {"field": "renewal.interval_years", "type": "integer", "vocabulary": [], "meaning": "Most states are 1 or 2", "depth": 1, "example": {"value": 2, "quote": "Licenses shall be renewed biennially on the dates set by the department with the approval of the respective board.", "citation": "UMBRELLA / Chapter 01. Centralized Licensing", "state": "AK"}}, {"field": "renewal_fee_usd", "type": "integer", "vocabulary": [], "meaning": "License renewal fee in US dollars (integer). Many statutes leave the amount to the board's discretion — leave null in that case.", "depth": 0, "example": {"value": 150, "quote": "Renewal shall be effective after the payment of a renewal fee to be fixed by the board at not more than one hundred fifty dollars ($150) per year", "citation": "54-1216", "state": "ID"}}, {"field": "continuing_education", "type": "object", "vocabulary": [], "meaning": "Continuing-education requirement to keep the credential active.", "depth": 0, "example": null}, {"field": "continuing_education.required", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "establishing continuing education requirements for registrants that must be completed before a certificate may be renewed; the requirements may not exceed standards established by a national accrediti", "citation": "08.48.101", "state": "AK"}}, {"field": "continuing_education.hours_per_period", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 18, "quote": "Every licensee must complete 9 continuing education hours for each year of the license renewal period, totaling 18 continuing education hours for the license renewal period.", "citation": "471.017", "state": "FL"}}, {"field": "continuing_education.period_years", "type": "integer", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": 2, "quote": "The board shall adopt rules establishing a procedure for the biennial renewal of licenses.", "citation": "471.017", "state": "FL"}}, {"field": "continuing_education.topical_requirements", "type": "list", "vocabulary": [], "meaning": "Specific topical CE requirements, e.g. ['1.5 hrs opioid', 'ethics']", "depth": 1, "example": {"value": ["state laws and board rules and regulations", "top five types of violations related to administrative and procedural aspects"], "quote": "The material shall be based on state law and the board's rules and regulations relating to the practice of professional engineers. The scope of the assessment shall be limited to the board's top five ", "citation": "6795.2", "state": "CA"}}, {"field": "reciprocity", "type": "object", "vocabulary": [], "meaning": "Whether/how the state recognizes out-of-state credentials (endorsement/reciprocity).", "depth": 0, "example": null}, {"field": "reciprocity.available", "type": "boolean", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": true, "quote": "A person holding a certificate of registration authorizing the person to practice engineering in a state, territory, or possession of the United States, the District of Columbia, or a foreign country ", "citation": "08.48.191", "state": "AK"}}, {"field": "reciprocity.requirements", "type": "string", "vocabulary": [], "meaning": "Free-form summary", "depth": 1, "example": {"value": "Must hold a certificate of registration from another state, territory, possession, DC, or foreign country issued under requirements comparable to Alaska's requirements.", "quote": "may, upon application, be registered in accordance with regulations of the board if the person's certificate was issued under requirements comparable to the requirements in this state.", "citation": "08.48.191", "state": "AK"}}, {"field": "advisory_board", "type": "object", "vocabulary": [], "meaning": "Profession-specific advisory body sitting alongside the main licensing board, when one exists. Populated for states that delegate licensure to a generic board and add a specialty advisory committee.", "depth": 0, "example": null}, {"field": "advisory_board.exists", "type": "boolean", "vocabulary": [], "meaning": "True if a profession-specific advisory body exists alongside the main licensing board. False if the licensing board itself is profession-specific (no separate advisory body needed).", "depth": 1, "example": {"value": false, "quote": "There is created the State Board of Registration for Architects, Engineers, and Land Surveyors. The board shall administer the provisions of this chapter", "citation": "08.48.011", "state": "AK"}}, {"field": "advisory_board.name", "type": "string", "vocabulary": [], "meaning": "Name of the advisory board, e.g. 'Podiatry Advisory Committee'.", "depth": 1, "example": {"value": "State Board of Professional Engineers", "quote": "\"Board\" means the State Board of Professional Engineers of the Department.", "citation": "225 ILCS 325/4", "state": "IL"}}, {"field": "advisory_board.authority", "type": "string", "vocabulary": [], "meaning": "Authority the advisory board has, in the statute's own words — e.g. 'advisory only', 'rulemaking subject to board approval', 'disciplinary recommendations'. Free text from the statute.", "depth": 1, "example": {"value": "advisory capacity to the Secretary; makes written recommendations on qualifications for licensure, curriculum content, standards of professional conduct, and formal disciplinary actions", "quote": "Obtain written recommendations from the Board regarding qualifications of individuals for licensure and enrollment, definitions of curriculum content and approval of engineering curricula, standards o", "citation": "225 ILCS 325/5", "state": "IL"}}, {"field": "national_certification", "type": "string", "vocabulary": [], "meaning": "Name of a national CERTIFICATION the state recognizes or requires, e.g. 'American Board of Podiatric Surgery (ABPS)' or 'National Board of Podiatric Medical Examiners (NBPME)'. The certifying body, NOT the association. Null if the statute doesn't reference one.", "depth": 0, "example": {"value": "National Bureau of Engineering Registration", "quote": "any person who holds a certificate of qualification, licensure or registration issued to such person by the proper authority of any state, territory or possession of the United States, or any country,", "citation": "Sec. 20-308", "state": "CT"}}, {"field": "national_association", "type": "string", "vocabulary": [], "meaning": "Professional ASSOCIATION the state references (e.g. for accreditation or CE provider approval) — 'American Podiatric Medical Association (APMA)', 'American Dental Association (ADA)'. Distinct from the certifying body. Null if not referenced.", "depth": 0, "example": {"value": "National Council of Examiners for Engineering and Surveying (NCEES)", "quote": "Maintain membership in the National Council of Examiners for Engineering and Surveying and participate in activities of the Council", "citation": "225 ILCS 325/5", "state": "IL"}}, {"field": "regulatory_model", "type": "enum", "vocabulary": ["market_forces", "voluntary_certification", "registration", "exemption", "mandatory_certification", "license"], "meaning": "Which UORF model the state applies to this profession (license / mandatory_cert / registration / etc).", "depth": 0, "example": {"value": "license", "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state, or use in connection with the person's name or other", "citation": "08.48.281", "state": "AK"}}, {"field": "credential_type", "type": "enum", "vocabulary": ["none", "registration", "certification", "license", "exemption"], "meaning": "What SHAPE of credential does the state issue, independent of whether holding it is mandatory? license / certification / registration / exemption / none. Pairs with is_mandatory to decompose the legacy regulatory_model rung.", "depth": 0, "example": {"value": "license", "quote": "An applicant who fulfills the requirements set out by the board shall be awarded a certificate of registration authorizing the holder to offer or perform services or work for the public, or to certify", "citation": "08.48.211", "state": "AK"}}, {"field": "is_mandatory", "type": "boolean", "vocabulary": [], "meaning": "Is the credential MANDATORY to practice (or claim the title) in this state? True if practicing without it is prohibited; False if optional (e.g., voluntary certification that only protects the title for those who hold it).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state", "citation": "08.48.281", "state": "AK"}}, {"field": "title_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict use of the profession's title to licensees? True if unlicensed people may NOT call themselves the protected title (e.g. 'podiatrist', 'CPA').", "depth": 0, "example": {"value": true, "quote": "use in connection with the person's name or otherwise assume or advertise a title or description tending to convey the impression that the person is an architect, an engineer, a land surveyor, or a la", "citation": "08.48.281", "state": "AK"}}, {"field": "scope_protection", "type": "boolean", "vocabulary": [], "meaning": "Does the state restrict practice of the profession's scope to licensees? True if performing the scope without a license is prohibited (independent of title use).", "depth": 0, "example": {"value": true, "quote": "A person may not practice or offer to practice the profession of architecture, engineering, land surveying, or landscape architecture in the state", "citation": "08.48.281", "state": "AK"}}, {"field": "disciplinary_grounds", "type": "list", "vocabulary": [], "meaning": "Grounds on which the board may discipline a licensee. Typical statutes list 5-15.", "depth": 0, "example": null}, {"field": "disciplinary_grounds[].short_label", "type": "string", "vocabulary": [], "meaning": "snake_case key, e.g. 'fraud_in_obtaining_license'", "depth": 1, "example": {"value": "fraud_in_obtaining_certificate", "state": "AK"}}, {"field": "disciplinary_grounds[].description", "type": "string", "vocabulary": [], "meaning": "One-line plain-English description", "depth": 1, "example": {"value": "Fraud or deceit in obtaining a certificate of registration", "state": "AK"}}, {"field": "alternative_regulation", "type": "object", "vocabulary": [], "meaning": "Non-credential regulatory mechanisms (bonding, insurance, establishment regulation) imposed by the state. Obama 2015 framework typology. Independent of credential_type.", "depth": 0, "example": null}, {"field": "alternative_regulation.bonding_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to post a bond (funds against which consumer claims can be made)? Independent of whether a credential is also required.", "depth": 1, "example": null}, {"field": "alternative_regulation.insurance_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute require the practitioner or firm to carry insurance (e.g., professional liability, surety insurance)?", "depth": 1, "example": {"value": false, "quote": "The board may include among the rules adopted governing the standards of practice of engineering, requirements regarding financial responsibility and professional liability insurance.", "citation": "4733.07", "state": "OH"}}, {"field": "alternative_regulation.establishment_regulation_required", "type": "boolean", "vocabulary": [], "meaning": "Does the statute regulate the ESTABLISHMENT / FIRM (e.g., facility license, mandatory inspection of premises) as a route to consumer protection, independent of any practitioner credential?", "depth": 1, "example": {"value": true, "quote": "a corporation, limited liability company, limited liability partnership, or limited partnership shall file with the board an application for a certificate of authorization", "citation": "08.48.241", "state": "AK"}}, {"field": "citations", "type": "list", "vocabulary": [], "meaning": "Statutory citations supporting the licensure fields above.", "depth": 0, "example": null}, {"field": "citations[].cite", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "08.48.011", "state": "AK"}}, {"field": "citations[].kind", "type": "string", "vocabulary": [], "meaning": "", "depth": 1, "example": {"value": "board_creation", "state": "AK"}}]}, {"group": "scope", "intro": "What the practice act le
