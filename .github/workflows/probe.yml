name: scrape-probe

on:
  schedule:
    # 06:00 UTC daily = 02:00 ET / 23:00 PT — overnight in US timezones
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape_probe/**"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scrape_probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scrape_probe/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run probe
        run: python probe.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-${{ github.run_id }}
          path: |
            scrape_probe/results/
            scrape_probe/logs/
          retention-days: 30

      - name: Render report into job summary
        if: always()
        run: |
          if [ -f results/probe_report.md ]; then
            cat results/probe_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit results to results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "scrape-probe-bot"
          git config user.email "scrape-probe-bot@users.noreply.github.com"
          # Stage just the report files (not the multi-MB snapshots)
          stamp=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          tmp=$(mktemp -d)
          cp results/probe_report.md results/probe_results.csv results/probe_results.json "$tmp/" || true
          cd ..
          git fetch origin probe-results || true
          if git ls-remote --exit-code --heads origin probe-results >/dev/null 2>&1; then
            git checkout probe-results
          else
            git checkout --orphan probe-results
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "runs/$stamp"
          cp "$tmp"/* "runs/$stamp/"
          cp "$tmp"/* ./   # latest at root for easy linking
          git add -A
          git commit -m "probe results $stamp" || echo "nothing to commit"
          git push origin probe-results
