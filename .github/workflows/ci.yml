name: ci

# Runs the offline test suite on every push and PR. The suite is fully mocked —
# no network, no API key, no Justia — so it needs only the package deps + pytest.
# (Installing via `pip install -e .` also validates that pyproject.toml can actually
# bootstrap the package, which is the thing that broke a fresh client setup before.)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q
