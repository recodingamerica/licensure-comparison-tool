name: pull-statutes

# Rotate-on-block bulk puller.
#
# Justia blocks by IP. Each GitHub-Actions run gets a fresh runner (fresh IP),
# so the strategy is: pull slowly on this runner until we either finish, run out
# of time budget, or hit a wall of consecutive blocks — then commit progress and
# dispatch a brand-new run on a fresh IP that resumes exactly where this one
# stopped (states with a healthy committed corpus are skipped).
#
# SELF-CHAINING NEEDS A PAT. The default GITHUB_TOKEN cannot trigger another
# workflow run (anti-recursion). Add a repo secret `PULL_PAT` — a PAT with
# Actions: read/write + Contents: read/write (classic: repo + workflow). Without
# it the run does a single pass and stops; re-dispatch manually to continue, or
# uncomment the `schedule:` block below to auto-continue via cron (no PAT).

on:
  workflow_dispatch:
    inputs:
      professions:
        description: "Comma-separated subset (blank = ALL matched professions)"
        required: false
        default: ""
      max_minutes:
        description: "Per-run wall-clock budget (minutes). Short = rotate IP more often."
        required: false
        default: "50"
      block_threshold:
        description: "Consecutive blocked states before bailing for a fresh runner"
        required: false
        default: "6"
      branch:
        description: "Branch to commit corpus progress to"
        required: false
        default: "data/pull-all"
      chain_remaining:
        description: "Max fresh runners left to spawn (self-chain budget)"
        required: false
        default: "30"
  # No-PAT alternative: uncomment to auto-continue every 30 min on a fresh IP.
  # Each tick resumes from committed progress. Keep per-run budget < interval.
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write   # lets the PAT-authenticated step re-dispatch this workflow

# One puller at a time — Justia must never see parallel pulling from us.
concurrency:
  group: pull-statutes
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Resolve inputs (defaults for cron/manual)
        id: cfg
        run: |
          echo "professions=${{ github.event.inputs.professions || '' }}"      >> "$GITHUB_OUTPUT"
          echo "max_minutes=${{ github.event.inputs.max_minutes || '50' }}"    >> "$GITHUB_OUTPUT"
          echo "block_threshold=${{ github.event.inputs.block_threshold || '6' }}" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.inputs.branch || 'data/pull-all' }}"   >> "$GITHUB_OUTPUT"
          echo "chain_remaining=${{ github.event.inputs.chain_remaining || '30' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install puller deps
        run: pip install "curl-cffi>=0.7" "beautifulsoup4>=4.12" "requests>=2.31" lxml

      - name: Pull (resumable, block-aware)
        id: pull
        run: |
          set +e
          python -m pipeline.ingest.pull_all \
            --professions "${{ steps.cfg.outputs.professions }}" \
            --max-minutes "${{ steps.cfg.outputs.max_minutes }}" \
            --block-threshold "${{ steps.cfg.outputs.block_threshold }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Driver exit code: $code (0=done, 75=work remains/rotate)"
          # Don't fail the job on 75 — that's an expected "rotate" signal.
          if [ "$code" = "0" ] || [ "$code" = "75" ]; then exit 0; else exit "$code"; fi

      - name: Commit corpus progress
        id: commit
        run: |
          git config user.name "pull-statutes-bot"
          git config user.email "pull-statutes-bot@users.noreply.github.com"
          git add pipeline/results/text
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            n=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "pull-statutes: corpus progress (${n} files) [skip ci]"
            git pull --rebase origin "${{ steps.cfg.outputs.branch }}" || true
            git push origin "HEAD:${{ steps.cfg.outputs.branch }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## pull-statutes run"
            echo "- professions: \`${{ steps.cfg.outputs.professions || 'ALL' }}\`"
            echo "- driver exit: \`${{ steps.pull.outputs.exit_code }}\` (0=done, 75=rotate)"
            echo "- committed: \`${{ steps.commit.outputs.pushed }}\`"
            echo "- chain_remaining: \`${{ steps.cfg.outputs.chain_remaining }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Spawn fresh runner if work remains
        if: steps.pull.outputs.exit_code == '75'
        env:
          GH_TOKEN: ${{ secrets.PULL_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Work remains but no PULL_PAT secret set — cannot self-chain. "\
                 "Re-dispatch manually or enable the schedule cron."
            exit 0
          fi
          remaining="${{ steps.cfg.outputs.chain_remaining }}"
          if [ "$remaining" -le 0 ]; then
            echo "::warning::chain_remaining exhausted — stopping. Re-dispatch to continue."
            exit 0
          fi
          next=$((remaining - 1))
          echo "Dispatching fresh runner (chain_remaining $remaining -> $next)…"
          gh workflow run pull-statutes.yml \
            --ref "${{ steps.cfg.outputs.branch }}" \
            -f professions="${{ steps.cfg.outputs.professions }}" \
            -f max_minutes="${{ steps.cfg.outputs.max_minutes }}" \
            -f block_threshold="${{ steps.cfg.outputs.block_threshold }}" \
            -f branch="${{ steps.cfg.outputs.branch }}" \
            -f chain_remaining="$next"
